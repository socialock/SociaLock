    <script>

        ============================================================ */

        const SUPABASE_URL =
            'https://mjuowfrzvgnqrazqnunr.supabase.co';

        const SUPABASE_ANON_KEY =
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qdW93ZnJ6dmducXJhenFudW5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNDY4MzgsImV4cCI6MjA5NTYyMjgzOH0.D9leYQRFsql9ONIsG4pPYdkQdWI_8SDL23wS8rlO7pk';


        /* ============================================================
           🧩 SUPABASE CLIENT
        ============================================================ */

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY, {
                    auth: {
                        autoRefreshToken: false,
                        persistSession: false
                    }
                }
            );


        /* ============================================================

        // Bad word list
        const BAD_WORDS = [
            'fuck', 'shit', 'asshole', 'bitch', 'cunt', 'dick', 'pussy',
            'motherfucker', 'nigga', 'nigger', 'chutiya', 'bhosdike',
            'madarchod', 'benchod', 'lund', 'gandu', 'harami', 'kutta',
            'rascal', 'bastard', 'whore', 'slut', 'fag', 'retard'
        ];

        // Harmful link patterns
        const HARMFUL_PATTERNS = [
            /\.onion/i,
            /bit\.ly/i,
            /tinyurl\.com/i,
            /goo\.gl/i,
            /shorturl\.at/i,
            /rb\.gy/i,
            /cutt\.ly/i,
            /ow\.ly/i,
            /is\.gd/i,
            /buff\.ly/i,
            /adf\.ly/i,
            /shorte\.st/i,

            /t\.co/i,

            /cli\.gs/i,
            /url\.go\.link/i
        ];


        /* ============================================================
           🛠 UTILITY
        ============================================================ */

        function generateRandomUsername() {
            const adjectives = [
                'Happy', 'Sad', 'Angry', 'Calm', 'Brave', 'Clever', 'Wise',
                'Wild', 'Tame', 'Swift', 'Bold', 'Mighty', 'Noble', 'Fierce',
                'Gentle', 'Silly', 'Funny', 'Serious', 'Shy', 'Loud', 'Quiet',
                'Lucky', 'Dark', 'Light', 'Bright', 'Dawn', 'Dusk', 'Star',
                'Moon', 'Sun', 'Sky', 'Ocean', 'Forest', 'Mountain', 'River'
            ];

            const nouns = [
                'Tiger', 'Lion', 'Wolf', 'Fox', 'Hawk', 'Eagle', 'Owl',
                'Bear', 'Deer', 'Falcon', 'Panther', 'Phoenix', 'Dragon',
                'Wizard', 'Knight', 'Ranger', 'Hunter', 'Seeker', 'Wanderer',
                'Dreamer', 'Runner', 'Flyer', 'Swimmer', 'Climber'
            ];

            const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
            const noun = nouns[Math.floor(Math.random() * nouns.length)];
            const num = Math.floor(Math.random() * 9000 + 1000);

            return `${adj}${noun}${num}`;
        }


        function formatTime(timestamp) {
            if (!timestamp) return '';
            const d = new Date(timestamp);
            return d.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }


        function sanitizeInput(text) {
            if (window.DOMPurify) {
                return window.DOMPurify.sanitize(text);
            }
            return text;
        }


        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }


        function containsBadWord(text) {
            const lower = text.toLowerCase();
            return BAD_WORDS.some(word => lower.includes(word));
        }


        function containsHarmfulLink(text) {
            return HARMFUL_PATTERNS.some(pattern => pattern.test(text));
        }


        /* ============================================================
           🔒 CONTENT FILTER
        ============================================================ */

        function filterMessage(text) {
            if (containsBadWord(text)) {
                return { allowed: false, reason: 'Profanity detected' };
            }

            if (containsHarmfulLink(text)) {
                return { allowed: false, reason: 'Harmful link detected' };
            }

            return { allowed: true };
        }


        /* ============================================================
           📡 DATABASE FUNCTIONS
        ============================================================ */

        // Load last 150 messages from database
        async function loadMessages() {
            try {
                const { data, error } = await supabaseClient
                    .from('global_messages')
                    .select('*')
                    .order('created_at', { ascending: true })
                    .limit(MAX_MESSAGES);

                if (error) {
                    console.error('Error loading messages:', error);
                    showToast('⚠️ Could not load messages');
                    return;
                }

                messages = data || [];
                renderMessages();

                console.log(`📥 Loaded ${messages.length} messages from database`);

            } catch (err) {
                console.error('Load error:', err);
                showToast('⚠️ Error loading messages');
            }
        }


        // Send message to database
        async function sendMessageToDB(text) {
            try {
                const { data, error } = await supabaseClient
                    .from('global_messages')
                    .insert([{
                        username: myUsername,
                        text: text,
                        created_at: new Date().toISOString(),
                        is_deleted: false
                    }])
                    .select();

                if (error) {
                    console.error('Insert error:', error);
                    showToast('⚠️ Error: ' + error.message);
                    return false;
                }

                // Add to local messages (realtime will also add it)
                if (data && data.length > 0) {
                    messages.push(data[0]);
                    if (messages.length > MAX_MESSAGES) {
                        messages = messages.slice(-MAX_MESSAGES);
                    }
                    renderMessages();
                }

                return true;

            } catch (err) {
                console.error('Send error:', err);
                showToast('⚠️ Error sending message');
                return false;
            }
        }


        /* ============================================================
           📡 REALTIME SUBSCRIPTION (Postgres Changes)
        ============================================================ */

        function subscribeToMessages() {
            if (channel) {
                try {
                    channel.unsubscribe();
                } catch (_) {}
                channel = null;
            }

            channel = supabaseClient
                .channel('global-messages-channel')
                .on(
                    'postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'global_messages'
                    },
                    (payload) => {
                        const newMsg = payload.new;

                        // Avoid duplicate if we just inserted it
                        const exists = messages.some(m => m.id === newMsg.id);
                        if (exists) return;

                        messages.push(newMsg);

                        // Keep only last 150
                        if (messages.length > MAX_MESSAGES) {
                            messages = messages.slice(-MAX_MESSAGES);
                        }

                        renderMessages();
                    }
                )
                .on(
                    'postgres_changes', {
                        event: 'UPDATE',
                        schema: 'public',
                        table: 'global_messages'
                    },
                    (payload) => {
                        const updated = payload.new;
                        const index = messages.findIndex(m => m.id === updated.id);
                        if (index !== -1) {
                            messages[index] = updated;
                            renderMessages();
                        }
                    }
                )
                .on(
                    'postgres_changes', {
                        event: 'DELETE',
                        schema: 'public',
                        table: 'global_messages'
                    },
                    (payload) => {
                        const deletedId = payload.old.id;
                        messages = messages.filter(m => m.id !== deletedId);
                        renderMessages();
                    }
                )
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        console.log('✅ Subscribed to global_messages');
                        isSubscribed = true;
                        statusDot.className = 'dot online';
                        statusText.textContent = 'Live';
                    } else {
                        console.warn('Subscribe status:', status);
                    }
                });
        }


        /* ============================================================
           🧹 RENDER MESSAGES
        ============================================================ */

        function renderMessages() {
            if (!messageContainer) return;

            if (!messages || messages.length === 0) {
                messageContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="greeting-icon">
                            <i class="fas fa-globe-asia"></i>
                        </div>
                        <div class="greeting-title">
                            Welcome to Global Chat
                        </div>
                        <div class="greeting-sub">
                            You are anonymous. Everyone sees a random name.
                            <br>
                            Be kind. Stay safe.
                        </div>
                    </div>
                `;
                return;
            }

            const currentUser = myUsername || 'Anonymous';
            let html = '';

            messages.forEach((msg) => {
                const isSelf = msg.username === currentUser;
                const avatarLetter = msg.username ? msg.username.charAt(0).toUpperCase() : '?';
                const timeStr = msg.created_at ? formatTime(msg.created_at) : '';

                let content = '';

                if (msg.is_deleted) {
                    content = `
                        <span class="text" style="font-style:italic;color:#566173;">
                            This message was removed
                        </span>
                    `;
                } else {
                    let displayText = msg.text || '';
                    let isFiltered = false;

                    if (displayText) {
                        const filterResult = filterMessage(displayText);
                        if (!filterResult.allowed) {
                            displayText = '⛔ This message was blocked by content filter';
                            isFiltered = true;
                        }
                    }

                    const cleanText = sanitizeInput(displayText);

                    content = `
                        <span class="text ${isFiltered ? 'deleted' : ''}">
                            ${cleanText}
                        </span>
                    `;
                }

                const cleanUsername = sanitizeInput(msg.username || 'Unknown');

                html += `
                    <div class="msg ${isSelf ? 'self' : ''}">
                        <div class="avatar">${escapeHtml(avatarLetter)}</div>
                        <div class="bubble ${msg.is_deleted ? 'deleted' : ''}">
                            <span class="sender">${cleanUsername}</span>
                            ${content}
                            <span class="time">${timeStr}</span>
                        </div>
                    </div>
                `;
            });

            const cleanHtml = sanitizeInput(html);
            messageContainer.innerHTML = cleanHtml;

            requestAnimationFrame(() => {
                messageContainer.scrollTop = messageContainer.scrollHeight;
            });
        }


        /* ============================================================
           📤 SEND MESSAGE
        ============================================================ */

        async function sendMessage() {
            const text = chatInput.value.trim();

            if (!text) {
                chatInput.focus();
                return;
            }

            // Rate limiting
            const now = Date.now();
            if (now - lastMessageTime < MIN_INTERVAL) {
                showToast('⏳ Please wait 2 seconds between messages');
                return;
            }

            // Content filter
            const filterResult = filterMessage(text);
            if (!filterResult.allowed) {
                showToast(`⛔ ${filterResult.reason}`);
                chatInput.value = '';
                chatInput.focus();
                return;
            }

            lastMessageTime = now;

            const success = await sendMessageToDB(text);

            if (success) {
                chatInput.value = '';
                chatInput.focus();
            }
        }


        /* ============================================================
           🚀 INIT
        ============================================================ */

        async function init() {
            // Generate random username
            myUsername = generateRandomUsername();
            userBadge.textContent = myUsername;

            console.log(`👤 Your username: ${myUsername}`);

            // Load messages from database
            await loadMessages();

            // Setup realtime subscription
            subscribeToMessages();

            chatInput.focus();
        }


        /* ============================================================
           TOAST
        ============================================================ */

        function showToast(msg, duration = 3000) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }


        /* ============================================================
           🎯 EVENT LISTENERS
        ============================================================ */

        sendMsgBtn.addEventListener('click', sendMessage);

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        refreshBtn.addEventListener('click', async () => {
            showToast('🔄 Refreshing...');
            await loadMessages();
            showToast('✅ Refreshed');
        });

        document.addEventListener('click', () => {
            if (document.activeElement !== chatInput) {
                chatInput.focus();
            }
        });


        /* ============================================================
           🧹 CLEANUP
        ============================================================ */

        window.addEventListener('beforeunload', () => {
            if (channel) {
                try {
                    channel.unsubscribe();
                } catch (_) {}
            }
        });


        /* ============================================================
           🚀 START
        ============================================================ */

        console.log('🌍 Global Chat · Database Powered');
        console.log('🔒 Security features:');
        console.log('  • Random anonymous usernames');
        console.log('  • Rate limiting (2s between messages)');
        console.log('  • Bad word filtering');
        console.log('  • Harmful link detection');
        console.log('  • XSS protection (DOMPurify)');
        console.log('  • Max 150 messages (database auto-cleanup)');
        console.log('  • Real-time updates (Postgres Changes)');

        init();
    </script>
