<style>
/* ============================================================
   RESET
============================================================ */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#07090d;
    color:#e9edf3;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
                 "Helvetica Neue",Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ============================================================
   APP
============================================================ */
.app{
    width:min(760px,100%);
    height:100dvh;
    max-height:100dvh;
    min-height:0;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    background:#080b10;
    border:1px solid rgba(255,255,255,.07);

    box-shadow:
        0 20px 70px rgba(0,0,0,.55);

    position:relative;
}

/* ============================================================
   HEADER
============================================================ */
.header{
    flex:0 0 64px;
    height:64px;
    min-height:64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 14px;

    background:rgba(13,17,24,.97);

    border-bottom:1px solid rgba(255,255,255,.07);

    position:relative;
    z-index:20;

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.header-left{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.back-btn{
    width:38px;
    height:38px;

    border:none;
    background:transparent;

    color:#8793a5;
    font-size:16px;

    border-radius:50%;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.2s;
}

.back-btn:hover{
    background:rgba(255,255,255,.06);
    color:#fff;
}

.header-title{
    min-width:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.header-title .name{
    color:#edf1f7;
    font-size:15px;
    font-weight:650;
    line-height:20px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-title .status{
    display:flex;
    align-items:center;
    gap:5px;

    color:#687588;
    font-size:10px;
    line-height:14px;
}

.status .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    display:inline-block;
}

.status .dot.online{
    background:#42d392;
    box-shadow:0 0 7px rgba(66,211,146,.6);
}

.status .dot.offline{
    background:#687588;
}

.header-right{
    display:flex;
    align-items:center;
}

.header-right button{
    width:38px;
    height:38px;

    border:0;
    background:transparent;

    color:#7f8a9b;
    font-size:16px;

    border-radius:50%;

    cursor:pointer;

    transition:.2s;

    display:flex;
    align-items:center;
    justify-content:center;
}

.header-right button:hover{
    background:rgba(255,255,255,.06);
    color:#fff;
}

/* ============================================================
   TABS
============================================================ */
.tabs-container{
    flex:0 0 auto;

    display:flex;

    margin:10px 12px 0;
    padding:4px;

    border-radius:13px;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.06);
}

.tab-btn{
    flex:1;

    height:38px;

    border:0;
    background:transparent;

    color:#697588;

    font-family:inherit;
    font-size:12px;
    font-weight:600;

    border-radius:9px;

    cursor:pointer;

    position:relative;

    transition:.2s;
}

.tab-btn:hover{
    color:#cbd3df;
}

.tab-btn.active{
    color:#fff;
    background:#151b25;

    box-shadow:
        0 2px 8px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.04);
}

.tab-btn.active::after{
    display:none;
}

/* ============================================================
   TAB CONTENT
============================================================ */
.tab-content{
    display:none;

    flex:0 0 auto;

    padding:14px 16px 18px;

    background:#080b10;
}

.tab-content.active{
    display:block;
}

/* ============================================================
   AUTH
============================================================ */
.auth-form .form-group{
    margin-bottom:9px;
}

.auth-form .form-group input{
    width:100%;
    height:44px;

    padding:0 14px;

    border-radius:11px;

    border:1px solid rgba(255,255,255,.07);

    background:#10151d;

    color:#edf1f7;

    font-family:inherit;
    font-size:13px;

    outline:none;

    transition:.2s;
}

.auth-form .form-group input:focus{
    border-color:rgba(79,156,255,.45);
    background:#121a25;

    box-shadow:0 0 0 3px rgba(79,156,255,.06);
}

.auth-form .form-group input::placeholder{
    color:#566174;
}

.auth-form .btn-auth{
    width:100%;
    height:44px;

    border:0;
    border-radius:11px;

    background:linear-gradient(135deg,#4c97ff,#635de7);

    color:#fff;

    font-family:inherit;
    font-size:13px;
    font-weight:600;

    cursor:pointer;

    box-shadow:
        0 7px 20px rgba(65,120,220,.18),
        inset 0 1px 0 rgba(255,255,255,.15);

    transition:.2s;
}

.auth-form .btn-auth:hover{
    filter:brightness(1.08);
    transform:translateY(-1px);
}

.auth-form .btn-auth:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
}

.auth-form .hint{
    color:#4f5a6b;
    font-size:9px;

    text-align:center;

    margin-top:8px;
}

/* ============================================================
   MESSENGER
   IMPORTANT:
   ONLY MESSAGE AREA SCROLLS
============================================================ */
.messenger{
    display:none;

    flex:1 1 auto;

    width:100%;

    height:0;
    min-height:0;

    flex-direction:column;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(79,156,255,.035),
            transparent 48%
        ),
        #080b10;
}

.messenger.visible{
    display:flex;
}

/* ============================================================
   MESSAGE AREA
============================================================ */
.messages-area{
    flex:1 1 auto;

    width:100%;
    height:0;
    min-height:0;

    overflow-y:auto;
    overflow-x:hidden;

    padding:15px 16px 12px;

    scroll-behavior:smooth;

    overscroll-behavior:contain;

    -webkit-overflow-scrolling:touch;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(79,156,255,.025),
            transparent 50%
        );
}

.messages-area::-webkit-scrollbar{
    width:4px;
}

.messages-area::-webkit-scrollbar-track{
    background:transparent;
}

.messages-area::-webkit-scrollbar-thumb{
    background:rgba(130,145,170,.24);
    border-radius:20px;
}

/* ============================================================
   EMPTY
============================================================ */
.empty-state{
    width:100%;
    min-height:100%;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:20px;
}

.empty-state .greeting-icon{
    width:64px;
    height:64px;

    border-radius:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#263344;

    background:rgba(255,255,255,.025);

    border:1px solid rgba(255,255,255,.04);

    font-size:27px;

    margin-bottom:15px;
}

.empty-state .greeting-title{
    color:#8490a2;

    font-size:13px;
    font-weight:500;

    margin-bottom:5px;
}

.empty-state .greeting-sub{
    max-width:280px;

    color:#4f5a6b;

    font-size:10px;
    line-height:1.6;
}

.empty-state .highlight{
    color:#589bff;
    cursor:pointer;
}

/* ============================================================
   MESSAGE
============================================================ */
.msg{
    display:flex;
    align-items:flex-end;

    gap:8px;

    margin-bottom:9px;

    animation:fadeIn .18s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.msg .avatar{
    width:32px;
    height:32px;

    flex:0 0 32px;

    border-radius:11px;

    background:#151c27;

    border:1px solid rgba(255,255,255,.05);

    color:#7d8ba0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:12px;
    font-weight:700;

    text-transform:uppercase;
}

.msg .bubble{
    max-width:min(78%,520px);

    padding:7px 12px 7px;

    border-radius:17px 17px 17px 5px;

    background:#111722;

    border:1px solid rgba(255,255,255,.06);

    color:#e7ebf1;

    line-height:1.45;

    box-shadow:
        0 2px 8px rgba(0,0,0,.13);
}

.msg .bubble .sender{
    display:block;

    color:#5d9cff;

    font-size:10px;
    font-weight:600;

    margin-bottom:2px;
}

.msg .bubble .text{
    display:block;

    word-break:break-word;

    font-size:13px;
}

.msg .bubble .time{
    display:block;

    color:#566173;

    font-size:7px;

    margin-top:3px;

    text-align:right;
}

.msg.self{
    flex-direction:row-reverse;
}

.msg.self .bubble{
    border-radius:17px 17px 5px 17px;

    background:
        linear-gradient(
            145deg,
            #29496f,
            #263b57
        );

    border-color:rgba(110,165,230,.15);
}

.msg.self .bubble .sender{
    color:#8ab9ef;
}

/* ============================================================
   FILE
============================================================ */
.msg .bubble .file-attachment{
    display:block;

    margin:5px 0 2px;

    padding:8px 10px;

    background:#0c1118;

    border-radius:9px;

    border:1px solid rgba(255,255,255,.06);

    color:#aab5c5;

    text-decoration:none;

    font-size:11px;

    transition:.15s;

    word-break:break-word;
}

.msg .bubble .file-attachment:hover{
    border-color:rgba(79,156,255,.4);
}

.msg .bubble .file-attachment i{
    margin-right:5px;
}

.msg .bubble .file-size{
    color:#586476;
    font-size:8px;
}

.msg .bubble .file-preview{
    display:block;

    max-width:100%;
    max-height:240px;

    border-radius:10px;

    margin-top:5px;

    border:1px solid rgba(255,255,255,.06);
}

.msg.self .bubble .file-attachment{
    background:#1b2b40;
    border-color:rgba(110,165,230,.13);
}

/* ============================================================
   INPUT ROW
   THIS NEVER SCROLLS
============================================================ */
.input-row{
    flex:0 0 auto;

    width:100%;

    min-height:64px;

    display:flex;
    align-items:center;

    gap:6px;

    padding:
        8px
        12px
        calc(8px + env(safe-area-inset-bottom));

    background:rgba(8,11,16,.98);

    border-top:1px solid rgba(255,255,255,.06);

    position:relative;
    z-index:30;

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.input-row input[type="text"]{
    flex:1 1 auto;

    min-width:0;

    height:44px;

    padding:0 16px;

    border-radius:22px;

    border:1px solid rgba(255,255,255,.075);

    background:#111722;

    color:#edf2f8;

    font-family:inherit;
    font-size:14px;

    outline:none;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.025);

    transition:.2s;
}

.input-row input[type="text"]:focus{
    border-color:rgba(79,156,255,.42);

    background:#131b28;

    box-shadow:
        0 0 0 3px rgba(79,156,255,.06);
}

.input-row input[type="text"]::placeholder{
    color:#667286;
}

.input-row input[type="text"]:disabled{
    opacity:.4;
}

.input-row .file-btn{
    flex:0 0 40px;

    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:transparent;

    color:#718096;

    font-size:16px;

    cursor:pointer;

    transition:.2s;
}

.input-row .file-btn:hover{
    background:rgba(255,255,255,.06);
    color:#b4bfce;
}

.input-row .file-btn input[type="file"]{
    display:none;
}

.input-row button{
    flex:0 0 42px;

    width:42px;
    height:42px;

    padding:0;

    border:0;
    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #4d98ff,
            #6559e8
        );

    color:#fff;

    font-size:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:
        0 5px 18px rgba(67,130,230,.25),
        inset 0 1px 0 rgba(255,255,255,.18);

    transition:.2s;
}

.input-row button:hover{
    transform:scale(1.04);
}

.input-row button:active{
    transform:scale(.96);
}

.input-row button:disabled{
    opacity:.4;
    transform:none;
}

/* ============================================================
   SIDE MENU
============================================================ */
.sidemenu-overlay{
    display:none;

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.62);

    z-index:2000;

    backdrop-filter:blur(2px);
}

.sidemenu-overlay.show{
    display:block;
}

.sidemenu{
    position:fixed;

    top:0;
    right:-280px;

    width:260px;
    height:100dvh;

    background:#11151c;

    z-index:2001;

    border-left:1px solid rgba(255,255,255,.07);

    box-shadow:-12px 0 40px rgba(0,0,0,.5);

    display:flex;
    flex-direction:column;

    transition:right .28s cubic-bezier(.4,0,.2,1);
}

.sidemenu.open{
    right:0;
}

.sidemenu-header{
    height:64px;

    flex:0 0 64px;

    padding:0 16px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid rgba(255,255,255,.06);
}

.sidemenu-header .title{
    color:#8994a5;

    font-size:11px;
    font-weight:700;

    text-transform:uppercase;
    letter-spacing:1px;
}

.sidemenu-close{
    width:36px;
    height:36px;

    border:0;
    border-radius:50%;

    background:transparent;

    color:#7d8999;

    cursor:pointer;
}

.sidemenu-close:hover{
    background:rgba(255,255,255,.06);
    color:#fff;
}

.sidemenu-body{
    flex:1;

    padding:8px 0;

    overflow-y:auto;
}

.sidemenu-body .menu-item{
    width:100%;

    min-height:46px;

    display:flex;
    align-items:center;

    gap:13px;

    padding:0 17px;

    border:0;
    background:transparent;

    color:#dce2ea;

    font-family:inherit;
    font-size:13px;

    text-align:left;

    cursor:pointer;

    transition:.15s;
}

.sidemenu-body .menu-item:hover{
    background:rgba(255,255,255,.05);
}

.sidemenu-body .menu-item .icon{
    width:24px;

    text-align:center;

    color:#7d8a9d;

    font-size:14px;
}

.sidemenu-body .menu-item .badge-count{
    margin-left:auto;

    min-width:22px;

    padding:2px 7px;

    border-radius:12px;

    background:#3c80d0;

    color:#fff;

    font-size:9px;
    font-weight:700;

    text-align:center;
}

.sidemenu-body .menu-divider{
    height:1px;

    background:rgba(255,255,255,.06);

    margin:7px 14px;
}

.sidemenu-body .menu-item.danger{
    color:#ed667b;
}

.sidemenu-body .menu-item.danger .icon{
    color:#ed667b;
}

.sidemenu-footer{
    flex:0 0 auto;

    padding:
        12px
        16px
        calc(12px + env(safe-area-inset-bottom));

    border-top:1px solid rgba(255,255,255,.06);

    color:#4f5a6b;

    font-size:9px;

    text-align:center;
}

/* ============================================================
   TOAST
============================================================ */
.toast{
    position:fixed;

    left:50%;
    bottom:30px;

    transform:translate(-50%,12px);

    max-width:90%;

    padding:9px 18px;

    border-radius:12px;

    background:#151a22;

    border:1px solid rgba(255,255,255,.08);

    color:#e6ebf2;

    font-size:11px;

    box-shadow:0 10px 30px rgba(0,0,0,.5);

    z-index:9999;

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* ============================================================
   MOBILE
============================================================ */
@media(max-width:600px){

    html,
    body{
        width:100%;
        height:100%;

        overflow:hidden;
    }

    body{
        display:block;
        padding:0;

        background:#080b10;
    }

    .app{
        width:100%;
        height:100dvh;

        min-height:0;
        max-height:none;

        border:0;
        border-radius:0;

        overflow:hidden;
    }

    .header{
        flex:0 0 60px;

        height:60px;
        min-height:60px;

        padding:0 9px;
    }

    .header-title .name{
        font-size:14px;
    }

    .tabs-container{
        margin:9px 10px 0;
    }

    .tab-btn{
        height:36px;
        font-size:11px;
    }

    .tab-content{
        padding:12px 12px 15px;
    }

    .messenger{
        flex:1 1 auto;

        width:100%;
        height:0;
        min-height:0;

        overflow:hidden;
    }

    .messages-area{
        flex:1 1 auto;

        height:0;
        min-height:0;

        padding:
            11px
            9px
            8px;

        overflow-y:auto;
        overflow-x:hidden;

        -webkit-overflow-scrolling:touch;

        overscroll-behavior-y:contain;
    }

    .input-row{
        flex:0 0 auto;

        min-height:60px;

        padding:
            7px
            8px
            calc(7px + env(safe-area-inset-bottom));

        gap:4px;
    }

    .input-row input[type="text"]{
        height:42px;

        border-radius:21px;

        padding:0 14px;

        font-size:13px;
    }

    .input-row .file-btn{
        width:38px;
        height:38px;

        flex-basis:38px;

        font-size:15px;
    }

    .input-row button{
        width:41px;
        height:41px;

        flex-basis:41px;
    }

    .msg{
        gap:6px;
        margin-bottom:8px;
    }

    .msg .avatar{
        width:30px;
        height:30px;

        flex-basis:30px;

        border-radius:10px;

        font-size:11px;
    }

    .msg .bubble{
        max-width:84%;

        padding:7px 10px;

        border-radius:15px 15px 15px 4px;
    }

    .msg.self .bubble{
        border-radius:15px 15px 4px 15px;
    }

    .msg .bubble .sender{
        font-size:9px;
    }

    .msg .bubble .text{
        font-size:13px;
    }

    .msg .bubble .time{
        font-size:7px;
    }

    .msg .bubble .file-preview{
        max-height:220px;
    }

    .sidemenu{
        width:250px;
        right:-250px;
    }
}

/* ============================================================
   SMALL PHONES
============================================================ */
@media(max-width:380px){

    .header{
        flex-basis:58px;
        height:58px;
        min-height:58px;
    }

    .input-row{
        min-height:58px;
    }

    .input-row input[type="text"]{
        height:40px;
    }

    .input-row button{
        width:39px;
        height:39px;
        flex-basis:39px;
    }

    .input-row .file-btn{
        width:35px;
        height:35px;
        flex-basis:35px;
    }

    .msg .bubble{

<script>

/* ============================================================
   DOM

const $ = id => document.getElementById(id);

const statusText = $('statusText');

const createRoomBtn = $('createRoomBtn');

tabsContainer.querySelectorAll('.tab-btn');

$('sidemenuOverlay');

$('sidemenuClose');

$('menuLeaveRoom');

$('joinedCount');

$('greetingHighlight');

/* ============================================================
   STATE

let currentRoomId = null;
let currentUsername = '';

let messages = [];
let joinCode = '';
let participants = new Set();


/* ============================================================
   UTILITY
============================================================ */

function generateJoinCode(){

    const chars =
    'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

    let code = '';

    for(let i = 0; i < 64; i++){

        const randomIndex =
        crypto.getRandomValues(
            new Uint32Array(1)
        )[0] % chars.length;

        code += chars[randomIndex];
    }

    return code;
}


function formatFileSize(bytes){

    if(bytes < 1024)
        return bytes + ' B';

    if(bytes < 1048576)
        return (bytes / 1024).toFixed(1) + ' KB';

    return (bytes / 1048576).toFixed(1) + ' MB';
}


function getFileIcon(mimeType){

    if(!mimeType)
        return 'fa-file';

    if(mimeType.startsWith('image/'))
        return 'fa-file-image';

    if(mimeType.startsWith('video/'))
        return 'fa-file-video';

    if(mimeType.startsWith('audio/'))
        return 'fa-file-audio';

    if(
        mimeType.includes('zip') ||
        mimeType.includes('rar')
    )
        return 'fa-file-archive';

    if(mimeType.includes('pdf'))
        return 'fa-file-pdf';

    if(mimeType.includes('text'))
        return 'fa-file-alt';

    return 'fa-file';
}


function isImageFile(mimeType){

    return mimeType &&
           mimeType.startsWith('image/');
}


function isVideoFile(mimeType){

    return mimeType &&
           mimeType.startsWith('video/');
}


/* ============================================================
   TOAST
============================================================ */

function showToast(msg,duration=3000){

    toast.textContent = msg;

    toast.classList.add('show');

    clearTimeout(toast._timer);

    toast._timer =
    setTimeout(()=>{
        toast.classList.remove('show');
    },duration);
}


/* ============================================================
   COPY
============================================================ */

function copyToClipboard(text){

    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard
        .writeText(text)
        .then(()=>{
            showToast('✅ Token copied!');
        })
        .catch(()=>{
            fallbackCopy(text);
        });

    }else{

        fallbackCopy(text);
    }
}


function fallbackCopy(text){

    const ta =
    document.createElement('textarea');

    ta.value = text;

    ta.style.position = 'fixed';
    ta.style.opacity = '0';

    document.body.appendChild(ta);

    ta.select();

    try{

        document.execCommand('copy');

        showToast('✅ Token copied!');

    }catch(_){

        showToast('⚠️ Copy manually');
    }

    document.body.removeChild(ta);
}


function shareCode(code){

    if(navigator.share){

        navigator.share({

            title:'Chat Room Join Code',

            text:
            `Join my chat room with this code: ${code}`

        }).catch(()=>{});

    }else{

        copyToClipboard(code);
    }
}


/* ============================================================
   STATUS
============================================================ */

function updateStatus(isOnline,text){

    statusDot.className =
    'dot ' + (isOnline ? 'online' : 'offline');

    statusText.textContent =
    text || (isOnline ? 'Online' : 'Offline');
}


/* ============================================================
   TABS
============================================================ */

function switchTab(tabId){

    tabBtns.forEach(btn=>{
        btn.classList.remove('active');
    });

    document
    .querySelector(
        `.tab-btn[data-tab="${tabId}"]`
    )
    .classList.add('active');


    if(tabId === 'create'){

        tabCreate.classList.add('active');
        tabJoin.classList.remove('active');

    }else{

        tabJoin.classList.add('active');
        tabCreate.classList.remove('active');
    }
}


/* ============================================================
   PARTICIPANTS
============================================================ */

function updateJoinedCount(){

    const count =
    participants.size || 0;

    joinedCount.textContent = count;
}


/* ============================================================
   RENDER MESSAGES
============================================================ */

function renderMessages(){

    if(!messageContainer)
        return;


    if(!messages || messages.length === 0){

        messageContainer.innerHTML = `

            <div class="empty-state">

                <div class="greeting-icon">
                    <i class="fas fa-comment-dots"></i>
                </div>

                <div class="greeting-title">
                    No messages here yet...
                </div>

                <div class="greeting-sub">
                    Send a message or tap the
                    <span class="highlight"
                          id="greetingHighlight">
                        greeting
                    </span>
                    below.
                </div>

            </div>
        `;


        const newHighlight =
        document.getElementById(
            'greetingHighlight'
        );

        if(newHighlight){

            newHighlight.addEventListener(
                'click',
                ()=>{
                    if(
                        chatInput &&
                        !chatInput.disabled
                    ){
                        chatInput.focus();
                    }
                }
            );
        }

        return;
    }


    const currentUser =
    currentUsername || 'Me';

    let html = '';


    messages.forEach(msg=>{

        const isSelf =
        msg.username === currentUser;

        const avatarLetter =
        msg.username
        ? msg.username.charAt(0).toUpperCase()
        : '?';


        const timeStr =
        msg.time
        ? new Date(msg.time)
            .toLocaleTimeString(
                'en-US',
                {
                    hour:'2-digit',
                    minute:'2-digit'
                }
            )
        : '';


        let content = '';


        if(msg.text){

            content += `
                <span class="text">
                    ${escapeHtml(msg.text)}
                </span>
            `;
        }


        if(msg.file){

            const icon =
            getFileIcon(
                msg.file.mimeType
            );

            const size =
            formatFileSize(
                msg.file.size
            );

            const isImg =
            isImageFile(
                msg.file.mimeType
            );

            const isVid =
            isVideoFile(
                msg.file.mimeType
            );


            content += `

                <a
                    href="${msg.file.url}"
                    target="_blank"
                    class="file-attachment"
                    download="${escapeHtml(msg.file.name)}"
                >

                    <i class="fas ${icon}"></i>

                    <span>
                        ${escapeHtml(msg.file.name)}
                    </span>

                    <span class="file-size">
                        (${size})
                    </span>

                </a>
            `;


            if(isImg){

                content += `

                    <img
                        src="${msg.file.url}"
                        class="file-preview"
                        alt="${escapeHtml(msg.file.name)}"
                    >
                `;
            }


            if(isVid){

                content += `

                    <video
                        src="${msg.file.url}"
                        class="file-preview"
                        controls
                    ></video>
                `;
            }
        }


        html += `

            <div class="msg ${isSelf ? 'self' : ''}">

                <div class="avatar">
                    ${escapeHtml(avatarLetter)}
                </div>

                <div class="bubble">

                    <span class="sender">
                        ${escapeHtml(msg.username || 'Unknown')}
                    </span>

                    ${content}

                    <span class="time">
                        ${timeStr}
                    </span>

                </div>

            </div>
        `;
    });


    messageContainer.innerHTML = html;

    requestAnimationFrame(()=>{
        messageContainer.scrollTop =
        messageContainer.scrollHeight;
    });
}


/* ============================================================
   HTML ESCAPE
============================================================ */

function escapeHtml(value){

    return String(value ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}


/* ============================================================
   REALTIME
============================================================ */

function setupRealtime(roomId,username){

    if(channel){

        try{
            channel.unsubscribe();
        }catch(_){}

        channel = null;
    }


    if(!roomId)
        return;


    currentRoomId = roomId;
    currentUsername = username;

    participants.clear();

    participants.add(username);


    const channelName =
    `room:${roomId}`;


    channel =
    supabaseClient.channel(
        channelName,
        {
            config:{
                broadcast:{
                    ack:true
                }
            }
        }
    );


    channel.on(
        'broadcast',
        {event:'message'},
        (payload)=>{

            const {
                username:sender,
                text,
                file,
                time
            } = payload.payload;


            messages.push({
                username:sender,
                text,
                file,
                time
            });


            participants.add(sender);

            updateJoinedCount();

            renderMessages();
        }
    );


    channel.subscribe((status)=>{

        if(status === 'SUBSCRIBED'){

            console.log(
                `✅ Connected to room ${roomId}`
            );


            chatInput.disabled = false;
            sendMsgBtn.disabled = false;
            fileInput.disabled = false;

            messenger.classList.add('visible');

            updateStatus(true,'Online');

            chatTitle.textContent =
            'Chat Room';


            setTimeout(()=>{

                channel.send({

                    type:'broadcast',

                    event:'message',

                    payload:{

                        username:
                        '🟢 ' + username,

                        text:
                        'joined the room',

                        time:Date.now()
                    }

                });

            },500);


            setTimeout(()=>{
                chatInput.focus();
            },100);

        }else{

            console.warn(
                'Subscribe status:',
                status
            );
        }
    });


    chatInput.disabled = false;
    sendMsgBtn.disabled = false;
    fileInput.disabled = false;

    messages = [];

    participants.add(username);

    updateJoinedCount();

    renderMessages();
}


/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendChatMessage(
    text,
    fileData=null
){

    if(!channel || !currentRoomId)
        return false;


    const msgData = {

        username:
        currentUsername || 'Guest',

        time:
        Date.now()
    };


    if(text)
        msgData.text = text;


    if(fileData)
        msgData.file = fileData;


    const {error} =
    await channel.send({

        type:'broadcast',

        event:'message',

        payload:msgData
    });


    if(error){

        showToast(
            '⚠️ Error: ' + error.message
        );

        return false;
    }


    messages.push(msgData);

    participants.add(
        currentUsername
    );

    updateJoinedCount();

    renderMessages();

    return true;
}


/* ============================================================
   FILE UPLOAD
============================================================ */

async function handleFileUpload(file){

    if(
        file.size >
        50 * 1024 * 1024
    ){

        showToast(
            '⚠️ Max 50MB allowed'
        );

        return;
    }


    try{

        showToast('📤 Uploading...');


        const reader =
        new FileReader();


        const base64 =
        await new Promise(
            (resolve,reject)=>{

                reader.onload =
                ()=>{
                    resolve(
                        reader.result
                    );
                };

                reader.onerror = reject;

                reader.readAsDataURL(file);
            }
        );


        const fileData = {

            name:file.name,

            size:file.size,

            mimeType:file.type,

            url:base64
        };


        const success =
        await sendChatMessage(
            null,
            fileData
        );


        if(success){

            showToast(
                '✅ File shared!'
            );
        }


    }catch(error){

        console.error(
            'File upload error:',
            error
        );

        showToast(
            '⚠️ Upload failed'
        );
    }
}


/* ============================================================
   CREATE ROOM
============================================================ */

async function handleCreateRoom(){

    const username =
    createUsername.value.trim() ||
    'Guest';


    if(username.length < 2){

        showToast(
            '⚠️ Name must be at least 2 characters'
        );

        return;
    }


    joinCode =
    generateJoinCode();


    const roomId =
    joinCode;


    currentUsername =
    username;


    tabsContainer.style.display =
    'none';


    setupRealtime(
        roomId,
        username
    );


    createRoomBtn.disabled = true;

    createRoomBtn.innerHTML =
    '<i class="fas fa-check"></i> Created';

    createUsername.disabled = true;


    showToast(
        '🎉 Room created!'
    );


    chatInput.focus();
}


/* ============================================================
   JOIN ROOM
============================================================ */

async function handleJoinRoom(){

    const username =
    joinUsername.value.trim() ||
    'Guest';


    const code =
    joinCodeInput.value.trim();


    if(username.length < 2){

        showToast(
            '⚠️ Name must be at least 2 characters'
        );

        return;
    }


    if(code.length !== 64){

        showToast(
            '⚠️ Enter a valid 64-character code'
        );

        return;
    }


    const roomId = code;

    joinCode = code;

    currentUsername =
    username;


    tabsContainer.style.display =
    'none';


    setupRealtime(
        roomId,
        username
    );


    joinUsername.disabled = true;

    joinCodeInput.disabled = true;

    joinRoomBtn.disabled = true;

    joinRoomBtn.innerHTML =
    '<i class="fas fa-spinner fa-spin"></i> Joining...';


    showToast(
        '✅ Joined the room!'
    );


    chatInput.focus();
}


/* ============================================================
   LEAVE ROOM
============================================================ */

function leaveRoom(){

    if(channel){

        try{
            channel.unsubscribe();
        }catch(_){}

        channel = null;
    }


    currentRoomId = null;

    currentUsername = '';

    messages = [];

    joinCode = '';

    participants.clear();


    tabsContainer.style.display =
    'flex';

    messenger.classList.remove(
        'visible'
    );


    updateStatus(
        false,
        'Ready'
    );


    chatTitle.textContent =
    'p2p';


    chatInput.disabled = true;

    sendMsgBtn.disabled = true;

    fileInput.disabled = true;


    createRoomBtn.disabled = false;

    createRoomBtn.innerHTML =
    '<i class="fas fa-rocket"></i> Create Room';

    createUsername.disabled = false;

    createUsername.value = '';


    joinUsername.disabled = false;

    joinCodeInput.disabled = false;

    joinRoomBtn.disabled = false;

    joinRoomBtn.innerHTML =
    '<i class="fas fa-door-open"></i> Join Room';

    joinUsername.value = '';

    joinCodeInput.value = '';


    updateJoinedCount();

    switchTab('create');


    messageContainer.innerHTML = `

        <div class="empty-state">

            <div class="greeting-icon">
                <i class="fas fa-comment-dots"></i>
            </div>

            <div class="greeting-title">
                No messages here yet...
            </div>

            <div class="greeting-sub">
                Send a message or tap the
                <span
                    class="highlight"
                    id="greetingHighlight"
                >
                    greeting
                </span>
                below.
            </div>

        </div>
    `;


    const newHighlight =
    document.getElementById(
        'greetingHighlight'
    );


    if(newHighlight){

        newHighlight.addEventListener(
            'click',
            ()=>{
                if(
                    chatInput &&
                    !chatInput.disabled
                ){
                    chatInput.focus();
                }
            }
        );
    }


    showToast(
        '👋 Left the room'
    );
}

tabBtns.forEach(btn=>{

sendMsgBtn.addEventListener(

);


/* ============================================================
   SIDE MENU CLOSE
============================================================ */

sidemenuClose.addEventListener(
    'click',
    ()=>{

        sidemenu.classList.remove(
            'open'
        );

        sidemenuOverlay.classList.remove(
            'show'
        );
    }
);


sidemenuOverlay.addEventListener(
    'click',
    ()=>{

        sidemenu.classList.remove(
            'open'
        );

        sidemenuOverlay.classList.remove(
            'show'
        );
    }
);


/* ============================================================
   COPY TOKEN
============================================================ */

menuCopyToken.addEventListener(
    'click',
    ()=>{

        if(joinCode){

            copyToClipboard(
                joinCode
            );

            showToast(
                '✅ Token copied!'
            );

        }else{

            showToast(
                '⚠️ No room active'
            );
        }


        sidemenu.classList.remove(
            'open'
        );

        sidemenuOverlay.classList.remove(
            'show'
        );
    }
);


/* ============================================================
   WHO JOINED
============================================================ */

menuWhoJoined.addEventListener(
    'click',
    ()=>{

        if(!currentRoomId){

            showToast(
                '⚠️ No room active'
            );

        }else{

            const list =
            Array.from(participants)
            .filter(
                p=>!p.startsWith('🟢')
            );


            const count =
            list.length;


            if(count === 0){

                showToast(
                    '👥 No one else yet. Share the token!'
                );

            }else{

                showToast(
                    '👥 Participants: ' +
                    list.join(', ')
                );
            }
        }


        sidemenu.classList.remove(
            'open'
        );

        sidemenuOverlay.classList.remove(
            'show'
        );
    }
);


/* ============================================================
   LEAVE
============================================================ */

menuLeaveRoom.addEventListener(
    'click',
    ()=>{

        if(!currentRoomId){

            showToast(
                '⚠️ No room to leave'
            );

            sidemenu.classList.remove(
                'open'
            );

            sidemenuOverlay.classList.remove(
                'show'
            );

            return;
        }


        sidemenu.classList.remove(
            'open'
        );

        sidemenuOverlay.classList.remove(
            'show'
        );


        leaveRoom();
    }
);


/* ============================================================
   GREETING
============================================================ */

if(greetingHighlight){

    greetingHighlight.addEventListener(
        'click',
        ()=>{

            if(
                chatInput &&
                !chatInput.disabled
            ){

                chatInput.focus();
            }
        }
    );
}


/* ============================================================
   CLEANUP
============================================================ */

window.addEventListener(
    'beforeunload',
    ()=>{

        if(channel){

            try{
                channel.unsubscribe();
            }catch(_){}
        }
    }
);


/* ============================================================
   INIT
============================================================ */

console.log(
    '🚀 p2p · app style chat'
);

updateStatus(
    false,
    'Ready'
);

updateJoinedCount();

</script>

</body>
</html>
