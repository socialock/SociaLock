<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #07090d;
    color: #e9edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: 100%;
    height: 100dvh;
    max-height: 100dvh;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #080b10;
    position: relative;
}

/* ============================================================
   HEADER
============================================================ */

.header {
    flex: 0 0 44px;
    height: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    background: rgba(13, 17, 24, .95);
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    position: relative;
    z-index: 20;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
}

.header-left .live-icon {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff4d4d, #e63946);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #fff;
    flex-shrink: 0;
    animation: pulse-live 1.8s infinite;
}

@keyframes pulse-live {
    0%, 100% {
        box-shadow: 0 0 0 0 rgba(255, 77, 77, .5);
    }
    50% {
        box-shadow: 0 0 0 10px rgba(255, 77, 77, 0);
    }
}

.header-title {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.header-title .name {
    color: #edf1f7;
    font-size: 12px;
    font-weight: 650;
    line-height: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.header-title .status {
    display: flex;
    align-items: center;
    gap: 3px;
    color: #687588;
    font-size: 8px;
    line-height: 11px;
}

.header-title .status .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    display: inline-block;
}

.header-title .status .dot.online {
    background: #42d392;
    box-shadow: 0 0 7px rgba(66, 211, 146, .6);
}

.header-title .status .dot.offline {
    background: #687588;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 3px;
}

.header-right .username-badge {
    background: rgba(255, 255, 255, .06);
    padding: 2px 8px;
    border-radius: 16px;
    font-size: 9px;
    color: #aab5c5;
    max-width: 80px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border: 1px solid rgba(255, 255, 255, .06);
}

.header-right button {
    width: 26px;
    height: 26px;
    border: 0;
    background: transparent;
    color: #7f8a9b;
    font-size: 11px;
    border-radius: 50%;
    cursor: pointer;
    transition: .2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.header-right button:hover {
    background: rgba(255, 255, 255, .06);
    color: #fff;
}

/* ============================================================
   AUTH
============================================================ */

.auth-panels {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #080b10;
    flex-shrink: 0;
}

.auth-panel {
    flex: 1;
    background: #111722;
    border-radius: 10px;
    padding: 12px;
    border: 1px solid rgba(255, 255, 255, .06);
}

.auth-panel h3 {
    color: #8490a2;
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 6px;
}

.auth-panel .form-group {
    margin-bottom: 5px;
}

.auth-panel .form-group input {
    width: 100%;
    height: 32px;
    padding: 0 10px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, .06);
    background: #0a0d12;
    color: #edf2f8;
    font-size: 11px;
    outline: none;
}

.auth-panel .form-group input:focus {
    border-color: rgba(79, 156, 255, .3);
}

.auth-panel .btn-auth {
    width: 100%;
    height: 32px;
    border: 0;
    border-radius: 6px;
    background: linear-gradient(135deg, #4d98ff, #6559e8);
    color: #fff;
    font-weight: 600;
    font-size: 11px;
    cursor: pointer;
    transition: .2s;
}

.auth-panel .btn-auth:hover {
    filter: brightness(1.08);
}

.auth-panel .btn-auth:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.auth-panel .hint {
    color: #4f5a6b;
    font-size: 7px;
    margin-top: 3px;
    text-align: center;
}

/* ============================================================
   LIVE AREA
============================================================ */

.live-area {
    flex: 1 1 auto;
    width: 100%;
    height: 0;
    min-height: 0;
    display: none;
    flex-direction: column;
    background: #0a0d12;
    position: relative;
    overflow: hidden;
}

.live-area.visible {
    display: flex;
}

/* ============================================================
   VIDEO CONTAINER
============================================================ */

.video-container {
    flex: 1;
    width: 100%;
    height: 0;
    min-height: 0;
    position: relative;
    background: #000;
    overflow: hidden;
}

/* ============================================================
   ALL VIDEO FULL SIZE
============================================================ */

#remoteVideo,
#localVideo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    cursor: pointer;
}

/*
   Remote video
   Viewer only
*/
#remoteVideo {
    z-index: 1;
    display: none;
}

/*
   Local video
   Host only
*/
#localVideo {
    z-index: 1;
    display: none;
}

/*
   Explicit visibility classes
*/
#remoteVideo.video-visible,
#localVideo.video-visible {
    display: block;
}

/* ============================================================
   STREAM PLACEHOLDER
============================================================ */

.stream-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 50%, #121820, #07090d);
    z-index: 2;
}

.stream-placeholder .big-icon {
    font-size: 48px;
    color: #2a3344;
    margin-bottom: 10px;
    opacity: .5;
}

.stream-placeholder .title {
    color: #687588;
    font-size: 13px;
    font-weight: 500;
}

.stream-placeholder .sub {
    color: #3f4a5a;
    font-size: 10px;
    margin-top: 2px;
}

/* ============================================================
   LIVE OVERLAY
============================================================ */

.live-overlay {
    position: absolute;
    top: 12px;
    left: 12px;
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(0, 0, 0, .75);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, .06);
    backdrop-filter: blur(10px);
    z-index: 10;
}

.live-overlay .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ff4d4d;
    animation: blink 1.2s infinite;
}

@keyframes blink {
    0%, 100% {
        opacity: 1;
    }
    50% {
        opacity: .2;
    }
}

.live-overlay .live-text {
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
}

.live-overlay .viewer-count {
    color: #aab5c5;
    font-size: 8px;
    margin-left: 2px;
}

/* ============================================================
   LIVE STATS
============================================================ */

.live-stats {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(0, 0, 0, .75);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, .06);
    backdrop-filter: blur(10px);
    z-index: 10;
}

.live-stats span {
    color: #aab5c5;
    font-size: 8px;
    display: flex;
    align-items: center;
    gap: 3px;
}

.live-stats span i {
    color: #4d98ff;
    font-size: 9px;
}

/* ============================================================
   FULLSCREEN BUTTON
============================================================ */

.fullscreen-btn {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: rgba(0, 0, 0, .7);
    border: 1px solid rgba(255, 255, 255, .15);
    color: #fff;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: .2s;
    backdrop-filter: blur(8px);
}

.fullscreen-btn:hover {
    background: rgba(255, 255, 255, .15);
    transform: scale(1.05);
}

/* ============================================================
   CAMERA SWITCH
============================================================ */

.cam-switch-btn {
    display: none;
    position: absolute;
    bottom: 20px;
    right: 80px;
    background: rgba(0, 0, 0, .7);
    border: 1px solid rgba(255, 255, 255, .15);
    color: #fff;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    z-index: 30;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: .2s;
    backdrop-filter: blur(8px);
}

.cam-switch-btn.visible {
    display: flex;
}

.cam-switch-btn:hover {
    background: rgba(255, 255, 255, .15);
    transform: scale(1.05);
}

/* ============================================================
   HOST CONTROLS
============================================================ */

.host-controls {
    display: none;
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, .85);
    padding: 6px 14px;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, .06);
    backdrop-filter: blur(12px);
    z-index: 35;
    gap: 4px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
}

.host-controls.visible {
    display: flex;
}

.host-controls button {
    background: none;
    border: none;
    color: #aab5c5;
    font-size: 10px;
    cursor: pointer;
    padding: 3px 8px;
    border-radius: 16px;
    transition: .2s;
    display: flex;
    align-items: center;
    gap: 3px;
    font-family: inherit;
}

.host-controls button:hover {
    background: rgba(255, 255, 255, .08);
    color: #fff;
}

.host-controls button.danger:hover {
    color: #ff4d4d;
}

.host-controls .divider {
    width: 1px;
    height: 16px;
    background: rgba(255, 255, 255, .06);
}

/* ============================================================
   CHAT
============================================================ */

.chat-area {
    flex: 0 0 180px;
    max-height: 180px;
    min-height: 120px;
    display: none;
    flex-direction: column;
    background: rgba(8, 11, 16, .98);
    border-top: 1px solid rgba(255, 255, 255, .06);
    position: relative;
    z-index: 5;
}

.chat-area.visible {
    display: flex;
}

.chat-header {
    flex: 0 0 30px;
    min-height: 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    border-bottom: 1px solid rgba(255, 255, 255, .04);
}

.chat-header .title {
    color: #8490a2;
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
    display: flex;
    align-items: center;
    gap: 4px;
}

.chat-header .title .count {
    background: rgba(255, 255, 255, .06);
    padding: 0 5px;
    border-radius: 8px;
    font-size: 7px;
    color: #687588;
}

.chat-header .actions button {
    background: none;
    border: none;
    color: #4f5a6b;
    font-size: 9px;
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 8px;
    transition: .2s;
}

.chat-header .actions button:hover {
    background: rgba(255, 255, 255, .06);
    color: #aab5c5;
}

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 4px 10px;
    scroll-behavior: smooth;
}

.chat-messages::-webkit-scrollbar {
    width: 3px;
}

.chat-messages::-webkit-scrollbar-track {
    background: transparent;
}

.chat-messages::-webkit-scrollbar-thumb {
    background: rgba(130, 145, 170, .2);
    border-radius: 20px;
}

.chat-msg {
    display: flex;
    gap: 3px;
    margin-bottom: 2px;
    animation: fadeIn .15s ease;
    align-items: baseline;
    flex-wrap: wrap;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(3px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.chat-msg .sender {
    color: #5d9cff;
    font-size: 9px;
    font-weight: 600;
    flex-shrink: 0;
}

.chat-msg .sender.host {
    color: #ff4d4d;
}

.chat-msg .sender.self {
    color: #42d392;
}

.chat-msg .text {
    color: #dce2ea;
    font-size: 10px;
    word-break: break-word;
}

.chat-msg .time {
    color: #4f5a6b;
    font-size: 6px;
    flex-shrink: 0;
    margin-left: 2px;
}

.chat-msg .badge {
    font-size: 6px;
    background: #ff4d4d;
    color: #fff;
    padding: 0 4px;
    border-radius: 6px;
    font-weight: 600;
    margin-left: 2px;
    flex-shrink: 0;
}

.chat-empty {
    text-align: center;
    color: #4f5a6b;
    font-size: 9px;
    padding: 12px 0;
}

.chat-input-row {
    flex: 0 0 36px;
    min-height: 36px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-top: 1px solid rgba(255, 255, 255, .04);
}

.chat-input-row input {
    flex: 1;
    height: 28px;
    padding: 0 10px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, .06);
    background: #111722;
    color: #edf2f8;
    font-size: 11px;
    outline: none;
    transition: .2s;
}

.chat-input-row input:focus {
    border-color: rgba(79, 156, 255, .3);
}

.chat-input-row input::placeholder {
    color: #4f5a6b;
}

.chat-input-row input:disabled {
    opacity: .4;
}

.chat-input-row button {
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, #4d98ff, #6559e8);
    color: #fff;
    font-size: 11px;
    cursor: pointer;
    transition: .2s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chat-input-row button:hover {
    transform: scale(1.04);
}

.chat-input-row button:disabled {
    opacity: .4;
    transform: none;
}

/* ============================================================
   TOAST
============================================================ */

.toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translate(-50%, 12px);
    max-width: 90%;
    padding: 6px 14px;
    border-radius: 8px;
    background: #151a22;
    border: 1px solid rgba(255, 255, 255, .08);
    color: #e6ebf2;
    font-size: 9px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: .25s;
}

.toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* ============================================================
   TOKEN
============================================================ */

.token-display {
    display: none;
    background: rgba(0, 0, 0, .5);
    padding: 2px 8px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, .06);
    font-family: 'Courier New', monospace;
    font-size: 8px;
    color: #aab5c5;
    letter-spacing: .3px;
    max-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.token-display.visible {
    display: inline-block;
}

/* ============================================================
   FULLSCREEN
============================================================ */

.video-container:fullscreen,
.video-container:-webkit-full-screen {
    width: 100vw !important;
    height: 100vh !important;
    height: 100dvh !important;
    max-width: none !important;
    max-height: none !important;
    background: #000 !important;
    overflow: hidden !important;
}

.video-container:fullscreen #remoteVideo,
.video-container:-webkit-full-screen #remoteVideo,
.video-container:fullscreen #localVideo,
.video-container:-webkit-full-screen #localVideo {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: contain !important;
    background: #000 !important;
    border: 0 !important;
    border-radius: 0 !important;
}

.video-container:fullscreen .stream-placeholder,
.video-container:-webkit-full-screen .stream-placeholder {
    background: #000;
}

/* ============================================================
   RESPONSIVE
============================================================ */

@media(max-width:600px) {

    html,
    body {
        overflow: hidden;
    }

    body {
        display: block;
        padding: 0;
        background: #080b10;
    }

    .app {
        width: 100%;
        height: 100dvh;
        max-height: none;
        border: 0;
        border-radius: 0;
    }

    .header {
        flex: 0 0 40px;
        height: 40px;
        min-height: 40px;
        padding: 0 8px;
    }

    .header-title .name {
        font-size: 11px;
    }

    .header-right .username-badge {
        font-size: 8px;
        padding: 2px 6px;
        max-width: 60px;
    }

    .auth-panels {
        flex-direction: column;
        gap: 5px;
        padding: 8px;
    }

    .auth-panel {
        padding: 8px;
    }

    .live-area {
        flex: 1 1 auto;
        height: 0;
        min-height: 0;
    }

    .video-container {
        width: 100%;
        height: 100%;
    }

    #remoteVideo,
    #localVideo {
        width: 100%;
        height: 100%;
        inset: 0;
        object-fit: contain;
    }

    .chat-area {
        flex: 0 0 140px;
        max-height: 140px;
        min-height: 100px;
    }

    .host-controls {
        bottom: 10px;
        padding: 4px 10px;
        gap: 2px;
        width: 94%;
    }

    .host-controls button {
        font-size: 8px;
        padding: 2px 5px;
    }

    .live-overlay {
        top: 8px;
        left: 8px;
        padding: 3px 8px;
    }

    .live-stats {
        top: 8px;
        right: 8px;
        padding: 3px 8px;
        gap: 5px;
    }

    .token-display {
        max-width: 50px;
        font-size: 6px;
    }

    .chat-msg .sender {
        font-size: 8px;
    }

    .chat-msg .text {
        font-size: 9px;
    }

    .fullscreen-btn {
        bottom: 16px;
        right: 14px;
        width: 38px;
        height: 38px;
        font-size: 15px;
    }

    .cam-switch-btn {
        bottom: 16px;
        right: 68px;
        width: 38px;
        height: 38px;
        font-size: 15px;
    }

    .video-container:fullscreen,
    .video-container:-webkit-full-screen {
        width: 100vw !important;
        height: 100dvh !important;
    }

    .video-container:fullscreen #remoteVideo,
    .video-container:-webkit-full-screen #remoteVideo,
    .video-container:fullscreen #localVideo,

function generateToken() {

    const chars =
        'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

    let code = '';

    for (let i = 0; i < 64; i++) {

        const randomIndex =
            crypto.getRandomValues(
                new Uint32Array(1)
            )[0] % chars.length;

        code += chars[randomIndex];
    }

    return code;
}

function sanitizeInput(text) {

    if (window.DOMPurify) {

function escapeHtml(value) {

    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function formatTime(timestamp) {

    return new Date(timestamp).toLocaleTimeString(
        'en-US',
        {
            hour: '2-digit',
            minute: '2-digit'
        }
    );
}

function containsBadWord(text) {

    const lower = text.toLowerCase();

    return BAD_WORDS.some(
        word => lower.includes(word)
    );
}

function containsHarmfulLink(text) {

    return HARMFUL_PATTERNS.some(
        pattern => pattern.test(text)
    );
}

function filterMessage(text) {

    if (containsBadWord(text)) {
        return {
            allowed: false,
            reason: 'Profanity detected'
        };
    }

    if (containsHarmfulLink(text)) {
        return {
            allowed: false,
            reason: 'Harmful link detected'
        };
    }

    return {
        allowed: true
    };
}

            .then(() => {

    } else {

}

function fallbackCopy(text) {

    const ta =
        document.createElement('textarea');

    ta.value = text;

    ta.style.position = 'fixed';

async function switchCamera() {

    if (!isHost || !localStream) {
        return;
    }

    cameraFacingMode =
        cameraFacingMode === 'environment'
            ? 'user'
            : 'environment';

    localStream
        .getTracks()
        .forEach(track => {
            track.stop();
        });

    try {

        const constraints = {

            video: {
                width: {
                    ideal: 1280
                },
                height: {
                    ideal: 720
                },
                facingMode:
                    cameraFacingMode
            },

            audio: true
        };

        const newStream =
            await navigator.mediaDevices
                .getUserMedia(constraints);

        if (peerConnection) {

            const senders =
                peerConnection.getSenders();

            const videoSender =
                senders.find(
                    s =>
                        s.track &&
                        s.track.kind === 'video'
                );

            const audioSender =
                senders.find(
                    s =>
                        s.track &&
                        s.track.kind === 'audio'
                );

            const newVideoTrack =
                newStream
                    .getVideoTracks()[0];

            const newAudioTrack =
                newStream
                    .getAudioTracks()[0];

            if (
                videoSender &&
                newVideoTrack
            ) {
                await videoSender.replaceTrack(
                    newVideoTrack
                );
            }

            if (
                audioSender &&
                newAudioTrack
            ) {
                await audioSender.replaceTrack(
                    newAudioTrack
                );
            }
        }

        localStream = newStream;

        localVideo.srcObject =
            localStream;

        await localVideo.play();

        showHostVideo();

        showToast(
            `📷 Switched to ${
                cameraFacingMode === 'environment'
                    ? 'back'
                    : 'front'
            } camera`
        );

    } catch (err) {

        console.error(
            'Camera switch error:',
            err
        );

        showToast(
            '⚠️ Could not switch camera: ' +
            err.message
        );

        cameraFacingMode =
            cameraFacingMode === 'environment'
                ? 'user'
                : 'environment';
    }
}

/* ============================================================
   WEBRTC
============================================================ */

async function createPeerConnection(
    roomIdStr,
    isHostUser
) {

    const configuration = {

        iceServers: [

            {
                urls:
                    'stun:stun.l.google.com:19302'
            },

            {
                urls:
                    'stun:stun1.l.google.com:19302'
            }

        ]
    };

    peerConnection =
        new RTCPeerConnection(
            configuration
        );

    if (localStream) {

        localStream
            .getTracks()
            .forEach(track => {

                peerConnection.addTrack(
                    track,
                    localStream
                );

            });
    }

    peerConnection.ontrack =
        event => {

            if (
                event.streams &&
                event.streams[0]
            ) {

                remoteVideo.srcObject =
                    event.streams[0];

                remoteVideo.play()
                    .catch(() => {});

                if (!isHost) {
                    showViewerVideo();
                }

                streamPlaceholder.style.display =
                    'none';
            }
        };

    peerConnection.onicecandidate =
        event => {

            if (
                event.candidate &&
                channel
            ) {

                channel.send({

                    type: 'broadcast',

                    event: 'webrtc_ice',

                    payload: {

                        candidate:
                            event.candidate,

                        from:
                            myUsername,

                        isHost:
                            isHostUser
                    }
                });
            }
        };

    peerConnection.onconnectionstatechange =
        () => {

            console.log(
                'Connection state:',
                peerConnection.connectionState
            );

            if (
                peerConnection.connectionState ===
                'connected'
            ) {

                showToast(
                    '📡 Video connected!'
                );

                liveOverlay.style.display =
                    'flex';

                liveStats.style.display =
                    'flex';

                if (isHost) {
                    showHostVideo();
                } else {
                    showViewerVideo();
                }
            }

            if (
                peerConnection.connectionState ===
                    'disconnected' ||
                peerConnection.connectionState ===
                    'failed'
            ) {

                showToast(
                    '⚠️ Video disconnected'
                );
            }
        };

    return peerConnection;
}

/* ============================================================
   OFFER
============================================================ */

async function handleOffer(
    offer,
    roomIdStr
) {

    if (!peerConnection) {

        await createPeerConnection(
            roomIdStr,
            false
        );
    }

    await peerConnection
        .setRemoteDescription(
            new RTCSessionDescription(
                offer
            )
        );

    const answer =
        await peerConnection.createAnswer();

    await peerConnection
        .setLocalDescription(answer);

    if (channel) {

        channel.send({

            type: 'broadcast',

            event: 'webrtc_answer',

            payload: {

                answer,

                from:
                    myUsername,

                to:
                    offer.from
            }
        });
    }
}

async function handleAnswer(answer) {

    if (peerConnection) {

        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    answer
                )
            );
    }
}

async function handleIceCandidate(
    candidate
) {

    if (peerConnection) {

        try {

            await peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

        } catch (err) {

            console.warn(
                'ICE candidate error:',
                err
            );
        }
    }
}

    fullscreenBtn.innerHTML =

            ? '<i class="fas fa-compress"></i>'
            : '<i class="fas fa-expand"></i>';
}

/* ============================================================
   REALTIME
============================================================ */

function setupRealtime(
    roomIdStr,
    username,
    isHostUser
) {

    if (channel) {

        try {
            channel.unsubscribe();
        } catch (_) {}

        channel = null;
    }

    roomId =
        roomIdStr;

    myUsername =
        username;

    isHost =
        isHostUser;

    comments = [];

    viewers =
        new Set();

    viewers.add(username);

    const channelName =
        `live_room:${roomIdStr}`;

    channel =
        supabaseClient.channel(
            channelName,
            {
                config: {
                    broadcast: {
                        ack: true
                    }
                }
            }
        );

    /* ========================================================
       WEBRTC OFFER
    ======================================================== */

    channel.on(
        'broadcast',
        {
            event: 'webrtc_offer'
        },
        async payload => {

            if (isHost) {
                return;
            }

            const {
                offer,
                from,
                to
            } = payload.payload;

            if (
                from !== myUsername &&
                (!to || to === myUsername)
            ) {

                await handleOffer(
                    offer,
                    roomIdStr
                );
            }
        }
    );

    /* ========================================================
       WEBRTC ANSWER
    ======================================================== */

    channel.on(
        'broadcast',
        {
            event: 'webrtc_answer'
        },
        async payload => {

            if (!isHost) {
                return;
            }

            const {
                answer,
                to
            } = payload.payload;

            if (
                to === myUsername
            ) {

                await handleAnswer(
                    answer
                );
            }
        }
    );

    /* ========================================================
       ICE
    ======================================================== */

    channel.on(
        'broadcast',
        {
            event: 'webrtc_ice'
        },
        async payload => {

            const {
                candidate,
                from,
                isHost:
                    senderIsHost
            } = payload.payload;

            if (
                from === myUsername
            ) {
                return;
            }

            if (
                (isHost && !senderIsHost) ||
                (!isHost && senderIsHost)
            ) {

                await handleIceCandidate(
                    candidate
                );
            }
        }
    );

    /* ========================================================
       CHAT
    ======================================================== */

    channel.on(
        'broadcast',
        {
            event: 'comment'
        },
        payload => {

            const {
                username: sender,
                text,
                isHost:
                    senderIsHost,
                created_at
            } = payload.payload;

            if (
                sender === myUsername &&
                text ===
                    chatInput.value.trim()
            ) {
                return;
            }

            addComment(
                sender,
                text,
                senderIsHost || false
            );

            viewers.add(sender);

            updateViewerCount();
        }
    );

    /* ========================================================
       VIEWER JOIN
    ======================================================== */

    channel.on(
        'broadcast',
        {
            event: 'viewer_join'
        },
        payload => {

            const {
                username: sender
            } = payload.payload;

            if (
                sender !== myUsername
            ) {

                viewers.add(sender);

                updateViewerCount();

                if (isHost) {

                    showToast(
                        `👤 ${sender} joined the live`
                    );

                    sendOfferToViewer(
                        sender
                    );
                }
            }
        }
    );

    /* ========================================================
       VIEWER LEAVE
    ======================================================== */

    channel.on(
        'broadcast',
        {
            event: 'viewer_leave'
        },
        payload => {

            const {
                username: sender
            } = payload.payload;

            viewers.delete(sender);

            updateViewerCount();
        }
    );

    /* ========================================================
       END LIVE
    ======================================================== */

    channel.on(
        'broadcast',
        {
            event: 'end_live'
        },
        () => {

            if (!isHost) {

                showToast(
                    '📡 The host has ended the live stream'
                );

                setTimeout(
                    () => {
                        leaveLive();
                    },
                    1500
                );
            }
        }
    );

    /* ========================================================
       MUTE
    ======================================================== */

    channel.on(
        'broadcast',
        {
            event: 'mute_toggle'
        },
        payload => {

            const {
                muted
            } = payload.payload;

            isMuted =
                muted;

            if (!isHost) {

                chatInput.disabled =
                    isMuted;

                sendChatBtn.disabled =
                    isMuted;

                showToast(
                    isMuted
                        ? '🔇 Chat muted by host'
                        : '🔊 Chat unmuted'
                );
            }
        }
    );

    /* ========================================================
       SUBSCRIBE
    ======================================================== */

    channel.subscribe(
        async status => {

            if (
                status === 'SUBSCRIBED'
            ) {

                console.log(
                    `✅ Connected to live room ${roomIdStr}`
                );

                isSubscribed = true;

                statusDot.className =
                    'dot online';

                statusText.textContent =
                    'Live';

                chatTitle.textContent =
                    isHost
                        ? '🔴 Your Live'
                        : '🔴 Live Stream';

                setTimeout(
                    () => {

                        if (channel) {

                            channel.send({

                                type:
                                    'broadcast',

                                event:
                                    'viewer_join',

                                payload: {
                                    username:
                                        myUsername
                                }
                            });
                        }

                    },
                    300
                );

                if (isHost) {

                    await startLiveStream();

                } else {

                    showPlaceholder();
                }

                chatInput.disabled =
                    isMuted;

                sendChatBtn.disabled =
                    isMuted;

            } else {

                console.warn(
                    'Subscribe status:',
                    status
                );
            }
        }
    );

    chatInput.disabled =
        isMuted;

    sendChatBtn.disabled =
        isMuted;

    updateViewerCount();

    renderComments();

    updateUI();
}

/* ============================================================
   HOST START STREAM
============================================================ */

async function startLiveStream() {

    const ok =
        await startLocalStream();

    if (!ok) {

        showToast(
            '⚠️ Failed to start camera'
        );

        return;
    }

    await createPeerConnection(
        roomId,
        true
    );

    const offer =
        await peerConnection
            .createOffer();

    await peerConnection
        .setLocalDescription(
            offer
        );

    if (channel) {

        channel.send({

            type: 'broadcast',

            event: 'webrtc_offer',

            payload: {

                offer,

                from:
                    myUsername,

                isHost:
                    true
            }
        });
    }

    showHostVideo();

    liveOverlay.style.display =
        'flex';

    liveStats.style.display =
        'flex';

    showToast(
        '🎬 Live stream started!'
    );
}

/* ============================================================
   SEND OFFER TO VIEWER
============================================================ */

async function sendOfferToViewer(
    viewerName
) {

    if (
        !isHost ||
        !peerConnection
    ) {
        return;
    }

    try {

        const offer =
            await peerConnection
                .createOffer({
                    offerToReceiveAudio: true,
                    offerToReceiveVideo: true
                });

        await peerConnection
            .setLocalDescription(
                offer
            );

        if (channel) {

            channel.send({

                type:
                    'broadcast',

                event:
                    'webrtc_offer',

                payload: {

                    offer,

                    from:
                        myUsername,

                    to:
                        viewerName,

                    isHost:
                        true
                }
            });
        }

    } catch (err) {

        console.warn(
            'Offer error:',
            err
        );
    }
}

   UPDATE UI
============================================================ */

function updateUI() {

    authPanels.style.display =
        'none';

    liveArea.classList.add(
        'visible'
    );

    chatArea.classList.add(
        'visible'
    );

    if (isHost) {

        hostControls.classList.add(
            'visible'
        );

        tokenDisplay.classList.add(
            'visible'
        );

        tokenDisplay.textContent =
            roomToken;

        chatTitle.textContent =

            myUsername + ' 👑';

        streamTitle.textContent =

        streamSub.textContent =
            'Share the token to invite viewers';

        camSwitchBtn.classList.add(
            'visible'
        );

        if (localStream) {
            showHostVideo();
        }

    } else {

        hostControls.classList.remove(
            'visible'
        );

        tokenDisplay.classList.remove(
            'visible'
        );

        chatTitle.textContent =
            '🔴 Live Stream';

        userBadge.textContent =
            myUsername;

        streamTitle.textContent =
            '📺 Watching Live';

        streamSub.textContent =
            'Join the conversation!';

        camSwitchBtn.classList.remove(
            'visible'
        );
    }

    updateViewerCount();

    renderComments();
}

/* ============================================================
   VIEWER COUNT
============================================================ */

function updateViewerCount() {

    const count =
        viewers.size || 0;

    viewerCount.textContent =
        count + ' watching';

    viewerCount2.textContent =
        count;
}

/* ============================================================
   CHAT
============================================================ */

async function sendComment() {

    const text =
        chatInput.value.trim();

    if (!text) {

        chatInput.focus();

        return;
    }

    if (
        isMuted &&
        !isHost
    ) {

        showToast(
            '🔇 Chat is muted by host'
        );

        return;
    }

    const now =
        Date.now();

    if (
        now - lastMessageTime <
        MIN_INTERVAL
    ) {

        showToast(
            '⏳ Please wait 2 seconds'
        );

        return;
    }

    const filterResult =
        filterMessage(text);

    if (
        !filterResult.allowed
    ) {

        showToast(
            `⛔ ${filterResult.reason}`
        );

        chatInput.value = '';

        chatInput.focus();

        return;
    }

    if (
        !isSubscribed ||
        !channel
    ) {

        showToast(
            '⚠️ Not connected'
        );

        return;
    }

    lastMessageTime =
        now;

    const msgData = {

        username:
            myUsername,

        text,

        isHost:
            isHost || false,

        created_at:
            Date.now()
    };

    const {
        error
    } = await channel.send({

        type:
            'broadcast',

        event:
            'comment',

        payload:
            msgData
    });

    if (error) {

        showToast(
            '⚠️ Error: ' +
            error.message
        );

        return;
    }

    addComment(
        myUsername,
        text,
        isHost || false
    );

    chatInput.value = '';

    chatInput.focus();
}

/* ============================================================
   START LIVE
============================================================ */

async function startLive() {

    const name =
        hostName.value.trim() ||
        'Host';

    if (name.length < 2) {

        showToast(
            '⚠️ Name must be at least 2 characters'
        );

        return;
    }

    roomToken =
        generateToken();

    const roomIdStr =
        roomToken;

    myUsername =
        name;

    isHost =
        true;

    setupRealtime(
        roomIdStr,
        name,
        true
    );

    setTimeout(
        () => {

            addComment(
                '🟢 System',
                '🎬 Host started the live stream!',
                false
            );

        },
        500
    );

    showToast(
        '🎬 Starting live stream...'
    );

    chatInput.focus();
}

/* ============================================================
   JOIN LIVE
============================================================ */

async function joinLive() {

    const name =
        viewerName.value.trim() ||
        'Viewer';

    const token =
        joinTokenInput.value.trim();

    if (name.length < 2) {

        showToast(
            '⚠️ Name must be at least 2 characters'
        );

        return;
    }

    if (token.length !== 64) {

        showToast(
            '⚠️ Enter a valid 64-character token'
        );

        return;
    }

    myUsername =
        name;

    isHost =
        false;

    roomToken =
        token;

    setupRealtime(
        token,
        name,
        false
    );

    showToast(
        '✅ Joined the live stream!'
    );

    chatInput.focus();
}

/* ============================================================
   CAMERA TOGGLE
============================================================ */

function toggleCamera() {

    if (
        !isHost ||
        !localStream
    ) {
        return;
    }

    const videoTrack =
        localStream
            .getVideoTracks()[0];

    if (videoTrack) {

        isCameraOn =
            !isCameraOn;

        videoTrack.enabled =
            isCameraOn;

        toggleCamBtn.innerHTML =
            isCameraOn
                ? '<i class="fas fa-video"></i> Cam'
                : '<i class="fas fa-video-slash"></i> Cam';

        showToast(
            isCameraOn
                ? '📷 Camera on'
                : '📷 Camera off'
        );
    }
}

/* ============================================================
   MIC TOGGLE
============================================================ */

function toggleMic() {

    if (
        !isHost ||
        !localStream
    ) {
        return;
    }

    const audioTrack =
        localStream
            .getAudioTracks()[0];

    if (audioTrack) {

        isMicOn =
            !isMicOn;

        audioTrack.enabled =
            isMicOn;

        toggleMicBtn.innerHTML =
            isMicOn
                ? '<i class="fas fa-microphone"></i> Mic'
                : '<i class="fas fa-microphone-slash"></i> Mic';

        showToast(
            isMicOn
                ? '🎤 Mic on'
                : '🎤 Mic off'
        );
    }
}

/* ============================================================
   END LIVE
============================================================ */

async function endLive() {

    if (!isHost) {
        return;
    }

    if (
        !confirm(
            'Are you sure you want to end the live stream?'
        )
    ) {
        return;
    }

    if (channel) {

        await channel.send({

            type:
                'broadcast',

            event:
                'end_live',

            payload: {
                ended: true
            }
        });
    }

    showToast(
        '📡 Live ended'
    );

    setTimeout(
        () => {
            leaveLive();
        },
        500
    );
}

/* ============================================================
   LEAVE LIVE
============================================================ */

function leaveLive() {

    if (channel) {

        try {

            channel.send({

                type:
                    'broadcast',

                event:
                    'viewer_leave',

                payload: {
                    username:
                        myUsername
                }
            });

            channel.unsubscribe();

        } catch (_) {}

        channel = null;
    }

    stopLocalStream();

    if (peerConnection) {

        try {
            peerConnection.close();
        } catch (_) {}

        peerConnection = null;
    }

    remoteVideo.srcObject =
        null;

    isSubscribed =
        false;

    roomId =
        null;

    roomToken =
        '';

    comments =
        [];

    viewers =
        new Set();

    isHost =
        false;

    isMuted =
        false;

    authPanels.style.display =
        'flex';

    liveArea.classList.remove(
        'visible'
    );

    chatArea.classList.remove(
        'visible'
    );

    hostControls.classList.remove(
        'visible'
    );

    liveOverlay.style.display =
        'none';

    liveStats.style.display =
        'none';

    tokenDisplay.classList.remove(
        'visible'
    );

    camSwitchBtn.classList.remove(
        'visible'
    );

    showPlaceholder();

    statusDot.className =
        'dot offline';

    statusText.textContent =
        'Offline';

    chatTitle.textContent =
        'Live Stream';

    userBadge.textContent =
        'Anonymous';

    chatInput.disabled =
        true;

    sendChatBtn.disabled =
        true;

    hostName.value =
        '';

    viewerName.value =
        '';

    joinTokenInput.value =
        '';

    renderComments();

    showToast(
        '👋 Left the live'
    );
}

/* ============================================================
   MUTE CHAT
============================================================ */

async function toggleMute() {

    if (
        !isHost ||
        !channel
    ) {
        return;
    }

    isMuted =
        !isMuted;

    await channel.send({

        type:
            'broadcast',

        event:
            'mute_toggle',

        payload: {
            muted:
                isMuted
        }
    });

    showToast(
        isMuted
            ? '🔇 Chat muted'
            : '🔊 Chat unmuted'
    );

    muteChatBtn.innerHTML =
        isMuted
            ? '<i class="fas fa-microphone"></i> Unmute'
            : '<i class="fas fa-microphone-slash"></i> Mute';
}

/* ============================================================
   CLEAR CHAT
============================================================ */

function clearChat() {

    if (!isHost) {
        return;
    }

    if (
        !confirm(
            'Clear all comments?'
        )
    ) {
        return;
    }

    comments = [];

    renderComments();

    showToast(
        '🗑 Chat cleared'
    );
}

   EVENTS
============================================================ */

    'click',
    startLive
);

joinLiveBtn.addEventListener(
    'click',
    joinLive
);

sendChatBtn.addEventListener(
    'click',
    sendComment
);

chatInput.addEventListener(
    'keydown',
    e => {

        if (e.key === 'Enter') {

            e.preventDefault();

            sendComment();
        }
    }
);

endLiveBtn.addEventListener(
    'click',
    endLive
);

copyTokenBtn.addEventListener(
    'click',

        if (roomToken) {
            copyToClipboard(
                roomToken
            );
        }
    }
);

muteChatBtn.addEventListener(
    'click',
    toggleMute
);

clearChatBtn.addEventListener(
    'click',
    clearChat
);

toggleCamBtn.addEventListener(
    'click',
    toggleCamera
);

toggleMicBtn.addEventListener(
    'click',
    toggleMic
);

fullscreenBtn.addEventListener(
    'click',
    toggleFullscreen
);

remoteVideo.addEventListener(
    'dblclick',
    toggleFullscreen
);

localVideo.addEventListener(
    'dblclick',
    toggleFullscreen
);

camSwitchBtn.addEventListener(
    'click',
    switchCamera
);

chatFilterBtn.addEventListener(
    'click',

            '🔍 Filter feature coming soon!'

    }
);

joinTokenInput.addEventListener(

        if (e.key === 'Enter') {

            e.preventDefault();

            joinLive();
        }
    }
);

hostName.addEventListener(
    'keydown',
    e => {

        if (e.key === 'Enter') {

            e.preventDefault();

            startLive();
        }
    }
);

/* ============================================================
   FULLSCREEN EVENTS
============================================================ */

document.addEventListener(
    'fullscreenchange',
    updateFullscreenButton
);

document.addEventListener(
    'webkitfullscreenchange',
    updateFullscreenButton
);

/* ============================================================
   CLEANUP
============================================================ */

window.addEventListener(
    'beforeunload',
    () => {

        stopLocalStream();

        if (peerConnection) {

            try {
                peerConnection.close();
            } catch (_) {}
        }

        if (channel) {

            try {

                channel.send({

                    type:
                        'broadcast',

                    event:
                        'viewer_leave',

                    payload: {

                        username:
                            myUsername
                    }
                });

                channel.unsubscribe();

            } catch (_) {}
        }
    }
);

console.log(

);

);

statusText.textContent =

sendChatBtn.disabled =

showPlaceholder();

</script>
