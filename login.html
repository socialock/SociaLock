        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        const loginEmail = document.getElementById('loginEmail');

        const registerBtn = document.getElementById('registerBtn');
        const googleSignInBtn = document.getElementById('googleSignInBtn');

        let currentCaptcha = '';
        let isUsernameAvailable = false;
        // Holds the Firebase user object when someone signed in with Google
        // but doesn't have an account yet, so "Create Account" can reuse the
        // same Firebase Auth user instead of trying to create a brand new
        // one with the same email (which Firebase rejects as already in use).
        let pendingGoogleUser = null;

        // ============================================================
        // 🌍 COUNTRY LIST (A-Z) - 197 countries
        // ============================================================
        const countryList = [
            "Afghanistan", "Albania", "Algeria", "Andorra", "Angola",
            "Antigua and Barbuda", "Argentina", "Armenia", "Australia", "Austria",
            "Azerbaijan", "Bahamas", "Bahrain", "Bangladesh", "Barbados",
            "Belarus", "Belgium", "Belize", "Benin", "Bhutan",
            "Bolivia", "Bosnia and Herzegovina", "Botswana", "Brazil", "Brunei",
            "Bulgaria", "Burkina Faso", "Burundi", "Cabo Verde", "Cambodia",

        // ============================================================
        // 🌍 CUSTOM DROPDOWN (search + list)
        // ============================================================
        let selectedCountry = '';

        function renderCountryList(filter = '') {
            const q = filter.toLowerCase().trim();
            let filtered = countryList;
            if (q) {
                filtered = countryList.filter(c => c.toLowerCase().includes(q));
            }
            if (filtered.length === 0) {
                countryDropdown.innerHTML = `<div class="no-result"><i class="fa-solid fa-magnifying-glass"></i> No country found</div>`;
                return;
            }
            let html = '';
            filtered.forEach(c => {
                const isSelected = (c === selectedCountry);
                html += `<div class="option-item ${isSelected ? 'selected' : ''}" data-value="${c}">${c}</div>`;
            });
            countryDropdown.innerHTML = html;

            // Click event
            countryDropdown.querySelectorAll('.option-item').forEach(el => {
                el.addEventListener('click', function() {
                    const val = this.getAttribute('data-value');
                    selectCountry(val);
                });
            });
        }

        function selectCountry(value) {
            selectedCountry = value;
            regCountryInput.value = value;
            regCountryHidden.value = value;
            countryDropdown.classList.remove('open');
            checkRegFormValidity();
        }

        // Filter as user types
        regCountryInput.addEventListener('input', function() {
            const val = this.value;
            // If the user types manually, it isn't selected
            if (val !== selectedCountry) {
                selectedCountry = '';
                regCountryHidden.value = '';
            }
            countryDropdown.classList.add('open');
            renderCountryList(val);
            checkRegFormValidity();
        });

        // Open dropdown on focus
        regCountryInput.addEventListener('focus', function() {
            countryDropdown.classList.add('open');
            renderCountryList(this.value);
        });

        // Close when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.custom-select-wrapper')) {
                countryDropdown.classList.remove('open');
            }
        });

        // Keyboard: Enter or Escape
        regCountryInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                countryDropdown.classList.remove('open');
                return;
            }
            if (e.key === 'Enter') {
                const first = countryDropdown.querySelector('.option-item:not(.no-result)');
                if (first) {
                    selectCountry(first.getAttribute('data-value'));
                }
                e.preventDefault();
            }
        });

        // ============================================================
        // 🔄 TABS
        // ============================================================
        loginTab.addEventListener('click', () => {
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
        });

        registerTab.addEventListener('click', () => {
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
            registerForm.classList.add('active');
            loginForm.classList.remove('active');
            updateRegCaptcha();
        });

        // ============================================================
        // 🔐 CAPTCHA
        // ============================================================
        function generateCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
            let captcha = '';
            for (let i = 0; i < 6; i++) {
                captcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return captcha;
        }

        function updateRegCaptcha() {
            currentCaptcha = generateCaptcha();
            regCaptchaDisplay.innerHTML = currentCaptcha.split('').map(char =>
                `<span style="transform:rotate(${Math.random()*30-15}deg); font-size:24px; font-weight:bold; color:hsl(${Math.random()*360},80%,55%); text-shadow:1px 1px 2px rgba(0,0,0,0.3); font-family:monospace;">${char}</span>`
            ).join('');
        }

        regRefreshCaptcha.addEventListener('click', () => {
            updateRegCaptcha();
            regCaptchaInput.value = '';
            checkRegFormValidity();
        });

        // ============================================================
        // 👤 USERNAME AVAILABILITY
        // ============================================================
        async function checkRegUsernameAvailability(username) {
            if (!username || username.length < 2) {
                regUsernameStatus.innerHTML = '';
                isUsernameAvailable = false;
                registerBtn.disabled = true;
                return;
            }

            const validPattern = /^[A-Za-z0-9_]+$/;
            if (!validPattern.test(username)) {
                regUsernameStatus.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Only English letters, numbers and underscore allowed';
                regUsernameStatus.className = 'username-availability username-unavailable';
                isUsernameAvailable = false;
                registerBtn.disabled = true;
                return;
            }

            if (username.length > 20) {
                regUsernameStatus.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Username cannot exceed 20 characters';
                regUsernameStatus.className = 'username-availability username-unavailable';
                isUsernameAvailable = false;
                registerBtn.disabled = true;
                return;
            }

            try {
                const result = await window.apiRequest(`/users/search?q=${username}`);
                if (result && result.success && result.data) {
                    const exists = result.data.some(u => u.username.toLowerCase() === username.toLowerCase());
                    if (exists) {
                        regUsernameStatus.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Username already taken!';
                        regUsernameStatus.className = 'username-availability username-unavailable';
                        isUsernameAvailable = false;
                        registerBtn.disabled = true;
                    } else {
                        regUsernameStatus.innerHTML = '<i class="fa-solid fa-circle-check"></i> Username available!';
                        regUsernameStatus.className = 'username-availability username-available';
                        isUsernameAvailable = true;
                        checkRegFormValidity();
                    }
                }
            } catch (err) {
                regUsernameStatus.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Error checking';
                isUsernameAvailable = false;
                registerBtn.disabled = true;
            }
        }

        regUsername.addEventListener('input', () => {
            const val = regUsername.value.trim();
            regUsername.value = val.replace(/[^A-Za-z0-9_]/g, '').slice(0, 20);
            checkRegUsernameAvailability(regUsername.value);
        });

        // ============================================================
        // ✅ FORM VALIDITY
        // ============================================================
        function checkRegFormValidity() {
            const email = regEmail.value.trim();
            const password = regPassword.value;
            const username = regUsername.value.trim();
            const country = regCountryHidden.value;
            const captcha = regCaptchaInput.value.trim();
            const isCaptchaValid = captcha.toUpperCase() === currentCaptcha.toUpperCase();

            const isValid = email && password.length >= 6 && isUsernameAvailable && country && isCaptchaValid;
            registerBtn.disabled = !isValid;
        }

        regEmail.addEventListener('input', checkRegFormValidity);
        regPassword.addEventListener('input', checkRegFormValidity);
        regCaptchaInput.addEventListener('input', checkRegFormValidity);

        // ============================================================
        // 🔑 LOGIN
        // ============================================================
        loginBtn.addEventListener('click', async () => {
            const email = loginEmail.value.trim();
            const password = loginPassword.value;

            if (!email || !password) {
                showAlert('Please enter email and password!', 'error');
                return;
            }

            loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';
            loginBtn.disabled = true;

            try {
                const firebaseUser = await firebase.auth().signInWithEmailAndPassword(email, password);
                const userId = firebaseUser.user.uid;

                // Firebase already verified this user's identity; exchange the known
                // user id for a signed app-level JWT used to authorize sensitive
                // settings actions (change password/email/username, block, privacy).
                localStorage.setItem('userId', userId);
                const result = await window.apiRequest(`/users/${userId}`);

                if (result && result.success) {
                    // Banned accounts are blocked from logging in entirely.
                    if (result.data && result.data.is_banned) {
                        try { await firebase.auth().signOut(); } catch (e) {}
                        localStorage.removeItem('userId');
                        localStorage.removeItem('token');
                        showAlert(result.data.ban_reason
                            ? `Your account has been banned. Reason: ${result.data.ban_reason}`
                            : 'Your account has been banned.', 'error');
                        loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
                        loginBtn.disabled = false;
                        return;
                    }

                    let tokenIssued = false;
                    try {
                        const idToken = await firebaseUser.user.getIdToken();
                        const tokenResult = await window.apiRequest('/auth/token', {
                            method: 'POST',
                            body: JSON.stringify({ id: userId, idToken })
                        });
                        if (tokenResult && tokenResult.success && tokenResult.data && tokenResult.data.token) {
                            localStorage.setItem('token', tokenResult.data.token);
                            tokenIssued = true;
                        } else if (tokenResult && tokenResult.banned) {
                            // Belt-and-suspenders: the server also refuses to issue a
                            // session token for a banned account.
                            try { await firebase.auth().signOut(); } catch (e) {}
                            localStorage.removeItem('userId');
                            localStorage.removeItem('token');
                            loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
                            loginBtn.disabled = false;
                            return;
                        }
                    } catch (tokenErr) { /* non-fatal - user can still browse read-only */ }

                    showAlert('Login successful!', 'success');
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 800);
                } else {
                    showAlert('User data not found!', 'error');
                    loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
                    loginBtn.disabled = false;
                }
            } catch (error) {
                showAlert('Login failed: ' + (error.message || 'Invalid credentials'), 'error');
                loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
                loginBtn.disabled = false;
            }
        });

        // ============================================================
        // 📝 REGISTER
        // ============================================================
        registerBtn.addEventListener('click', async () => {
            const email = regEmail.value.trim();
            const password = regPassword.value;
            const username = regUsername.value.trim();
            const country = regCountryHidden.value;
            const captcha = regCaptchaInput.value.trim();

            if (!email || !password || !username || !country || !captcha) {
                showAlert('Please fill in all fields!', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters!', 'error');
                return;
            }

            if (captcha.toUpperCase() !== currentCaptcha.toUpperCase()) {
                showAlert('Incorrect captcha!', 'error');
                updateRegCaptcha();
                regCaptchaInput.value = '';
                return;
            }

            registerBtn.innerHTML = '<span class="spinner"></span> Creating account...';
            registerBtn.disabled = true;

            // If the person got here via "Sign in with Google" (email already
            // authenticated with Firebase for that flow), reuse that same
            // Firebase user instead of calling createUserWithEmailAndPassword
            // again - Firebase would otherwise reject it with
            // "email-already-in-use" since the Google sign-in already created
            // the Firebase Auth record for this email.
            const isGoogleSignup = !!(pendingGoogleUser && pendingGoogleUser.email === email);
            let createdFirebaseUser = null;
            let userId;

            try {
                if (isGoogleSignup) {
                    userId = pendingGoogleUser.uid;
                } else {
                    createdFirebaseUser = await firebase.auth().createUserWithEmailAndPassword(email, password);
                    userId = createdFirebaseUser.user.uid;
                }

                const result = await window.apiRequest('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({
                        id: userId,
                        username: username,
                        email: email,
                        password: password,
                        country: country
                    })
                });

                if (result && result.success) {
                    pendingGoogleUser = null;
                    localStorage.setItem('userId', userId);
                    if (result.data && result.data.token) {
                        localStorage.setItem('token', result.data.token);
                    }
                    showAlert('Account created successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 800);
                } else {
                    // Only delete the Firebase user if we created it just now for
                    // this attempt - never delete the person's real Google-linked
                    // Firebase account just because our backend save failed.
                    if (createdFirebaseUser) {
                        await createdFirebaseUser.user.delete();
                    }
                    showAlert('Failed to save account data!', 'error');
                    registerBtn.innerHTML = '<i class="fa-solid fa-user-check"></i> Create Account';
                    registerBtn.disabled = false;
                }
            } catch (error) {
                showAlert('Registration failed: ' + (error.message || 'Unknown error'), 'error');
                registerBtn.innerHTML = '<i class="fa-solid fa-user-check"></i> Create Account';
                registerBtn.disabled = false;
            }
        });

        // ============================================================
        // 🅶 GOOGLE LOGIN
        // ============================================================
        googleSignInBtn.addEventListener('click', async () => {
            googleSignInBtn.innerHTML = '<span class="spinner"></span> Logging in...';
            googleSignInBtn.disabled = true;

            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.addScope('profile');
                provider.addScope('email');
                provider.setCustomParameters({ prompt: 'select_account' });

                const firebaseUser = await firebase.auth().signInWithPopup(provider);
                const user = firebaseUser.user;
                const userId = user.uid;

                const result = await window.apiRequest(`/users/${userId}`);
                if (result && result.success) {
                    // Banned accounts are blocked from logging in entirely.
                    if (result.data && result.data.is_banned) {
                        try { await firebase.auth().signOut(); } catch (e) {}
                        localStorage.removeItem('userId');
                        localStorage.removeItem('token');
                        showAlert(result.data.ban_reason
                            ? `Your account has been banned. Reason: ${result.data.ban_reason}`
                            : 'Your account has been banned.', 'error');
                        googleSignInBtn.innerHTML = '<span>Sign in with Google</span>';
                        googleSignInBtn.disabled = false;
                        return;
                    }

                    localStorage.setItem('userId', userId);
                    try {
                        const idToken = await user.getIdToken();
                        const tokenResult = await window.apiRequest('/auth/token', {
                            method: 'POST',
                            body: JSON.stringify({ id: userId, idToken })
                        });
                        if (tokenResult && tokenResult.success && tokenResult.data && tokenResult.data.token) {
                            localStorage.setItem('token', tokenResult.data.token);
                        } else if (tokenResult && tokenResult.banned) {
                            try { await firebase.auth().signOut(); } catch (e) {}
                            localStorage.removeItem('userId');
                            localStorage.removeItem('token');
                            googleSignInBtn.innerHTML = '<span>Sign in with Google</span>';
                            googleSignInBtn.disabled = false;
                            return;
                        }
                    } catch (tokenErr) { /* non-fatal */ }
                    showAlert('Login successful!', 'success');
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 800);
                } else {
                    pendingGoogleUser = user;
                    registerTab.click();
                    regEmail.value = user.email;
                    regEmail.disabled = true;
                    regUsername.focus();
                    showAlert('Please complete registration!', 'info');
                    googleSignInBtn.innerHTML = '<span>Sign in with Google</span>';
                    googleSignInBtn.disabled = false;
                }
            } catch (error) {
                showAlert('Google login failed: ' + (error.message || 'Unknown error'), 'error');
                googleSignInBtn.innerHTML = '<span>Sign in with Google</span>';
                googleSignInBtn.disabled = false;
            }
        });

        // ============================================================
        // 🔥 FIREBASE AUTH STATE
        // ============================================================
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
            } else {
            }
        });

        // ============================================================
        // 🚀 PAGE LOAD
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            localStorage.clear();
            sessionStorage.clear();
            updateRegCaptcha();
            renderCountryList();

            // Google email from previous step
            const googleEmail = localStorage.getItem('googleEmail');
            if (googleEmail) {
                registerTab.click();
                regEmail.value = googleEmail;
                regEmail.disabled = true;
                localStorage.removeItem('googleEmail');
            }

            // Country search placeholder
            regCountryInput.placeholder = 'Search country...';
        });

        // ============================================================
        // 🛠️ UTILITY: showAlert
        // ============================================================
        function showAlert(message, type = 'info') {
            const existing = document.querySelector('.custom-alert');
            if (existing) existing.remove();

            const icons = {
                success: 'fa-solid fa-circle-check',
                error: 'fa-solid fa-circle-exclamation',
                info: 'fa-solid fa-circle-info'
            };
            const iconClass = icons[type] || icons.info;

            const alert = document.createElement('div');
            alert.className = `custom-alert ${type}`;
            alert.style.display = 'flex';
            alert.style.alignItems = 'center';
            alert.style.gap = '10px';
            alert.innerHTML = `
                <i class="${iconClass}"></i>
                <span style="flex:1;">${message}</span>
                <button onclick="this.parentElement.remove()" style="display:flex;"><i class="fa-solid fa-xmark"></i></button>
            `;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 4000);
        }

    </script>
