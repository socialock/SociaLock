<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - SociaLock</title>
    
    <!-- ===== FIREBASE CDN ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #18191a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e4e6eb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: #242526;
            border-radius: 12px;
            padding: 2rem 1.5rem;
            border: 1px solid #3a3b3c;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 1.8rem;
        }
        .header .icon {
            font-size: 2.8rem;
            color: #1877f2;
            margin-bottom: 6px;
        }
        .header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #e4e6eb;
        }
        .header p {
            color: #b0b3b8;
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #b0b3b8;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #3a3b3c;
            border: 1px solid #3a3b3c;
            border-radius: 8px;
            color: #e4e6eb;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: #1877f2;
            box-shadow: 0 0 0 3px rgba(24,119,242,0.15);
        }
        .form-group input::placeholder {
            color: #b0b3b8;
        }
        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            background: #1877f2;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .btn-primary:hover:not(:disabled) {
            background: #166fe5;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: none;
            border: none;
            color: #b0b3b8;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
            transition: 0.3s;
            display: inline-block;
            margin-top: 12px;
        }
        .btn-secondary:hover {
            color: #e4e6eb;
        }
        .message {
            margin-top: 1rem;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }
        .message.success {
            display: block;
            background: rgba(76,175,80,0.15);
            color: #4caf50;
            border: 1px solid #4caf50;
        }
        .message.error {
            display: block;
            background: rgba(233,69,96,0.15);
            color: #e94560;
            border: 1px solid #e94560;
        }
        .message.info {
            display: block;
            background: rgba(24,119,242,0.15);
            color: #1877f2;
            border: 1px solid #1877f2;
        }
        .footer {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.8rem;
            color: #b0b3b8;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 480px) {
            .container { padding: 1.5rem 1rem; }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="icon"><i class="fas fa-key"></i></div>
            <h2>Reset Password</h2>
            <p>Enter your email and we'll send you a reset link</p>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="your@email.com" required />
        </div>

        <button class="btn-primary" id="resetBtn">
            <i class="fas fa-paper-plane"></i> Send Reset Link
        </button>

        <div style="text-align:center; margin-top:10px;">
            <button class="btn-secondary" onclick="window.location.href='login.html'">
                <i class="fas fa-arrow-left"></i> Back to Login
            </button>
        </div>

        <div id="message" class="message"></div>

        <div class="footer">
            <span>🔒 Secure • SociaLock</span>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        // ============================================================
        // resetpassword.js – ফুল লজিক (ডেইলি লিমিট ৫)
        // ============================================================

        (function() {
            'use strict';

            var emailInput = document.getElementById('email');
            var resetBtn = document.getElementById('resetBtn');
            var messageDiv = document.getElementById('message');

            // ===== ইউটিলিটি =====
            function showMessage(text, type) {
                messageDiv.className = 'message ' + type;
                messageDiv.textContent = text;
                messageDiv.style.display = 'block';
            }

            function hideMessage() {
                messageDiv.style.display = 'none';
            }

            function setLoading(loading) {
                resetBtn.disabled = loading;
                resetBtn.innerHTML = loading ?
                    '<span class="spinner"></span> Sending...' :
                    '<i class="fas fa-paper-plane"></i> Send Reset Link';
            }

            // ===== মূল ফাংশন =====
            async function handleResetPassword() {
                var email = emailInput.value.trim();

                if (!email) {
                    showMessage('Please enter your email address.', 'error');
                    return;
                }

                if (!email.includes('@') || !email.includes('.')) {
                    showMessage('Please enter a valid email address.', 'error');
                    return;
                }

                hideMessage();
                setLoading(true);

                try {
                    // ১. Worker API-তে চেক করুন (ডেইলি লিমিট)
                    var checkResult = await window.apiRequest('/auth/reset-password', {
                        method: 'POST',
                        body: JSON.stringify({ email: email })
                    });

                    if (!checkResult || !checkResult.success) {
                        var errorMsg = checkResult?.error || 'Something went wrong. Please try again.';
                        showMessage(errorMsg, 'error');
                        setLoading(false);
                        return;
                    }

                    // ২. লিমিট পাস – Firebase-এ রিকুয়েস্ট পাঠান
                    try {
                        await firebase.auth().sendPasswordResetEmail(email);
                        showMessage(
                            '✅ Password reset link sent to your email. Please check your inbox (and spam folder).',
                            'success'
                        );
                        emailInput.value = '';
                    } catch (firebaseError) {
                        console.error('Firebase reset error:', firebaseError);
                        // Firebase error handling
                        var fbMsg = firebaseError.message || 'Failed to send reset email.';
                        if (firebaseError.code === 'auth/user-not-found') {
                            fbMsg = 'No account found with this email address.';
                        }
                        showMessage('❌ ' + fbMsg, 'error');
                    }

                } catch (error) {
                    console.error('Reset error:', error);
                    showMessage('❌ Network error. Please check your connection.', 'error');
                }

                setLoading(false);
            }

            // ===== ইভেন্ট লিসেনার =====
            resetBtn.addEventListener('click', handleResetPassword);

            emailInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    resetBtn.click();
                }
            });

            // ফোকাসে মেসেজ হাইড
            emailInput.addEventListener('focus', hideMessage);

            console.log('✅ Reset password page loaded');
        })();
    </script>
</body>
</html>
