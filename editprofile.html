<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Edit Profile - SociaLock</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: #18191a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e4e6eb;
            min-height: 100vh;
        }
        .back-header {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            border-bottom: 1px solid #3a3b3c; position: sticky; top: 0; background: #18191a; z-index: 5;
        }
        .back-header .back-btn { background: none; border: none; color: #b0b3b8; font-size: 22px; cursor: pointer; padding: 4px 8px; border-radius: 50%; transition: 0.2s; display: flex; }
        .back-header .back-btn:hover { background: #3a3b3c; color: #e4e6eb; }
        .back-header .back-title { font-size: 18px; font-weight: 600; }

        .main-container { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }

        .avatar-preview { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
        .avatar-circle { width: 84px; height: 84px; border-radius: 50%; background: #1877f2; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 700; color: white; }

        .form-card { background: #242526; border: 1px solid #3a3b3c; border-radius: 14px; padding: 20px 18px; }
        .form-group { margin-bottom: 18px; }
        .form-group:last-child { margin-bottom: 0; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #b0b3b8; margin-bottom: 6px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid #3a3b3c;
            background: #18191a; color: #e4e6eb; font-size: 0.95rem; outline: none; font-family: inherit; resize: vertical;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: #1877f2; }
        .form-group textarea { min-height: 90px; }
        .char-count { text-align: right; font-size: 0.75rem; color: #8a8d91; margin-top: 4px; }
        .hint { font-size: 0.75rem; color: #8a8d91; margin-top: 4px; }
        .field-status { font-size: 0.8rem; margin-top: 4px; min-height: 1em; }
        .field-status.ok { color: #4caf50; }
        .field-status.bad { color: #e94560; }

        .btn-save {
            width: 100%; margin-top: 22px; padding: 12px; background: #1877f2; border: none;
            border-radius: 10px; color: white; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-save:hover:not(:disabled) { background: #166fe5; }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .custom-alert { position: fixed; top: 20px; right: 20px; left: 20px; padding: 12px 16px; border-radius: 12px; color: white; z-index: 9999; max-width: 440px; margin: 0 auto; font-size: 0.95rem; box-shadow: 0 8px 24px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 10px; }
        .custom-alert.success { background: #2e7d32; }
        .custom-alert.error { background: #c62828; }
        .custom-alert.info { background: #0d47a1; }
    </style>
</head>
<body>

    <div class="back-header">
        <a href="settings.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <div class="back-title">Edit Profile</div>
    </div>

    <div class="main-container">
        <div class="avatar-preview">
            <div class="avatar-circle" id="avatarInitial">?</div>
        </div>

        <div class="form-card">
            <div class="form-group">
                <label for="usernameInput"><i class="fas fa-at"></i> Username</label>
                <input type="text" id="usernameInput" maxlength="20" placeholder="Username" autocomplete="off">
                <div class="field-status" id="usernameStatus"></div>
                <div class="hint">2-20 characters — letters, numbers and underscore only</div>
            </div>

            <div class="form-group">
                <label for="bioInput"><i class="fas fa-pen"></i> Bio</label>
                <textarea id="bioInput" maxlength="300" placeholder="Tell people about yourself..."></textarea>
                <div class="char-count"><span id="bioCharCount">0</span>/300</div>
            </div>
        </div>

        <button class="btn-save" id="saveBtn"><i class="fas fa-check"></i> Save Changes</button>
    </div>

    <script src="js/config.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        const userId = localStorage.getItem('userId');
        if (!userId) window.location.href = 'login.html';

        const usernameInput = document.getElementById('usernameInput');
        const usernameStatus = document.getElementById('usernameStatus');
        const bioInput = document.getElementById('bioInput');
        const bioCharCount = document.getElementById('bioCharCount');
        const saveBtn = document.getElementById('saveBtn');
        const avatarInitial = document.getElementById('avatarInitial');

        let originalUsername = '';
        let originalBio = '';
        let usernameValid = true;

        bioInput.addEventListener('input', () => {
            bioCharCount.textContent = bioInput.value.length;
        });

        usernameInput.addEventListener('input', () => {
            usernameInput.value = usernameInput.value.replace(/[^A-Za-z0-9_]/g, '');
            const val = usernameInput.value;
            if (val.length > 0 && val.length < 2) {
                usernameStatus.textContent = 'Too short (min 2 characters)';
                usernameStatus.className = 'field-status bad';
                usernameValid = false;
            } else {
                usernameStatus.textContent = '';
                usernameStatus.className = 'field-status';
                usernameValid = true;
            }
        });

        async function loadProfile() {
            const result = await window.apiRequest(`/users/${userId}`);
            if (result && result.success) {
                originalUsername = result.data.username || '';
                originalBio = result.data.bio || '';
                usernameInput.value = originalUsername;
                bioInput.value = originalBio;
                bioCharCount.textContent = originalBio.length;
                avatarInitial.textContent = originalUsername.charAt(0).toUpperCase() || '?';
            }
        }

        saveBtn.addEventListener('click', async () => {
            const newUsername = usernameInput.value.trim();
            const newBio = bioInput.value;

            if (!usernameValid || newUsername.length < 2) {
                showAlert('Please enter a valid username (2-20 characters).', 'error');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner"></span> Saving...';

            try {
                let ok = true;

                if (newUsername !== originalUsername) {
                    const res = await window.apiRequest(`/users/${userId}/username`, {
                        method: 'PUT',
                        body: JSON.stringify({ username: newUsername })
                    });
                    if (!res || !res.success) ok = false;
                }

                if (ok && newBio !== originalBio) {
                    const res = await window.apiRequest(`/users/${userId}/bio`, {
                        method: 'PUT',
                        body: JSON.stringify({ bio: newBio })
                    });
                    if (!res || !res.success) ok = false;
                }

                if (ok) {
                    showAlert('Profile updated successfully!', 'success');
                    originalUsername = newUsername;
                    originalBio = newBio;
                    setTimeout(() => { window.location.href = 'settings.html'; }, 900);
                }
            } catch (err) {
                showAlert('Something went wrong. Please try again.', 'error');
            }

            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="fas fa-check"></i> Save Changes';
        });

        loadProfile();
    </script>
</body>
</html>
