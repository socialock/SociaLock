<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Create Post - SociaLock</title>
    <!-- ===== SEO ===== -->
    <meta name="description" content="Create a new post to share with the SociaLock community." />
    <meta name="keywords" content="create post" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="author" content="SociaLock" />
    <link rel="canonical" href="https://socialock.pages.dev/createpost.html" />
    <meta name="theme-color" content="#1877f2" />
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icon-180.png" />
    <!-- ===== SEO END ===== -->
    
    <!-- ===== FIREBASE CDN (load first) ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ===== Reset ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #18191a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e4e6eb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 30px;
        }

        .create-post-container {
            max-width: 680px;
            width: 100%;
            margin: 0 16px;
            padding: 0;
        }

        .create-post-card {
            background: #242526;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            border: 1px solid #3a3b3c;
        }

        .create-post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #3a3b3c;
        }

        .create-post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #1877f2;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
        }

        .create-post-user {
            font-weight: 600;
            font-size: 16px;
            color: #e4e6eb;
        }

        .create-post-textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px 16px;
            border: none;
            background: #3a3b3c;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            font-family: inherit;
            color: #e4e6eb;
            outline: none;
            transition: 0.2s;
            box-sizing: border-box;
        }

        .create-post-textarea:focus {
            border: 1px solid #1877f2;
            background: #2a2a2a;
        }

        .create-post-textarea::placeholder {
            color: #b0b3b8;
        }

        .post-preview {
            margin-top: 16px;
            padding: 16px;
            background: #3a3b3c;
            border-radius: 8px;
            display: none;
            border-left: 3px solid #1877f2;
        }

        .post-preview.show {
            display: block;
        }

        .post-preview-title {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b0b3b8;
        }

        .post-preview-content {
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            color: #e4e6eb;
        }

        .create-post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #3a3b3c;
            flex-wrap: wrap;
            gap: 10px;
        }

        .char-count {
            color: #b0b3b8;
            font-size: 14px;
        }

        .footer-buttons {
            display: flex;
            gap: 8px;
        }

        .create-post-btn {
            padding: 8px 24px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .create-post-btn.cancel {
            background: #3a3b3c;
            color: #e4e6eb;
        }

        .create-post-btn.cancel:hover {
            background: #4a4b4c;
        }

        .create-post-btn.submit {
            background: #1877f2;
            color: white;
        }

        .create-post-btn.submit:hover {
            background: #166fe5;
        }

        .create-post-btn.submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .custom-alert {
            position: fixed;
            top: 70px;
            right: 10px;
            left: 10px;
            padding: 12px;
            border-radius: 8px;
            color: white;
            z-index: 10000;
            max-width: 400px;
            margin: 0 auto;
            animation: slideIn 0.3s ease;
        }

        .custom-alert.success {
            background: #4caf50;
        }
        .custom-alert.error {
            background: #e94560;
        }
        .custom-alert.info {
            background: #1877f2;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            body {
                padding-top: 16px;
            }
            .create-post-container {
                margin: 0 8px;
            }
            .create-post-card {
                padding: 16px;
            }
            .create-post-textarea {
                min-height: 150px;
                font-size: 15px;
            }
            .create-post-footer {
                flex-direction: column;
                align-items: stretch;
            }
            .footer-buttons {
                justify-content: flex-end;
            }
            .create-post-btn {
                padding: 6px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="create-post-container">
        <div class="create-post-card">
            <div class="create-post-header">
                <div class="create-post-avatar" id="userAvatar">U</div>
                <div class="create-post-user" id="userName">User</div>
            </div>

            <textarea class="create-post-textarea" id="postContent" placeholder="What's on your mind?" maxlength="300"></textarea>

            <div class="post-preview" id="postPreview">
                <div class="post-preview-title">📄 Preview</div>
                <div class="post-preview-content" id="previewContent"></div>
            </div>

            <div class="create-post-footer">
                <span class="char-count" id="charCount">0/300</span>
                <div class="footer-buttons">
                    <button class="create-post-btn cancel" onclick="window.location.href='home.html'">Cancel</button>
                    <button class="create-post-btn submit" id="postBtn" disabled>Post</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                window.location.href = 'login.html';
                return;
            }

            // Get user from API
            const result = await window.apiRequest(`/users/${userId}`);
            if (!result || !result.success) {
                localStorage.removeItem('userId');
                window.location.href = 'login.html';
                return;
            }

            const user = result.data;
            document.getElementById('userAvatar').textContent = user.username.charAt(0).toUpperCase();
            document.getElementById('userName').textContent = user.username;

            const textarea = document.getElementById('postContent');
            const charCount = document.getElementById('charCount');
            const postBtn = document.getElementById('postBtn');
            const previewContent = document.getElementById('previewContent');
            const postPreview = document.getElementById('postPreview');

            textarea.addEventListener('input', function() {
                const length = this.value.length;
                charCount.textContent = `${length}/300`;
                postBtn.disabled = length === 0 || length > 300;

                if (this.value.trim()) {
                    previewContent.textContent = this.value;
                    postPreview.classList.add('show');
                } else {
                    postPreview.classList.remove('show');
                }
            });

            postBtn.addEventListener('click', async function() {
                const content = textarea.value.trim();
                if (!content || content.length > 300) return;

                this.disabled = true;
                this.textContent = '⏳ Posting...';

                const result = await window.apiRequest('/posts', {
                    method: 'POST',
                    body: JSON.stringify({
                        user_id: user.id,
                        username: user.username,
                        content: content
                    })
                });

                if (result && result.success) {
                    showAlert('✅ Post created!', 'success');
                    // Invalidate the cached home feed so the new post shows up
                    // immediately instead of the stale cached list
                    sessionStorage.removeItem('homeFeedCache_v1');
                    sessionStorage.removeItem('homeScrollY_v1');
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 1000);
                } else {
                    // apiRequest() already showed the specific error (e.g. a ban
                    // message) for any failed request - don't overwrite it here.
                    this.disabled = false;
                    this.textContent = 'Post';
                }
            });

            textarea.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    if (!postBtn.disabled) postBtn.click();
                }
            });
        });
    </script>
</body>
</html>
