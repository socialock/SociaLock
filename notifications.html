    <script>
        // ===== Custom confirm =====
        let pendingConfirmResolve = null;
        function customConfirm(title, message, icon = '⚠️') {
            return new Promise(function(resolve) {
                document.getElementById('modalIcon').textContent = icon;
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalMessage').textContent = message;
                document.getElementById('customModal').classList.add('show');
                pendingConfirmResolve = resolve;
            });
        }
        document.getElementById('modalCancel').addEventListener('click', function() {
            document.getElementById('customModal').classList.remove('show');
            if (pendingConfirmResolve) { pendingConfirmResolve(false); pendingConfirmResolve = null; }
        });
        document.getElementById('modalConfirm').addEventListener('click', function() {
            document.getElementById('customModal').classList.remove('show');
            if (pendingConfirmResolve) { pendingConfirmResolve(true); pendingConfirmResolve = null; }
        });
        document.getElementById('customModal').addEventListener('click', function(e) {
            if (e.target === this) {
                document.getElementById('customModal').classList.remove('show');
                if (pendingConfirmResolve) { pendingConfirmResolve(false); pendingConfirmResolve = null; }
            }
        });

        // ===== SKELETON CONTROLS =====
        function showSkeleton() {
            document.getElementById('skeletonHeader').style.display = 'flex';
            document.getElementById('skeletonNotifs').style.display = 'flex';
            document.getElementById('realHeader').style.display = 'none';
            document.getElementById('notificationsContainer').style.display = 'none';
        }

        function hideSkeletonAndShowReal() {
            document.getElementById('skeletonHeader').style.display = 'none';
            document.getElementById('skeletonNotifs').style.display = 'none';
            document.getElementById('realHeader').style.display = 'flex';
            document.getElementById('notificationsContainer').style.display = 'block';
        }

        // ============================================================
        // NOTIFICATIONS - INDIVIDUAL READ REMOVED
        // ============================================================


        let currentUser = null;
        let allNotifications = [];
        let container = document.getElementById('notificationsContainer');
        let badge = document.getElementById('notifBadge');

        // ============================================================
        // OPEN NOTIFICATION (marks it read, then navigates)
        // ============================================================
        async function openNotification(notifId, navUrl) {
            const userId = localStorage.getItem('userId');
            const notif = allNotifications.find(n => n.id === notifId);

            if (userId && notif && !notif.is_read) {
                try {
                    await window.apiRequest(`/notifications/${notifId}/read`, {
                        method: 'PUT',
                        body: JSON.stringify({ user_id: userId })
                    });
                    notif.is_read = true;
                    await updateBadge();
                } catch (err) { /* ignore - still navigate */ }
            }

            if (navUrl && navUrl !== '#') {
                window.location.href = navUrl;
            }
        }
        window.openNotification = openNotification;

        // ============================================================
        // DELETE NOTIFICATION (keep this)
        // ============================================================
        async function deleteNotification(notifId, event) {
            event.stopPropagation();
            if (!(await customConfirm('Delete Notification', 'Delete this notification?', ''))) return;

            const userId = localStorage.getItem('userId');
            if (!userId) {
                showAlert('Please login first!', 'error');
                return;
            }

            try {
                const result = await window.apiRequest(`/notifications/${notifId}`, {
                    method: 'DELETE',
                    body: JSON.stringify({ user_id: userId })
                });

                if (result && result.success) {
                    allNotifications = allNotifications.filter(n => n.id !== notifId);
                    renderNotifications(allNotifications);
                    await updateBadge();
                    showAlert('✅ Notification deleted!', 'success');
                } else {
                    showAlert('Failed to delete!', 'error');
                }
            } catch (err) {
                showAlert('Failed to delete!', 'error');
            }
        }

        // ============================================================
        // MARK ALL READ - works, keep this
        // ============================================================
        async function markAllAsRead() {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                showAlert('Please login first!', 'error');
                return;
            }

            try {
                const result = await window.apiRequest('/notifications/read-all', {
                    method: 'PUT',
                    body: JSON.stringify({ user_id: userId })
                });

                if (result && result.success) {
                    allNotifications.forEach(n => n.is_read = true);
                    renderNotifications(allNotifications);
                    await updateBadge();
                    showAlert('✅ All marked as read!', 'success');
                } else {
                    showAlert('Failed to mark all as read!', 'error');
                }
            } catch (err) {
                showAlert('Failed to mark all as read!', 'error');
            }
        }

        // ============================================================
        // DELETE ALL
        // ============================================================
        async function deleteAllNotifications() {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                showAlert('Please login first!', 'error');
                return;
            }

            if (!(await customConfirm('Delete All Notifications', 'This will permanently delete all your notifications. This cannot be undone!', '⚠️'))) return;

            try {
                const result = await window.apiRequest('/notifications/delete-all', {
                    method: 'DELETE',
                    body: JSON.stringify({ user_id: userId })
                });

                if (result && result.success) {
                    allNotifications = [];
                    renderNotifications(allNotifications);
                    await updateBadge();
                    showAlert('✅ All notifications deleted!', 'success');
                } else {
                    showAlert('Failed to delete all!', 'error');
                }
            } catch (err) {
                showAlert('Failed to delete all!', 'error');
            }
        }

        // ============================================================
        // FETCH NOTIFICATIONS
        // ============================================================
        async function fetchNotifications() {
            const userId = localStorage.getItem('userId');
            if (!userId) return [];

            try {
                const result = await window.apiRequest(`/notifications?userId=${userId}`);
                if (result && result.success) {
                    return result.data || [];
                }
            } catch (err) {
            }
            return [];
        }

        // ============================================================
        // GET UNREAD COUNT
        // ============================================================
        async function getUnreadCount() {
            const userId = localStorage.getItem('userId');
            if (!userId) return 0;

            try {
                const result = await window.apiRequest(`/notifications?userId=${userId}`);
                if (result && result.success) {
                    return (result.data || []).filter(n => !n.is_read).length;
                }
            } catch (err) { }
            return 0;
        }

        // ============================================================
        // UPDATE BADGE
        // ============================================================
        async function updateBadge() {
            if (!badge) return;
            try {
                const count = await getUnreadCount();
                badge.textContent = count > 9 ? '9+' : count;
                badge.classList.toggle('show', count > 0);
            } catch (e) { }
        }

        // ============================================================
        // RENDER NOTIFICATIONS - No individual mark as read
        // ============================================================
        function renderNotifications(notifications) {
            if (!notifications || notifications.length === 0) {
                container.innerHTML = `
                    <div class="no-notifs">
                        <span class="icon"><i class="fas fa-bell-slash"></i></span>
                        <h3>No notifications yet</h3>
                        <p>When someone likes, comments or replies to your posts, you will see it here.</p>
                    </div>
                `;
                hideSkeletonAndShowReal();
                return;
            }

            let html = '';
            notifications.forEach(notif => {
                const isUnread = !notif.is_read;
                const timeAgoText = timeAgo(notif.created_at);

                let iconHtml = '';
                let iconClass = '';
                if (notif.type === 'like') {
                    iconHtml = '<i class="fas fa-heart"></i>';
                    iconClass = 'like';
                } else if (notif.type === 'comment') {
                    iconHtml = '<i class="fas fa-comment"></i>';
                    iconClass = 'comment';
                } else if (notif.type === 'reply') {
                    iconHtml = '<i class="fas fa-reply"></i>';
                    iconClass = 'reply';
                } else if (notif.type === 'follow') {
                    iconHtml = '<i class="fas fa-user-plus"></i>';
                    iconClass = 'follow';
                } else {
                    iconHtml = '<i class="fas fa-bell"></i>';
                    iconClass = '';
                }

                const actorName = escapeHtml(notif.actor_username || 'User');
                const actorInitial = (notif.actor_username || 'U').charAt(0).toUpperCase();
                const actorCount = notif.actor_count || 1;

                let message = '';
                if (notif.type === 'like') {
                    if (actorCount > 1) {
                        const othersCount = actorCount - 1;
                        message = `<strong>${actorName}</strong> and <strong>${othersCount} other${othersCount > 1 ? 's' : ''}</strong> liked your post`;
                    } else {
                        message = `<strong>${actorName}</strong> liked your post`;
                    }
                } else if (notif.type === 'comment') {
                    message = `<strong>${actorName}</strong> commented on your post`;
                } else if (notif.type === 'reply') {
                    message = `<strong>${actorName}</strong> replied to your comment`;
                } else if (notif.type === 'follow') {
                    message = `<strong>${actorName}</strong> started following you`;
                } else {
                    message = `<strong>${actorName}</strong> interacted with your post`;
                }

                const navUrl = notif.post_id ? `post.html?postId=${notif.post_id}` : '#';
                const unreadClass = isUnread ? 'unread' : '';

                html += `
                    <div class="notif-item ${unreadClass}" data-id="${notif.id}" onclick="openNotification('${notif.id}', '${navUrl}')">
                        <div class="notif-avatar" onclick="event.stopPropagation(); window.location.href='userprofile.html?userId=${notif.actor_id}'">${actorInitial}</div>
                        <div class="notif-body">
                            <div class="notif-text">${message}</div>
                            <div class="notif-time">${timeAgoText}</div>
                        </div>
                        <div class="notif-icon ${iconClass}">${iconHtml}</div>
                        <button class="notif-delete-btn" onclick="event.stopPropagation(); deleteNotification('${notif.id}', event)"><i class="fas fa-times"></i></button>
                    </div>
                `;
            });

            container.innerHTML = html;
            hideSkeletonAndShowReal();
        }

        // ============================================================
        // PAGE LOAD
        // ============================================================
        document.addEventListener('DOMContentLoaded', async function() {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                window.location.href = 'login.html';
                return;
            }

            // Show skeleton immediately
            showSkeleton();

            try {
                // Load user
                const userResult = await window.apiRequest(`/users/${userId}`);
                if (userResult && userResult.success) {
                    currentUser = userResult.data;
                } else {
                    localStorage.removeItem('userId');
                    window.location.href = 'login.html';
                    return;
                }

                // Load notifications
                allNotifications = await fetchNotifications();
                renderNotifications(allNotifications);
                await updateBadge();

                // Event listeners
                document.getElementById('markAllReadBtn').addEventListener('click', markAllAsRead);
                document.getElementById('deleteAllBtn').addEventListener('click', deleteAllNotifications);

                document.getElementById('profileNavBtn').addEventListener('click', function(e) {
                    e.preventDefault();
                    if (currentUser) {
                        window.location.href = `userprofile.html?userId=${currentUser.id}`;
                    }
                });

                setInterval(async () => {
                    allNotifications = await fetchNotifications();
                    renderNotifications(allNotifications);
                    await updateBadge();
                }, 30000);


            } catch (err) {
                container.innerHTML = `
                    <div class="no-notifs" style="padding:40px;text-align:center;">
                        <span class="icon" style="font-size:48px;color:#e94560;"><i class="fas fa-exclamation-circle"></i></span>
                        <h3>Error Loading Page</h3>
                        <p>${err.message || 'Something went wrong'}</p>
                        <button onclick="location.reload()" style="margin-top:16px;padding:10px 24px;background:#1877f2;border:none;color:white;border-radius:8px;cursor:pointer;"><i class="fas fa-sync"></i> Retry</button>
                    </div>
                `;
                hideSkeletonAndShowReal();
            }
        });
    </script>
</body>
</html>
