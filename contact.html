<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Contact Us - SociaLock</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: #18191a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e4e6eb;
            min-height: 100vh;
        }

        .back-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #3a3b3c;
            position: sticky;
            top: 0;
            background: #18191a;
            z-index: 5;
        }
        .back-header .back-btn { background: none; border: none; color: #b0b3b8; font-size: 22px; cursor: pointer; padding: 4px 8px; border-radius: 50%; transition: 0.2s; text-decoration: none; display: flex; }
        .back-header .back-btn:hover { background: #3a3b3c; color: #e4e6eb; }
        .back-header .back-title { font-size: 18px; font-weight: 600; }

        .main-container { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }

        .contact-hero { text-align: center; padding: 16px 12px 26px; }
        .contact-hero .icon { font-size: 2.6rem; color: #e94560; margin-bottom: 10px; }
        .contact-hero h2 { font-size: 1.2rem; margin-bottom: 6px; }
        .contact-hero p { color: #b0b3b8; font-size: 0.9rem; }

        .contact-channels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
        .channel-card {
            background: #242526; border: 1px solid #3a3b3c; border-radius: 12px; padding: 16px 12px;
            text-align: center; text-decoration: none; color: #e4e6eb;
        }
        .channel-card i { font-size: 1.3rem; color: #1877f2; margin-bottom: 8px; display: block; }
        .channel-card .title { font-size: 0.85rem; font-weight: 600; margin-bottom: 2px; }
        .channel-card .sub { font-size: 0.75rem; color: #8a8d91; word-break: break-word; }

        .contact-form { background: #242526; border: 1px solid #3a3b3c; border-radius: 14px; padding: 20px 18px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; color: #b0b3b8; margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid #3a3b3c;
            background: #18191a; color: #e4e6eb; font-size: 0.9rem; outline: none; font-family: inherit; resize: vertical;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #1877f2; }
        .form-group textarea { min-height: 110px; }
        .char-count { text-align: right; font-size: 0.75rem; color: #8a8d91; margin-top: 4px; }

        .submit-btn {
            width: 100%; padding: 13px; border: none; border-radius: 24px; background: #e94560; color: white;
            font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .submit-btn:hover { background: #c62828; }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .demo-note { text-align: center; font-size: 0.75rem; color: #6a6d70; margin-top: 14px; }

        /* ===== Custom Alert Toast ===== */
        .custom-alert {
            position: fixed;
            top: 20px;
            right: 20px;
            left: 20px;
            padding: 12px 16px;
            border-radius: 12px;
            color: white;
            z-index: 9999;
            max-width: 440px;
            margin: 0 auto;
            animation: alertSlideDown 0.3s ease;
            font-size: 0.95rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .custom-alert span { flex: 1; }
        .custom-alert.success { background: #2e7d32; }
        .custom-alert.error { background: #c62828; }
        .custom-alert.info { background: #0d47a1; }
        @keyframes alertSlideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .custom-alert button { background: none; border: none; color: white; margin-left: 10px; cursor: pointer; font-size: 1.2rem; opacity: 0.7; padding: 0 4px; flex-shrink: 0; }
        .custom-alert button:hover { opacity: 1; }

        @media (max-width: 480px) {
            .main-container { padding: 12px 12px 32px; }
        }
    </style>
</head>
<body>

    <div class="back-header">
        <a href="home.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <div class="back-title">Contact Us</div>
    </div>

    <div class="main-container">

        <div class="contact-hero">
            <div class="icon"><i class="fas fa-comment-dots"></i></div>
            <h2>Get in touch</h2>
            <p>Have a question, feedback, or a problem to report? Send us a message.</p>
        </div>

        <div class="contact-channels">
            <a href="mailto:support@socialock.app" class="channel-card">
                <i class="fas fa-envelope"></i>
                <div class="title">Email</div>
                <div class="sub">support@socialock.app</div>
            </a>
            <a href="help.html" class="channel-card">
                <i class="fas fa-question-circle"></i>
                <div class="title">Help Center</div>
                <div class="sub">Browse FAQs</div>
            </a>
        </div>

        <form class="contact-form" id="contactForm">
            <div class="form-group">
                <label for="cName">Name</label>
                <input type="text" id="cName" placeholder="Your name" required>
            </div>
            <div class="form-group">
                <label for="cEmail">Email</label>
                <input type="email" id="cEmail" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="cTopic">Topic</label>
                <select id="cTopic">
                    <option value="general">General question</option>
                    <option value="bug">Report a bug</option>
                    <option value="account">Account issue</option>
                    <option value="feedback">Feedback / suggestion</option>
                </select>
            </div>
            <div class="form-group">
                <label for="cMessage">Message</label>
                <textarea id="cMessage" maxlength="500" placeholder="How can we help?" required></textarea>
                <div class="char-count"><span id="cCount">0</span>/500</div>
            </div>
            <button type="submit" class="submit-btn" id="cSubmitBtn">Send Message</button>
        </form>
        <div class="demo-note">This is a demo form — messages aren't sent to a live inbox yet.</div>
    </div>

    <script src="js/config.js"></script>
    <script>
        if (!localStorage.getItem('userId')) {
            window.location.href = 'login.html';
        }

        const messageInput = document.getElementById('cMessage');
        const charCount = document.getElementById('cCount');
        messageInput.addEventListener('input', function() {
            charCount.textContent = this.value.length;
        });

        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('cSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Sending...';

            setTimeout(function() {
                showAlert('✅ Message sent! Our team will get back to you soon.', 'success');
                document.getElementById('contactForm').reset();
                charCount.textContent = '0';
                btn.disabled = false;
                btn.textContent = 'Send Message';
            }, 900);
        });
    </script>
</body>
</html>
