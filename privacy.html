<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Privacy Controls - SociaLock</title>
    <!-- ===== SEO ===== -->
    <meta name="description" content="Manage your privacy and security controls on SociaLock." />
    <meta name="keywords" content="privacy controls, account security settings" />
    <meta name="robots" content="noindex, follow" />
    <meta name="author" content="SociaLock" />
    <link rel="canonical" href="https://socialock.pages.dev/privacy.html" />
    <meta name="theme-color" content="#1877f2" />
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icon-180.png" />
    <!-- ===== SEO END ===== -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { background: #18191a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #e4e6eb; min-height: 100vh; }
        .back-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #3a3b3c; position: sticky; top: 0; background: #18191a; z-index: 5; }
        .back-header .back-btn { background: none; border: none; color: #b0b3b8; font-size: 22px; cursor: pointer; padding: 4px 8px; border-radius: 50%; transition: 0.2s; display: flex; }
        .back-header .back-btn:hover { background: #3a3b3c; color: #e4e6eb; }
        .back-header .back-title { font-size: 18px; font-weight: 600; }
        .main-container { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
        .section-title { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.6px; color: #8a8d91; padding: 0 4px 8px; font-weight: 600; }
        .option-card { background: #242526; border: 1px solid #3a3b3c; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        .option-item { display: flex; align-items: center; gap: 14px; padding: 16px; cursor: pointer; border-bottom: 1px solid #3a3b3c; transition: 0.2s; }
        .option-item:last-child { border-bottom: none; }
        .option-item:hover { background: #2a2b2c; }
        .option-item .icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: white; flex-shrink: 0; }
        .option-item .text { flex: 1; min-width: 0; }
        .option-item .label { font-size: 0.95rem; font-weight: 600; }
        .option-item .sub { font-size: 0.8rem; color: #8a8d91; margin-top: 2px; }
        .radio-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #4a4b4c; flex-shrink: 0; position: relative; transition: 0.2s; }
        .option-item.selected .radio-dot { border-color: #1877f2; }
        .option-item.selected .radio-dot::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: #1877f2; }
        .btn-save { width: 100%; padding: 12px; background: #1877f2; border: none; border-radius: 10px; color: white; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-save:hover:not(:disabled) { background: #166fe5; }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .custom-alert { position: fixed; top: 20px; right: 20px; left: 20px; padding: 12px 16px; border-radius: 12px; color: white; z-index: 9999; max-width: 440px; margin: 0 auto; font-size: 0.95rem; box-shadow: 0 8px 24px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 10px; }
        .custom-alert.success { background: #2e7d32; }
        .custom-alert.error { background: #c62828; }
        .custom-alert.info { background: #0d47a1; }
    </style>
</head>
<body>

    <div class="back-header">
        <a href="settings.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <div class="back-title">Privacy Controls</div>
    </div>

    <div class="main-container">
        <div class="section-title">Who can see your posts</div>
        <div class="option-card" id="privacyOptions">
            <div class="option-item" data-value="public">
                <div class="icon" style="background:#1877f2;"><i class="fas fa-globe"></i></div>
                <div class="text">
                    <div class="label">Public</div>
                    <div class="sub">Anyone can see your posts and profile</div>
                </div>
                <div class="radio-dot"></div>
            </div>
            <div class="option-item" data-value="followers">
                <div class="icon" style="background:#9c27b0;"><i class="fas fa-user-friends"></i></div>
                <div class="text">
                    <div class="label">Followers Only</div>
                    <div class="sub">Only people who follow you can see your posts</div>
                </div>
                <div class="radio-dot"></div>
            </div>
        </div>

        <button class="btn-save" id="saveBtn"><i class="fas fa-check"></i> Save Preference</button>
    </div>

    <script src="js/config.js"></script>
    <script>
        const userId = localStorage.getItem('userId');
        if (!userId) window.location.href = 'login.html';

        const optionsContainer = document.getElementById('privacyOptions');
        const saveBtn = document.getElementById('saveBtn');
        let selectedValue = 'public';

        function selectOption(value) {
            selectedValue = value;
            optionsContainer.querySelectorAll('.option-item').forEach(el => {
                el.classList.toggle('selected', el.dataset.value === value);
            });
        }

        optionsContainer.querySelectorAll('.option-item').forEach(el => {
            el.addEventListener('click', () => selectOption(el.dataset.value));
        });

        async function loadPrivacy() {
            const result = await window.apiRequest(`/users/${userId}`);
            if (result && result.success) {
                selectOption(result.data.privacy === 'followers' ? 'followers' : 'public');
            } else {
                selectOption('public');
            }
        }

        saveBtn.addEventListener('click', async () => {
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner"></span> Saving...';

            try {
                const result = await window.apiRequest(`/users/${userId}/privacy`, {
                    method: 'PUT',
                    body: JSON.stringify({ privacy: selectedValue })
                });

                if (result && result.success) {
                    showAlert('Privacy preference saved!', 'success');
                } 
            } catch (err) {
                showAlert('Something went wrong. Please try again.', 'error');
            }

            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="fas fa-check"></i> Save Preference';
        });

        loadPrivacy();
    </script>
</body>
</html>
