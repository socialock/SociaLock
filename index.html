<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SociaLock</title>
    <!-- ===== SEO ===== -->
    <meta name="description" content="SociaLock — the social network for developers and cybersecurity professionals." />
    <meta name="keywords" content="SociaLock" />
    <meta name="robots" content="noindex, follow" />
    <meta name="author" content="SociaLock" />
    <link rel="canonical" href="https://socialock.pages.dev/" />
    <meta name="theme-color" content="#1877f2" />
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icon-180.png" />
    <!-- ===== SEO END ===== -->
    <style>
        /* ===== Minimal style - no loading effect ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #18191a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e4e6eb;
            overflow: hidden;
        }

        .container {
            text-align: center;
            opacity: 0;
            animation: fadeIn 0.3s ease forwards;
        }

        .brand {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1877f2;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .brand small {
            font-size: 0.7rem;
            font-weight: 400;
            color: #b0b3b8;
            letter-spacing: 1px;
            display: block;
            margin-top: 4px;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #3a3b3c;
            border-top-color: #1877f2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 16px auto 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @media (max-width: 480px) {
            .brand { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            SociaLock
            <small>secure · social</small>
        </div>
        <div class="spinner"></div>
    </div>

    <script>
        // ============================================================
        // index.html - fast redirect (no loading shown)
        // ============================================================

        (function() {
            'use strict';

            var userId = localStorage.getItem('userId');

            // Very fast redirect - before content is visible
            if (userId) {
                window.location.replace('home.html');
            } else {
                window.location.replace('login.html');
            }
        })();
    </script>
</body>
</html>
