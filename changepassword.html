<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Change Password - SociaLock</title>
    <!-- ===== SEO ===== -->
    <meta name="description" content="Change your SociaLock account password." />
    <meta name="keywords" content="change password" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="author" content="SociaLock" />
    <link rel="canonical" href="https://socialock.pages.dev/changepassword.html" />
    <meta name="theme-color" content="#1877f2" />
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icon-180.png" />
    <!-- ===== SEO END ===== -->

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { background: #18191a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #e4e6eb; min-height: 100vh; }
        .back-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #3a3b3c; position: sticky; top: 0; background: #18191a; z-index: 5; }
        .back-header .back-btn { background: none; border: none; color: #b0b3b8; font-size: 22px; cursor: pointer; padding: 4px 8px; border-radius: 50%; transition: 0.2s; display: flex; }
        .back-header .back-btn:hover { background: #3a3b3c; color: #e4e6eb; }
        .back-header .back-title { font-size: 18px; font-weight: 600; }
        .main-container { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
        .info-banner { display: flex; gap: 10px; align-items: flex-start; background: rgba(24,119,242,0.1); border: 1px solid rgba(24,119,242,0.3); border-radius: 12px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.85rem; color: #b0b3b8; }
        .info-banner i { color: #1877f2; margin-top: 2px; }
        .form-card { background: #242526; border: 1px solid #3a3b3c; border-radius: 14px; padding: 20px 18px; }
        .form-group { margin-bottom: 16px; position: relative; }
        .form-group:last-child { margin-bottom: 0; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #b0b3b8; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 11px 40px 11px 14px; border-radius: 10px; border: 1px solid #3a3b3c; background: #18191a; color: #e4e6eb; font-size: 0.95rem; outline: none; }
        .form-group input:focus { border-color: #1877f2; }
        .toggle-eye { position: absolute; right: 12px; top: 38px; background: none; border: none; color: #8a8d91; cursor: pointer; font-size: 0.95rem; }
        .hint { font-size: 0.75rem; color: #8a8d91; margin-top: 4px; }
        .btn-save { width: 100%; margin-top: 22px; padding: 12px; background: #1877f2; border: none; border-radius: 10px; color: white; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-save:hover:not(:disabled) { background: #166fe5; }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .custom-alert { position: fixed; top: 20px; right: 20px; left: 20px; padding: 12px 16px; border-radius: 12px; color: white; z-index: 9999; max-width: 440px; margin: 0 auto; font-size: 0.95rem; box-shadow: 0 8px 24px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 10px; }
        .custom-alert.success { background: #2e7d32; }
        .custom-alert.error { background: #c62828; }
        .custom-alert.info { background: #0d47a1; }
    </style>
</head>
<body>

    <div class="back-header">
        <a href="settings.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <div class="back-title">Change Password</div>
    </div>

    <div class="main-container">
        <div class="info-banner">
            <i class="fas fa-circle-info"></i>
            <span>You'll need your current password to set a new one. Forgot it? <a href="resetpassword.html" style="color:#1877f2;">Reset it here</a> instead.</span>
        </div>

        <div class="form-card">
            <div class="form-group">
                <label for="oldPassword">Current Password</label>
                <input type="password" id="oldPassword" placeholder="Enter current password" autocomplete="current-password">
                <button type="button" class="toggle-eye" data-target="oldPassword"><i class="fas fa-eye"></i></button>
            </div>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="At least 6 characters" autocomplete="new-password">
                <button type="button" class="toggle-eye" data-target="newPassword"><i class="fas fa-eye"></i></button>
                <div class="hint">Minimum 6 characters</div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter new password" autocomplete="new-password">
                <button type="button" class="toggle-eye" data-target="confirmPassword"><i class="fas fa-eye"></i></button>
            </div>
        </div>

        <button class="btn-save" id="saveBtn"><i class="fas fa-lock"></i> Update Password</button>
    </div>

    <script src="js/config.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        const userId = localStorage.getItem('userId');
        if (!userId) window.location.href = 'login.html';

        document.querySelectorAll('.toggle-eye').forEach(btn => {
            btn.addEventListener('click', () => {
                const target = document.getElementById(btn.dataset.target);
                const icon = btn.querySelector('i');
                if (target.type === 'password') {
                    target.type = 'text';
                    icon.className = 'fas fa-eye-slash';
                } else {
                    target.type = 'password';
                    icon.className = 'fas fa-eye';
                }
            });
        });

        const saveBtn = document.getElementById('saveBtn');

        saveBtn.addEventListener('click', async () => {
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!oldPassword || !newPassword || !confirmPassword) {
                showAlert('Please fill in all fields.', 'error');
                return;
            }
            if (newPassword.length < 6) {
                showAlert('New password must be at least 6 characters.', 'error');
                return;
            }
            if (newPassword !== confirmPassword) {
                showAlert('New passwords do not match.', 'error');
                return;
            }
            if (newPassword === oldPassword) {
                showAlert('New password must be different from the current password.', 'error');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner"></span> Updating...';

            try {
                // 1. Update on the backend (D1) - verifies old password server-side.
                const result = await window.apiRequest('/auth/change-password', {
                    method: 'POST',
                    body: JSON.stringify({ oldPassword, newPassword })
                });

                if (!result || !result.success) {
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = '<i class="fas fa-lock"></i> Update Password';
                    return;
                }

                // 2. Also update the real Firebase Auth password (reauthenticate first).
                try {
                    const currentUser = firebase.auth().currentUser;
                    if (currentUser && currentUser.email) {
                        const credential = firebase.auth.EmailAuthProvider.credential(currentUser.email, oldPassword);
                        await currentUser.reauthenticateWithCredential(credential);
                        await currentUser.updatePassword(newPassword);
                    }
                } catch (fbErr) {
                    // Backend password already updated; surface a soft warning only.
                    console.warn('Firebase password sync failed:', fbErr);
                }

                showAlert('Password updated successfully!', 'success');
                setTimeout(() => { window.location.href = 'settings.html'; }, 1200);
            } catch (err) {
                showAlert('Something went wrong. Please try again.', 'error');
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fas fa-lock"></i> Update Password';
            }
        });
    </script>
</body>
</html>
