<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Home - SociaLock</title>
    
    <!-- ===== FIREBASE CDN ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ===== আপনার আগের CSS ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #18191a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #e4e6eb; overflow-x: hidden; padding-top: 0; }

        .navbar-top {
            background: #242526;
            padding: 6px 12px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid #3a3b3c;
            height: 48px;
            display: flex;
            align-items: center;
        }
        .nav-top-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 8px;
        }
        .nav-left { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .nav-brand { font-size: 1.3rem; font-weight: 700; color: #1877f2; cursor: pointer; display: flex; align-items: center; white-space: nowrap; }
        .menu-toggle-btn { background: none; border: none; font-size: 1.4rem; color: #b0b3b8; cursor: pointer; padding: 4px 8px; border-radius: 50%; transition: 0.2s; }
        .menu-toggle-btn:hover { background: #3a3b3c; }

        .nav-search { flex: 1; max-width: 600px; position: relative; margin: 0 12px; }
        .nav-search input { width: 100%; padding: 10px 16px 10px 44px; border-radius: 24px; border: 1px solid #3a3b3c; background: #3a3b3c; color: #e4e6eb; font-size: 16px; outline: none; cursor: pointer; height: 44px; }
        .nav-search input:focus { border-color: #1877f2; background: #2a2a2a; }
        .nav-search .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #b0b3b8; font-size: 16px; pointer-events: none; }

        .nav-right { display: flex; align-items: center; gap: 4px; }
        .user-menu-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; padding: 4px 8px; border-radius: 50%; color: #b0b3b8; transition: 0.2s; }
        .user-menu-btn:hover { background: #3a3b3c; }

        .navbar-bottom {
            background: #242526;
            padding: 4px 8px;
            position: fixed;
            top: 48px;
            width: 100%;
            z-index: 999;
            border-bottom: 1px solid #3a3b3c;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-bottom-container { max-width: 600px; margin: 0 auto; display: flex; justify-content: space-around; align-items: center; width: 100%; }
        .nav-icon-bottom {
            font-size: 1.7rem; text-decoration: none; color: #b0b3b8; padding: 4px 16px; border-radius: 8px;
            transition: 0.3s; position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px;
        }
        .nav-icon-bottom:hover { background: #3a3b3c; }
        .nav-icon-bottom.active { color: #1877f2; }
        .nav-icon-bottom.active::after { content: ''; position: absolute; bottom: -2px; left: 20%; right: 20%; height: 3px; background: #1877f2; border-radius: 2px; }
        .nav-icon-bottom .label { font-size: 0.6rem; font-weight: 500; color: #b0b3b8; }
        .nav-icon-bottom.active .label { color: #1877f2; }

        .notif-badge {
            position: absolute; top: -6px; right: -6px; background: #e94560; color: white;
            font-size: 10px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 50%;
            display: none; align-items: center; justify-content: center; padding: 0 5px;
            border: 2px solid #242526; line-height: 1; z-index: 5;
        }
        .notif-badge.show { display: flex; }

        .search-fullscreen {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #18191a;
            z-index: 9999;
            padding: 16px 20px;
            flex-direction: column;
        }
        .search-fullscreen.show { display: flex; }
        .search-fullscreen .header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .search-fullscreen .close-btn { background: none; border: none; font-size: 1.6rem; color: #b0b3b8; cursor: pointer; padding: 6px 10px; border-radius: 50%; transition: 0.2s; }
        .search-fullscreen .close-btn:hover { background: #3a3b3c; }
        .search-fullscreen input { flex: 1; padding: 14px 20px; border-radius: 24px; border: 1px solid #3a3b3c; background: #2a2a2a; color: #e4e6eb; font-size: 18px; outline: none; height: 48px; }
        .search-fullscreen input::placeholder { color: #888; }
        .search-fullscreen input:focus { border-color: #1877f2; }
        .search-fullscreen .results { flex: 1; overflow-y: auto; margin-top: 8px; }
        .search-fullscreen .result-item { display: flex; align-items: center; padding: 10px 12px; cursor: pointer; border-radius: 6px; transition: 0.2s; font-size: 14px; }
        .search-fullscreen .result-item:hover { background: #3a3b3c; }
        .search-fullscreen .result-avatar { width: 40px; height: 40px; border-radius: 50%; background: #1877f2; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px; flex-shrink: 0; margin-right: 12px; }
        .search-fullscreen .result-name { font-weight: 600; font-size: 15px; color: #e4e6eb; }
        .search-fullscreen .no-result { text-align: center; padding: 30px; color: #b0b3b8; font-size: 15px; }

        .sidemenu-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
        }
        .sidemenu-overlay.show { display: block; }
        .sidemenu {
            position: fixed;
            left: -280px;
            top: 0;
            width: 280px;
            height: 100%;
            background: #242526;
            z-index: 2001;
            transition: left 0.3s ease;
            box-shadow: 2px 0 12px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .sidemenu.open { left: 0; }
        .sidemenu-header {
            padding: 16px;
            border-bottom: 1px solid #3a3b3c;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            margin-top: 48px;
        }
        .sidemenu-header:hover { background: #3a3b3c; }
        .sidemenu-header .avatar { width: 44px; height: 44px; border-radius: 50%; background: #1877f2; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; flex-shrink: 0; }
        .sidemenu-header .user-name { font-weight: 700; font-size: 15px; color: #e4e6eb; }
        .sidemenu-header .user-email { font-size: 12px; color: #b0b3b8; }
        .sidemenu-body { flex: 1; padding: 6px 0; }
        .sidemenu-body .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 15px;
            color: #e4e6eb;
            text-decoration: none;
        }
        .sidemenu-body .menu-item:hover { background: #3a3b3c; }
        .sidemenu-body .menu-item .icon { font-size: 20px; width: 28px; text-align: center; color: #b0b3b8; }
        .sidemenu-body .menu-divider { height: 1px; background: #3a3b3c; margin: 6px 14px; }
        .sidemenu-body .menu-item.danger { color: #e94560; }
        .sidemenu-body .menu-item.danger .icon { color: #e94560; }
        .sidemenu-footer { padding: 10px 14px; border-top: 1px solid #3a3b3c; font-size: 11px; color: #b0b3b8; text-align: center; }

        .main-container { max-width: 680px; margin: 94px auto 16px; padding: 0 12px; }
        .create-post {
            background: #242526;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: 0.3s;
        }
        .create-post:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .create-post-header { display: flex; align-items: center; gap: 10px; }
        .create-post-avatar { width: 40px; height: 40px; border-radius: 50%; background: #1877f2; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px; flex-shrink: 0; }
        .create-post-input { flex: 1; padding: 8px 14px; background: #3a3b3c; border-radius: 18px; border: none; font-size: 14px; color: #e4e6eb; cursor: pointer; }

        .post-card {
            background: #242526;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #3a3b3c;
            animation: fadeIn 0.3s ease;
        }
        .post-card:hover { border-color: #4a4b4c; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .post-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .post-user { display: flex; align-items: center; gap: 10px; flex: 1; }
        .post-avatar { width: 40px; height: 40px; border-radius: 50%; background: #1877f2; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px; flex-shrink: 0; cursor: pointer; }
        .post-username { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 4px; color: #e4e6eb; }
        .post-username .verified-badge { color: #1877f2; font-size: 16px; }
        .post-time { font-size: 12px; color: #b0b3b8; }
        .post-more-btn { background: none; border: none; font-size: 20px; color: #b0b3b8; cursor: pointer; padding: 4px 6px; border-radius: 50%; transition: 0.2s; position: relative; }
        .post-more-btn:hover { background: #3a3b3c; }
        .post-more-menu {
            display: none;
            position: absolute;
            right: 0; top: 28px;
            background: #242526;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
            min-width: 150px;
            z-index: 100;
            border: 1px solid #3a3b3c;
        }
        .post-more-menu.show { display: block; }
        .post-more-menu a {
            display: block;
            padding: 8px 14px;
            color: #e4e6eb;
            text-decoration: none;
            transition: 0.2s;
            cursor: pointer;
            font-size: 14px;
        }
        .post-more-menu a:hover { background: #3a3b3c; }
        .post-more-menu .danger { color: #e94560; }

        .post-content { font-size: 15px; line-height: 1.5; margin-bottom: 10px; word-wrap: break-word; white-space: pre-wrap; color: #e4e6eb; }
        .post-content a { color: #1877f2; text-decoration: none; font-weight: 500; }
        .post-content a:hover { text-decoration: underline; }

        .post-stats { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-top: 1px solid #3a3b3c; border-bottom: 1px solid #3a3b3c; margin-bottom: 6px; font-size: 14px; }
        .post-stats span { color: #b0b3b8; }

        .post-actions { display: flex; gap: 6px; padding: 4px 0; }
        .post-action-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px;
            border: none;
            background: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #b0b3b8;
            transition: 0.2s;
        }
        .post-action-btn:hover { background: #3a3b3c; }
        .post-action-btn.liked { color: #e94560; }
        .post-action-btn svg { width: 20px; height: 20px; }

        .post-follow-btn {
            background: none; border: none; color: #1877f2; font-size: 13px; font-weight: 700; cursor: pointer; padding: 3px 10px; border-radius: 16px; transition: 0.2s; background: rgba(24,119,242,0.1); margin-left: 6px;
        }
        .post-follow-btn:hover { background: rgba(24,119,242,0.2); }
        .post-follow-btn.following { color: #b0b3b8; background: rgba(176,179,184,0.1); }
        .post-follow-btn.following:hover { color: #e94560; background: rgba(233,69,96,0.15); }

        .ad-card {
            background: linear-gradient(135deg, #1a1a4e, #2a2a6e);
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .ad-card a { text-decoration: none; color: white; display: block; }
        .ad-card img { max-width: 100%; border-radius: 6px; margin-bottom: 6px; max-height: 180px; object-fit: cover; }
        .ad-caption { font-size: 14px; color: white; font-weight: 500; }
        .ad-sponsored { font-size: 10px; color: rgba(255,255,255,0.6); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }

        .loading-spinner { text-align: center; padding: 20px; color: #b0b3b8; font-size: 14px; }
        .no-posts { text-align: center; padding: 30px; color: #b0b3b8; font-size: 14px; }

        /* ===== কাস্টম এলার্ট ===== */
        .custom-alert {
            position: fixed;
            top: 100px;
            right: 10px; left: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            color: white;
            z-index: 10000;
            max-width: 400px;
            margin: 0 auto;
            animation: slideIn 0.3s ease;
            font-size: 14px;
        }
        .custom-alert.success { background: #4caf50; }
        .custom-alert.error { background: #e94560; }
        .custom-alert.info { background: #1877f2; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ===== কাস্টম কনফর্ম মডাল ===== */
        .custom-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        .custom-modal-overlay.show { display: flex; }
        .custom-modal {
            background: #242526;
            border-radius: 16px;
            padding: 28px 24px 20px;
            max-width: 380px;
            width: 90%;
            border: 1px solid #3a3b3c;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        .custom-modal .modal-icon {
            font-size: 2.8rem;
            color: #e94560;
            margin-bottom: 8px;
        }
        .custom-modal h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #e4e6eb;
        }
        .custom-modal p {
            font-size: 0.95rem;
            color: #b0b3b8;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .custom-modal .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .custom-modal .modal-actions button {
            padding: 8px 24px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .custom-modal .modal-actions .btn-cancel {
            background: #3a3b3c;
            color: #b0b3b8;
        }
        .custom-modal .modal-actions .btn-cancel:hover { background: #4a4b4c; }
        .custom-modal .modal-actions .btn-danger {
            background: #e94560;
            color: white;
        }
        .custom-modal .modal-actions .btn-danger:hover { background: #c62828; }

        @media (max-width: 480px) {
            .navbar-top { height: 42px; padding: 4px 8px; }
            .navbar-bottom { height: 42px; top: 42px; }
            .nav-brand { font-size: 0.95rem; }
            .nav-search { max-width: 180px; }
            .nav-search input { font-size: 13px; padding: 6px 10px 6px 34px; height: 34px; }
            .nav-search .search-icon { font-size: 13px; left: 12px; }
            .nav-icon-bottom { font-size: 1.3rem; padding: 2px 8px; }
            .nav-icon-bottom .label { font-size: 0.5rem; }
            .sidemenu { width: 240px; left: -240px; }
            .sidemenu-header { margin-top: 42px; }
            .main-container { margin: 92px auto 12px; padding: 0 8px; }
            .post-action-btn { font-size: 13px; padding: 6px; }
            .post-action-btn svg { width: 18px; height: 18px; }
            .post-card { padding: 12px; }
            .post-avatar { width: 36px; height: 36px; font-size: 14px; }
            .post-username { font-size: 14px; }
            .create-post-avatar { width: 36px; height: 36px; font-size: 14px; }
            .create-post-input { font-size: 13px; padding: 6px 12px; }
            .search-fullscreen input { font-size: 16px; padding: 12px 16px; height: 44px; }
            .ad-card img { max-height: 120px; }
            .custom-alert { top: 90px; }
            .post-follow-btn { font-size: 12px; padding: 2px 8px; }
            .custom-modal { padding: 20px 16px; }
        }
    </style>
</head>

<body>
    <!-- NAVBAR TOP -->
    <nav class="navbar-top">
        <div class="nav-top-container">
            <div class="nav-left">
                <button class="menu-toggle-btn" id="menuToggleBtn"><i class="fas fa-bars"></i></button>
                <div class="nav-brand">SociaLock</div>
            </div>
            <div class="nav-search">
                <span class="search-icon"><i class="fas fa-search"></i></span>
                <input type="text" id="searchInput" placeholder="Search users..." autocomplete="off" readonly>
            </div>
            <div class="nav-right">
                <button class="user-menu-btn" id="userMenuBtn"><i class="fas fa-user-circle"></i></button>
            </div>
        </div>
    </nav>

    <!-- NAVBAR BOTTOM -->
    <nav class="navbar-bottom">
        <div class="nav-bottom-container">
            <a href="home.html" class="nav-icon-bottom active" onclick="event.preventDefault(); window.refreshHomeFeed();"><i class="fas fa-home"></i><span class="label">Home</span></a>
            <a href="messages.html" class="nav-icon-bottom"><i class="fas fa-comment-dots"></i><span class="label">Messages</span></a>
            <a href="tools.html" class="nav-icon-bottom"><i class="fas fa-tools"></i><span class="label">Tools</span></a>
            <a href="notifications.html" class="nav-icon-bottom"><i class="fas fa-bell"></i><span class="label">Notifications</span><span class="notif-badge" id="notifBadge">0</span></a>
            <a href="#" class="nav-icon-bottom" id="profileNavBtn"><i class="fas fa-user-circle"></i><span class="label">Profile</span></a>
        </div>
    </nav>

    <!-- SEARCH FULLSCREEN -->
    <div class="search-fullscreen" id="searchFullscreen">
        <div class="header">
            <button class="close-btn" id="searchCloseBtn"><i class="fas fa-arrow-left"></i></button>
            <input type="text" id="searchFullscreenInput" placeholder="Search users..." autocomplete="off">
        </div>
        <div class="results" id="searchFullscreenResults"></div>
    </div>

    <!-- SIDEMENU -->
    <div class="sidemenu-overlay" id="sidemenuOverlay"></div>
    <div class="sidemenu" id="sidemenu">
        <div class="sidemenu-header" id="sidemenuProfileBtn">
            <div class="avatar" id="sideMenuAvatar">U</div>
            <div class="user-info">
                <div class="user-name" id="sideMenuName">User</div>
                <div class="user-email" id="sideMenuEmail">user@email.com</div>
            </div>
        </div>
        <div class="sidemenu-body">
            <a href="tools.html" class="menu-item"><span class="icon"><i class="fas fa-tools"></i></span> Tools</a>
            <a href="settings.html" class="menu-item" id="sideMenuSettings"><span class="icon"><i class="fas fa-cog"></i></span> Settings</a>
            <a href="contact.html" class="menu-item" id="sideMenuContact"><span class="icon"><i class="fas fa-envelope"></i></span> Contact</a>
            <a href="help.html" class="menu-item" id="sideMenuHelp"><span class="icon"><i class="fas fa-question-circle"></i></span> Help & Support</a>
            <div class="menu-divider"></div>
            <a href="#" class="menu-item danger" id="sideMenuLogout"><span class="icon"><i class="fas fa-sign-out-alt"></i></span> Logout</a>
        </div>
        <div class="sidemenu-footer"><i class="fas fa-comment-dots"></i> SociaLock v1.0</div>
    </div>

    <!-- ===== কাস্টম কনফর্ম মডাল ===== -->
    <div class="custom-modal-overlay" id="customModal">
        <div class="custom-modal">
            <div class="modal-icon" id="modalIcon">⚠️</div>
            <h3 id="modalTitle">Are you sure?</h3>
            <p id="modalMessage">This action cannot be undone.</p>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">Cancel</button>
                <button class="btn-danger" id="modalConfirm">OK</button>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-container">
        <div class="create-post" onclick="window.location.href='createpost.html'">
            <div class="create-post-header">
                <div class="create-post-avatar" id="createPostAvatar">U</div>
                <div class="create-post-input">What's on your mind?</div>
            </div>
        </div>
        <div id="postsContainer"><div class="loading-spinner">⏳ Loading posts...</div></div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="js/config.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        // ============================================================
        // HOME.JS - COMPLETE FIXED (কাস্টম কনফর্ম + অ্যাড ফিল্টার)
        // ============================================================


        let currentUser = null;
        let allPosts = [];
        let currentDisplayPosts = [];
        let currentPage = 0;
        let isLoading = false;
        let hasMorePosts = true;
        const POSTS_PER_PAGE = 30;
        const ADS_INTERVAL = 4;
        let blockedUsers = [];
        let followingUsers = [];
        let verifiedUsers = [];
        let userLikedPosts = {};

        // ===== কাস্টম কনফর্ম =====

        });

            document.getElementById('customModal').classList.remove('show');
            if (pendingResolve) { pendingResolve(true);
                pendingResolve = null; }
        });

        document.getElementById('customModal').addEventListener('click', function(e) {

        // ============================================================
        // UTILITY FUNCTIONS
        // ============================================================
        function shuffleArray(array) {
            if (!Array.isArray(array)) return [];
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function timeAgo(date) {
            if (!date) return 'Just now';
            try {
                const now = new Date();
                const past = new Date(date);
                const diffInSeconds = Math.floor((now - past) / 1000);
                if (diffInSeconds < 5) return 'Just now';
                if (diffInSeconds < 60) return diffInSeconds + 's ago';
                const minutes = Math.floor(diffInSeconds / 60);
                if (minutes < 60) return minutes + 'm ago';
                const hours = Math.floor(minutes / 60);
                if (hours < 24) return hours + 'h ago';
                const days = Math.floor(hours / 24);
                if (days < 7) return days + 'd ago';
                const weeks = Math.floor(days / 7);
                if (weeks < 4) return weeks + 'w ago';
                const months = Math.floor(days / 30);
                if (months < 12) return months + 'mo ago';
                const years = Math.floor(days / 365);
                return years + 'y ago';
            } catch (e) {
                return 'Just now';
            }
        }

        // ============================================================
        // LOAD POSTS
        // ============================================================
        async function loadPosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '<div class="loading-spinner">⏳ Loading posts...</div>';

            try {
                await getBlockedUsers();
                await getFollowingUsers();
                await getVerifiedUsers();

                userLikedPosts = {};

                const result = await window.apiRequest('/posts');

                if (!result || !result.success) {
                    container.innerHTML = '<div class="no-posts">❌ Failed to load posts</div>';
                    return;
                }

                let posts = result.data || [];

                if (posts.length === 0) {
                    container.innerHTML = '<div class="no-posts">📝 No posts yet. Create one!</div>';
                    return;
                }

                posts = posts.filter(p => !isUserBlocked(p.user_id));

                for (const post of posts) {
                    post.user_liked = await checkUserLiked(post.id);
                }

                const categorizedPosts = categorizeAndMixPosts(posts);
                allPosts = categorizedPosts;
                currentPage = 1;
                hasMorePosts = categorizedPosts.length === 50;

                if (allPosts.length === 0) {
                    container.innerHTML = '<div class="no-posts">📝 No posts to show.</div>';
                    return;
                }

                container.innerHTML = '';
                await displayPostsWithAds(allPosts.slice(0, POSTS_PER_PAGE));
                saveHomeCache();

            } catch (error) {
                container.innerHTML = '<div class="no-posts">❌ Failed to load posts: ' + error.message + '</div>';
            }
        }

        function categorizeAndMixPosts(posts) {
            if (!Array.isArray(posts)) return [];

            const verifiedPosts = [];
            const followingPosts = [];
            const normalPosts = [];
            const interactedPosts = [];

            for (const post of posts) {
                if (isUserBlocked(post.user_id)) continue;

                if (post.user_liked || post.user_interacted) {
                    interactedPosts.push(post);
                    continue;
                }

                if (isVerified(post.user_id)) {
                    verifiedPosts.push(post);
                } else if (isFollowing(post.user_id)) {
                    followingPosts.push(post);
                } else {
                    normalPosts.push(post);
                }
            }

            const shuffledVerified = shuffleArray(verifiedPosts);
            const shuffledFollowing = shuffleArray(followingPosts);
            const shuffledNormal = shuffleArray(normalPosts);

            const total = shuffledVerified.length + shuffledFollowing.length + shuffledNormal.length;
            if (total === 0) return [...interactedPosts];

            const targetVerified = Math.round(total * 0.3);
            const targetFollowing = Math.round(total * 0.3);
            const targetNormal = total - targetVerified - targetFollowing;

            const selectedVerified = shuffledVerified.slice(0, targetVerified);
            const selectedFollowing = shuffledFollowing.slice(0, targetFollowing);
            const selectedNormal = shuffledNormal.slice(0, targetNormal);

            let mixed = [...selectedVerified, ...selectedFollowing, ...selectedNormal];
            mixed = shuffleArray(mixed);

            return [...mixed, ...interactedPosts];
        }

        async function loadMorePosts() {
            if (isLoading || !hasMorePosts) return;
            isLoading = true;

            const start = currentPage * POSTS_PER_PAGE;
            const newPosts = allPosts.slice(start, start + POSTS_PER_PAGE);

            if (newPosts.length > 0) {
                currentDisplayPosts = [...currentDisplayPosts, ...newPosts];
                currentPage++;
                await displayPostsWithAds(currentDisplayPosts);
                saveHomeCache();
            } else {
                hasMorePosts = false;
            }

            isLoading = false;
        }

                container.innerHTML = '<div class="no-posts">📝 No posts to show.</div>';

            const existingPosts = container.querySelectorAll('.post-card').length;

            for (let i = 0; i < posts.length; i++) {
                const post = posts[i];
                const postElement = await createPostElement(post);
                container.appendChild(postElement);

                const currentPostIndex = existingPosts + i;
                if ((currentPostIndex + 1) % ADS_INTERVAL === 0 && currentPostIndex + 1 < posts.length) {
                    const ad = await getRandomAd();
                    if (ad) {
                        const adElement = createAdElement(ad);
                        if (adElement) container.appendChild(adElement);
                    }
                }
            }
        }

        // ============================================================
        // TOGGLE LIKE - FIXED (লাইক করলে নোটিফিকেশন যাবে)
        // ============================================================
        window.toggleLike = async function(postId, btnElement) {
            if (!currentUser) {
                showAlert('Please login first!', 'error');
                return;
            }

            if (!btnElement) {
                btnElement = document.querySelector(`.post-action-btn[onclick*="toggleLike('${postId}')"]`);
            }
            if (!btnElement) return;

            const isLiked = btnElement.classList.contains('liked');
            const likeCountSpan = document.getElementById('likeCount-' + postId);
            if (!likeCountSpan) return;

            let currentCount = parseInt(likeCountSpan.textContent) || 0;

            try {
                if (isLiked) {
                    // UNLIKE
                    const result = await window.apiRequest(`/posts/${postId}/like`, {
                        method: 'DELETE',
                        body: JSON.stringify({ 
                            user_id: currentUser.id 
                        })
                    });

                    if (result && result.success) {
                        btnElement.classList.remove('liked');
                        const newCount = Math.max(0, currentCount - 1);
                        likeCountSpan.textContent = newCount;
                        userLikedPosts[postId] = false;
                        const post = allPosts.find(p => p.id === postId);
                        if (post) {
                            post.likes_count = newCount;
                            post.user_liked = false;
                        }
                        saveHomeCache();
                    } else {
                        showAlert('Failed to unlike!', 'error');
                    }
                } else {
                    // ✅ LIKE (নোটিফিকেশন যাবে)
                    const result = await window.apiRequest(`/posts/${postId}/like`, {
                        method: 'POST',
                        body: JSON.stringify({ 
                            user_id: currentUser.id,
                            username: currentUser.username  // ← Actor username for notification
                        })
                    });

                    if (result && result.success) {
                        btnElement.classList.add('liked');
                        const newCount = currentCount + 1;
                        likeCountSpan.textContent = newCount;
                        userLikedPosts[postId] = true;
                        const post = allPosts.find(p => p.id === postId);
                        if (post) {
                            post.likes_count = newCount;
                            post.user_liked = true;
                        }
                        saveHomeCache();
                    } else if (result && result.error === 'Already liked') {
                        btnElement.classList.add('liked');
                        showAlert('You already liked this post!', 'info');
                    } else {
                        showAlert('Failed to like!', 'error');
                    }
                }
            } catch (error) {
                showAlert('Something went wrong!', 'error');
            }
        };

            const ok = await customConfirm('Delete Post', 'Are you sure you want to delete this post? This action cannot be undone.', '🗑️');

            try {
                const result = await window.apiRequest(`/posts/${postId}`, {

                localStorage.removeItem('userId');
                localStorage.removeItem('cachedUser');
                window.location.href = 'login.html';
                return;
            }


            // ===== Restore feed from local cache instead of reloading =====
            let restoredFromCache = false;
            const cachedFeed = sessionStorage.getItem(HOME_CACHE_KEY);
            if (cachedFeed) {
                try {
                    const cache = JSON.parse(cachedFeed);
                    if (cache && cache.html) {
                        document.getElementById('postsContainer').innerHTML = cache.html;
                        allPosts = cache.allPosts || [];
                        currentPage = cache.currentPage || 1;
                        hasMorePosts = cache.hasMorePosts !== undefined ? cache.hasMorePosts : true;
                        userLikedPosts = cache.userLikedPosts || {};
                        restoredFromCache = true;
                    }
                } catch (e) {
                }
            }

            if (restoredFromCache) {
                // Refresh blocked/following/verified lists quietly in the background
                // (used for future like/follow actions) without touching the displayed feed
                getBlockedUsers();
                getFollowingUsers();
                getVerifiedUsers();
                restoreHomeScrollPosition();
            } else {
                await loadPosts();
            }

            await updateNotifBadge();

            // Side menu
            document.getElementById('menuToggleBtn').addEventListener('click', () => {
                document.getElementById('sidemenu').classList.add('open');
                document.getElementById('sidemenuOverlay').classList.add('show');
            });

            document.getElementById('sidemenuOverlay').addEventListener('click', () => {
                document.getElementById('sidemenu').classList.remove('open');
                document.getElementById('sidemenuOverlay').classList.remove('show');
            });

            document.getElementById('sidemenuProfileBtn').addEventListener('click', () => {
                window.location.href = 'userprofile.html?userId=' + userId;
            });

            document.getElementById('profileNavBtn').addEventListener('click', (e) => {
                e.preventDefault();
                window.location.href = 'userprofile.html?userId=' + userId;
            });

            document.getElementById('sideMenuLogout').addEventListener('click', async () => {
                await window.signOutUser();
                localStorage.removeItem('userId');
                localStorage.removeItem('cachedUser');
                window.location.href = 'login.html';
            });

            let scrollSaveTimeout = null;
            window.addEventListener('scroll', async function() {
                if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
                    if (!isLoading && hasMorePosts) {
                        await loadMorePosts();
                    }
                }
                // Continuously remember scroll position so a later back-navigation
                // can return to exactly where the user was
                if (scrollSaveTimeout) clearTimeout(scrollSaveTimeout);
                scrollSaveTimeout = setTimeout(saveHomeScrollPosition, 150);
            }, { passive: true });

            // Save scroll position right before the page is navigated away from
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'hidden') saveHomeScrollPosition();
            });
            window.addEventListener('pagehide', saveHomeScrollPosition);

            // Search
            const searchInput = document.getElementById('searchInput');
            const searchFullscreen = document.getElementById('searchFullscreen');
            const searchFullscreenInput = document.getElementById('searchFullscreenInput');
            const searchResults = document.getElementById('searchFullscreenResults');
            const searchCloseBtn = document.getElementById('searchCloseBtn');

            if (searchInput) {
                searchInput.addEventListener('click', () => {
                    searchFullscreen.classList.add('show');
                    setTimeout(() => searchFullscreenInput.focus(), 100);
                });
            }

            if (searchCloseBtn) {
                searchCloseBtn.addEventListener('click', () => {
                    searchFullscreen.classList.remove('show');
                });
            }

            if (searchFullscreenInput) {
                let timeout;
                searchFullscreenInput.addEventListener('input', function() {
                    clearTimeout(timeout);
                    const query = this.value.trim();
                    if (query.length < 2) {
                        searchResults.innerHTML = '';
                        return;
                    }
                    timeout = setTimeout(async () => {
                        const users = await searchUsers(query);
                        if (users.length === 0) {
                            searchResults.innerHTML = '<div class="no-result">🔍 No users found</div>';
                        } else {
                            searchResults.innerHTML = users.map(user => `
                                <div class="result-item" onclick="window.location.href='userprofile.html?userId=${user.id}'">
                                    <div class="result-avatar">${user.username.charAt(0).toUpperCase()}</div>
                                    <div class="result-name">${escapeHtml(user.username)}</div>
                                </div>
                            `).join('');
                        }
                    }, 300);
                });
            }

            setInterval(updateNotifBadge, 30000);

        });

        // Make functions global
        window.toggleLike = toggleLike;
        window.deletePost = deletePost;
        window.togglePostMenu = togglePostMenu;
        window.copyPostLink = copyPostLink;
        window.reportPost = reportPost;
        window.toggleFollowFromPost = toggleFollowFromPost;

    </script>
</body>
</html>
