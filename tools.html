    <script>
        // ===== কাস্টম কনফার্ম =====
        let pendingConfirmResolve = null;
        function customConfirm(title, message, icon = '⚠️') {
            return new Promise(function(resolve) {
                document.getElementById('modalIcon').textContent = icon;
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalMessage').textContent = message;
                document.getElementById('customModal').classList.add('show');
                pendingConfirmResolve = resolve;
            });
        }
        document.getElementById('modalCancel').addEventListener('click', function() {
            document.getElementById('customModal').classList.remove('show');
            if (pendingConfirmResolve) { pendingConfirmResolve(false); pendingConfirmResolve = null; }
        });
        document.getElementById('modalConfirm').addEventListener('click', function() {
            document.getElementById('customModal').classList.remove('show');
            if (pendingConfirmResolve) { pendingConfirmResolve(true); pendingConfirmResolve = null; }
        });
        document.getElementById('customModal').addEventListener('click', function(e) {
            if (e.target === this) {
                document.getElementById('customModal').classList.remove('show');
                if (pendingConfirmResolve) { pendingConfirmResolve(false); pendingConfirmResolve = null; }
            }
        });


        // ============================================================
        // TOOLS.JS - COMPLETE (FIXED)

        let currentUser = null;

        let myTools = [];

        let hasMoreTools = true;
        let filteredTools = [];
        let allToolsAds = [];

        const toolsListEl = document.getElementById('toolsList');
        const myToolsListEl = document.getElementById('myToolsList');
        const myToolsSection = document.getElementById('myToolsSection');
        const searchInput = document.getElementById('searchToolsInput');
        const filterBar = document.getElementById('filterBar');

        const closeAddModalBtn = document.getElementById('closeAddModalBtn');

        // ============================================================
        // API REQUEST
        // ============================================================
        async function apiRequest(endpoint, options = {}) {
            const url = `${window.API_BASE_URL}${endpoint}`;
            const userId = localStorage.getItem('userId');
            const headers = { 'Content-Type': 'application/json', ...options.headers };
            if (userId) headers['Authorization'] = `Bearer ${userId}`;
            try {
                const response = await fetch(url, { ...options, headers });
                const data = await response.json();
                if (!response.ok) {
                    return null;
                }
                return data;
            } catch (error) {
                return null;
            }
        }

        function showAlert(message, type = 'info') {
            const existing = document.querySelector('.custom-alert');
            if (existing) existing.remove();
            const alert = document.createElement('div');
            alert.className = `custom-alert ${type}`;
            alert.innerHTML = message + '<button onclick="this.parentElement.remove()" style="background:none;border:none;color:white;margin-left:10px;cursor:pointer;font-size:18px;">✕</button>';
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 4000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function shuffleArray(array) {
            if (!Array.isArray(array)) return [];
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // ============================================================
        // NOTIFICATION BADGE
        // ============================================================
        async function updateNotifBadge() {
            const badge = document.getElementById('notifBadge');
            if (!badge) return;

            const userId = localStorage.getItem('userId');
            if (!userId) {
                badge.classList.remove('show');
                return;
            }

            try {
                const result = await apiRequest(`/notifications?userId=${userId}`);
                if (result && result.success) {
                    const unread = (result.data || []).filter(n => !n.is_read).length;
                    if (unread > 0) {
                        badge.textContent = unread > 9 ? '9+' : unread;
                        badge.classList.add('show');
                    } else {
                        badge.classList.remove('show');
                    }
                }
            } catch (err) {
                badge.classList.remove('show');
            }
        }

        async function fetchToolsAds(country) {
            try {
                const result = await apiRequest(`/tools_ads?country=${country}`);
                if (result && result.success) return result.data || [];
            } catch (err) { }
            return [];
        }

        async function fetchTools() {
            try {
                const result = await apiRequest('/tools');
                if (result && result.success) return result.data || [];
            } catch (err) { }
            return [];
        }

        async function fetchMyTools(userId) {
            if (!userId) return [];
            try {
                const result = await apiRequest(`/users/${userId}/tools`);
                if (result && result.success && Array.isArray(result.data)) {
                    return result.data;
                }
                return [];
            } catch (err) {
                return [];
            }
        }

        async function publishTool(name, type, link) {
            if (!currentUser) return false;
            try {
                // Check if tool with same name exists
                const existing = allTools.find(t => t.name.toLowerCase() === name.toLowerCase());
                if (existing) {
                    showAlert('❌ A tool with this name already exists!', 'error');
                    return false;
                }

                const result = await apiRequest('/tools', {
                    method: 'POST',
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        name: name.trim(),
                        type: type,
                        link: link.trim()
                    })
                });
                if (result && result.success) return true;
                if (result && result.errors) {
                    showAlert(result.errors.join(', '), 'error');
                }
            } catch (err) {
                showAlert('Failed to publish tool!', 'error');
            }
            return false;
        }

        async function deleteTool(toolId) {
            if (!currentUser) return false;
            try {
                const result = await apiRequest(`/tools/${toolId}`, {
                    method: 'DELETE',
                    body: JSON.stringify({ user_id: currentUser.id })
                });
                if (result && result.success) return true;
            } catch (err) {
                showAlert('Failed to delete tool!', 'error');
            }
            return false;
        }

        // ============================================================
        // SHARE FUNCTION
        // ============================================================
        function getToolShareUrl(toolId) {
            const baseUrl = window.location.origin + window.location.pathname.replace('tools.html', '');
            return `${baseUrl}tool.html?id=${toolId}`;
        }

        async function shareTool(toolId, event) {
            if (event) event.stopPropagation();

            const tool = allTools.find(t => t.id === toolId) || myTools.find(t => t.id === toolId);
            if (!tool) {
                showAlert('Tool not found!', 'error');
                return;
            }

            const shareUrl = getToolShareUrl(toolId);
            const shareData = {
                title: tool.name,
                text: `🔧 ${tool.name} - ${tool.type}`,
                url: shareUrl
            };

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                    return;
                } catch (err) { if (err.name === 'AbortError') return; }
            }

            try {
                await navigator.clipboard.writeText(shareUrl);
                showAlert('✅ Link copied to clipboard!', 'success');
            } catch (err) {
                prompt('Copy this link:', shareUrl);
            }
        }

        // ============================================================
        // RENDER FUNCTIONS
        // ============================================================
        function renderTools(tools, container, showDelete = false, append = false, isMyTools = false) {
            if (!append) container.innerHTML = '';
            if (!tools || tools.length === 0) {
                if (!append) {
                    container.innerHTML = isMyTools ?
                        '<div class="no-tools">You haven\'t published any tools yet</div>' :
                        '<div class="no-tools">🔧 No tools found</div>';
                }
                return;
            }

            tools.forEach((tool, index) => {
                const item = document.createElement('div');
                item.className = 'tool-item';
                item.setAttribute('data-id', tool.id);

                let domain = '';
                try { if (tool.link) domain = new URL(tool.link).hostname; } catch (e) {}

                item.innerHTML = `
                    <div class="tool-info">
                        <div class="tool-name">${escapeHtml(tool.name)}</div>
                        <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
                            <span class="tool-type">${escapeHtml(tool.type)}</span>
                            ${domain ? `<span style="font-size:0.6rem; color:#b0b3b8;">${escapeHtml(domain)}</span>` : ''}
                        </div>
                    </div>
                    <div class="tool-actions">
                        <button class="tool-share-btn" onclick="shareTool('${tool.id}', event)" title="Share">
                            <i class="fas fa-share-alt"></i>
                        </button>
                        ${showDelete ? `<button class="tool-delete-btn" data-id="${tool.id}" title="Delete">🗑️</button>` : ''}
                    </div>
                `;

                item.addEventListener('click', (e) => {
                    if (e.target.closest('.tool-share-btn') || e.target.closest('.tool-delete-btn')) return;
                    if (tool.link) window.open(tool.link, '_blank');
                    else showAlert('No link available!', 'error');
                });

                const deleteBtn = item.querySelector('.tool-delete-btn');
                if (deleteBtn) {
                    deleteBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const id = deleteBtn.getAttribute('data-id');
                        if (await customConfirm('Delete Tool', 'Delete this tool? This cannot be undone.', '🗑️')) {
                            const success = await deleteTool(id);
                            if (success) {
                                showAlert('✅ Tool deleted!', 'success');
                                await refreshAll();
                            }
                        }
                    });
                }

                container.appendChild(item);

                if (!showDelete && !isMyTools && Math.random() < 0.15 && index < tools.length - 1) {
                    const ad = getRandomToolsAd();
                    if (ad) {
                        const adDiv = createToolsAdElement(ad);
                        container.appendChild(adDiv);
                    }
                }
            });
        }

        function getRandomToolsAd() {
            if (!allToolsAds || allToolsAds.length === 0) return null;
            return allToolsAds[Math.floor(Math.random() * allToolsAds.length)];
        }

        function createToolsAdElement(ad) {
            if (!ad) return null;
            const adDiv = document.createElement('div');
            adDiv.className = 'tools-ad-card';
            const imgHtml = ad.image_url ?
                `<img src="${escapeHtml(ad.image_url)}" alt="${escapeHtml(ad.caption)}" loading="lazy" onerror="this.style.display='none'">` :
                '<span class="ad-emoji">📢</span>';
            adDiv.innerHTML = `
                <a href="${escapeHtml(ad.link || '#')}" target="_blank" rel="noopener noreferrer">
                    ${imgHtml}
                    <span class="ad-caption">${escapeHtml(ad.caption || 'Advertisement')}</span>
                </a>
            `;
            return adDiv;
        }

        async function loadToolsAdsRandomly() {
            try {
                const country = currentUser?.country || 'Bangladesh';
                allToolsAds = await fetchToolsAds(country);
            } catch (err) { }
        }

        // ============================================================
        // PAGINATION
        // ============================================================
        function loadMoreTools() {
            if (isLoading || !hasMoreTools) return;
            const start = currentPage * TOOLS_PER_PAGE;
            const end = start + TOOLS_PER_PAGE;
            const nextBatch = filteredTools.slice(start, end);
            if (nextBatch.length === 0) {
                hasMoreTools = false;
                seeMoreBtn.textContent = 'No more tools';
                seeMoreBtn.disabled = true;
                return;
            }
            renderTools(nextBatch, toolsListEl, false, true, false);
            currentPage++;
            if (end >= filteredTools.length) {
                hasMoreTools = false;
                seeMoreBtn.textContent = 'No more tools';
                seeMoreBtn.disabled = true;
            } else {
                seeMoreBtn.textContent = `See More ↓ (${filteredTools.length - end} remaining)`;
                seeMoreBtn.disabled = false;
            }
        }

        // ============================================================
        // REFRESH & FILTER
        // ============================================================
        async function refreshAll() {
            if (isLoading) return;
            isLoading = true;
            try {
                if (!currentUser) {
                    toolsListEl.innerHTML = `<div class="no-tools">🔒 Please login</div>`;
                    return;
                }
                allTools = await fetchTools();
                myTools = await fetchMyTools(currentUser.id) || [];
                await loadToolsAdsRandomly();
                applyFilters();
            } catch (err) {
                toolsListEl.innerHTML = `<div class="no-tools">❌ Failed to load tools</div>`;
            } finally {
                isLoading = false;
            }
        }

        function applyFilters() {
            currentPage = 0;
            hasMoreTools = true;
            seeMoreBtn.textContent = 'See More ↓';
            seeMoreBtn.disabled = false;

            let shuffledTools = Array.isArray(allTools) ? shuffleArray(allTools) : [];

            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                shuffledTools = shuffledTools.filter(t => t.name.toLowerCase().includes(q));
            }

            if (currentFilter !== 'all') {
                shuffledTools = shuffledTools.filter(t => t.type === currentFilter);
            }

            filteredTools = shuffledTools;

            if (showingMyTools) {
                myToolsSection.classList.add('show');

                let filteredMyTools = Array.isArray(myTools) ? [...myTools] : [];
                
                if (searchQuery.trim()) {
                    const q = searchQuery.trim().toLowerCase();
                    filteredMyTools = filteredMyTools.filter(t => t.name.toLowerCase().includes(q));
                }
                if (currentFilter !== 'all') {
                    filteredMyTools = filteredMyTools.filter(t => t.type === currentFilter);
                }

                renderTools(filteredMyTools, myToolsListEl, true, false, true);
                toolsListEl.style.display = 'none';
                seeMoreBtn.style.display = 'none';
            } else {
                myToolsSection.classList.remove('show');
                toolsListEl.style.display = 'flex';
                seeMoreBtn.style.display = 'block';

                const firstBatch = filteredTools.slice(0, TOOLS_PER_PAGE);
                renderTools(firstBatch, toolsListEl, false, false, false);
                currentPage = 1;

                if (filteredTools.length <= TOOLS_PER_PAGE) {
                    hasMoreTools = false;
                    seeMoreBtn.textContent = 'No more tools';
                    seeMoreBtn.disabled = true;
                } else {
                    hasMoreTools = true;
                    seeMoreBtn.textContent = `See More ↓ (${filteredTools.length - TOOLS_PER_PAGE} remaining)`;
                    seeMoreBtn.disabled = false;
                }
            }
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            applyFilters();
        });

        filterBar.addEventListener('click', (e) => {
            const chip = e.target.closest('.filter-chip');
            if (!chip) return;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            currentFilter = chip.getAttribute('data-type');
            applyFilters();
        });

        myToolsToggleBtn.addEventListener('click', () => {
            showingMyTools = !showingMyTools;
            myToolsToggleBtn.textContent = showingMyTools ? '📁 All Tools' : '📁 My Tools';
            if (showingMyTools) {
                myToolsToggleBtn.style.background = '#4caf50';
            } else {
                myToolsToggleBtn.style.background = '#1877f2';
            }
            applyFilters();
        });

        seeMoreBtn.addEventListener('click', loadMoreTools);

        addToolBtn.addEventListener('click', () => {
            addModal.classList.add('open');
            toolNameInput.value = '';
            toolLinkInput.value = '';
            toolTypeSelect.value = 'Cyber Security';
            toolNameInput.focus();
        });

        closeAddModalBtn.addEventListener('click', () => addModal.classList.remove('open'));
        addModal.addEventListener('click', (e) => { if (e.target === addModal) addModal.classList.remove('open'); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && addModal.classList.contains('open')) addModal.classList.remove('open'); });

        publishBtn.addEventListener('click', async () => {
            const name = toolNameInput.value.trim();
            const type = toolTypeSelect.value;
            const link = toolLinkInput.value.trim();
            if (!name) { showAlert('Please enter tool name!', 'error'); toolNameInput.focus(); return; }
            if (name.length < 2) { showAlert('Name must be at least 2 characters!', 'error'); toolNameInput.focus(); return; }
            if (!link) { showAlert('Please enter tool link!', 'error'); toolLinkInput.focus(); return; }
            try { new URL(link); } catch { showAlert('Please enter a valid link (http/https)', 'error'); toolLinkInput.focus(); return; }

            publishBtn.disabled = true;
            publishBtn.textContent = '⏳ Publishing...';
            const success = await publishTool(name, type, link);
            if (success) {
                showAlert('✅ Tool published!', 'success');
                addModal.classList.remove('open');
                await refreshAll();
                if (showingMyTools) applyFilters();
            }
            publishBtn.disabled = false;
            publishBtn.textContent = '📤 Publish';
        });

        // ===== Profile Nav =====
        document.getElementById('profileNavBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if (currentUser) {
                window.location.href = `userprofile.html?userId=${currentUser.id}`;
            }
        });

        // ============================================================
        // PAGE LOAD
        // ============================================================
        document.addEventListener('DOMContentLoaded', async () => {

            const userId = localStorage.getItem('userId');
            if (!userId) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const userResult = await apiRequest(`/users/${userId}`);
                if (userResult && userResult.success) {
                    currentUser = userResult.data;
                } else {
                    localStorage.removeItem('userId');
                    window.location.href = 'login.html';
                    return;
                }

                await refreshAll();
                await updateNotifBadge();
                setInterval(updateNotifBadge, 30000);

            } catch (err) {
                showAlert('Failed to load page!', 'error');
                toolsListEl.innerHTML = `<div class="no-tools">❌ Load failed</div>`;
            }
        });

    </script>
</body>
</html>
