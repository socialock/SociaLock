        /* ===== SKELETON ===== */

        .skeleton-tool-item {
            background: #242526;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid #3a3b3c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .skeleton-tool-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .skeleton-line {
            height: 14px;
            border-radius: 6px;
            background: #3a3b3c;
            position: relative;
            overflow: hidden;
        }

        .skeleton-line.short {
            width: 50%;
        }

        .skeleton-line.medium {
            width: 70%;
        }

        .skeleton-line.long {
            width: 90%;
        }

        .skeleton-line::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.05),
                transparent
            );
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        .skeleton-tool-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-shrink: 0;
            margin-left: 0.5rem;
        }

        .skeleton-btn-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #3a3b3c;
            position: relative;
            overflow: hidden;
        }

        .skeleton-btn-circle::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.05),
                transparent
            );
            animation: shimmer 1.5s infinite;
        }

        .skeleton-btn-rect {

            height: 24px;
            border-radius: 15px;
            background: #3a3b3c;
            position: relative;
            overflow: hidden;
        }

        .skeleton-btn-rect::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.05),
                transparent
            );
            animation: shimmer 1.5s infinite;
        }

        .skeleton-tools-list {

            margin-top: 0.5rem;

        .skeleton-filter-chips {

                const modalTitle =

                const modalMessage =
                    document.getElementById('modalMessage');

                if (modalIcon) {

                    modalTitle.textContent = title;
                }

                if (modalMessage) {
                    modalMessage.textContent = message;

                document
                    .getElementById('customModal')
                    .classList.add('show');

                pendingConfirmResolve = resolve;

            });
        }

        document

                    .getElementById('customModal')

        // ============================================================
        // API REQUEST
        // ============================================================

        async function apiRequest(endpoint, options = {}) {

            const url =
                `${window.API_BASE_URL}${endpoint}`;

            const userId =
                localStorage.getItem('userId');

            const token =
                localStorage.getItem('token');

            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };

            if (token) {

                headers['Authorization'] =
                    `Bearer ${token}`;

            } else if (userId) {

                headers['Authorization'] =
                    `Bearer ${userId}`;

            }

            try {

                const response =
                    await fetch(url, {
                        ...options,
                        headers
                    });

                const data =
                    await response
                        .json()
                        .catch(() => null);

                if (!response.ok) {

                    console.warn(
                        `[tools] API ${
                            options.method || 'GET'
                        } ${endpoint} failed (${response.status}):`,
                        data && data.error
                    );

                    return data;
                }

                return data;

            } catch (error) {

                console.warn(
                    `[tools] API ${
                        options.method || 'GET'
                    } ${endpoint} network error:`,
                    error
                );

                return null;
            }
        }

        // ============================================================
        // ALERT
        // ============================================================

        function showAlert(message, type = 'info') {

            const existing =
                document.querySelector('.custom-alert');

            if (existing) {
                existing.remove();
            }

            const alert =
                document.createElement('div');

            alert.className =
                `custom-alert ${type}`;

            const icon =
                type === 'success'
                    ? '<i class="fas fa-check-circle"></i>'
                    : type === 'error'
                        ? '<i class="fas fa-exclamation-circle"></i>'
                        : '<i class="fas fa-info-circle"></i>';

            alert.innerHTML =
                icon +
                ' ' +
                message +
                '<button onclick="this.parentElement.remove()" style="background:none;border:none;color:white;margin-left:10px;cursor:pointer;font-size:18px;"><i class="fas fa-times"></i></button>';

            document.body.appendChild(alert);

            setTimeout(() => {

                if (alert.parentElement) {
                    alert.remove();
                }

            }, 4000);
        }

        // ============================================================
        // HELPERS
        // ============================================================

        function escapeHtml(text) {

            if (!text) {
                return '';
            }

            const div =
                document.createElement('div');

            div.textContent = text;

            return div.innerHTML;
        }

        function shuffleArray(array) {

            if (!Array.isArray(array)) {
                return [];
            }

            const shuffled =
                [...array];

            for (
                let i = shuffled.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() * (i + 1)
                    );

                [
                    shuffled[i],
                    shuffled[j]
                ] = [
                    shuffled[j],
                    shuffled[i]
                ];
            }

            return shuffled;
        }

        // ============================================================
        // CATEGORY ORDER
        // ============================================================

        const TOOL_CATEGORY_ORDER = [
            'Cyber Security',
            'Games',
            'Business',
            'Earn',
            'Job',
            'Apk',
            'Video',
            'Documents',
            'Government',
            'Data',
            'Secret',
            'Article',
            'Others'
        ];

        // ============================================================
        // TOP TOOLS FOR SPECIFIC CATEGORY
        // ============================================================

        function getTopToolsForType(tools, type) {

            return tools
                .filter(t => t.type === type)
                .sort(
                    (a, b) =>
                        (Number(b.views_count) || 0) -
                        (Number(a.views_count) || 0)
                )
                .slice(0, 3);
        }

        // ============================================================
        // HOT TOOLS
        //
        // IMPORTANT UPDATE:
        //
        // ALL:
        //     পুরো tool list থেকে শুধু TOP 3 views = HOT
        //
        // SPECIFIC CATEGORY:
        //     ওই category-এর TOP 3 views = HOT
        //
        // বাকি সব আগের মতো shuffle হবে।
        // ============================================================

        function computeHotAndRest(tools, filter) {

            const hotSet = new Set();

            let hotList = [];

            if (filter === 'all') {

                // ====================================================
                // ALL FILTER
                //
                // আগে এখানে প্রতিটি category থেকে 3টি করে নেওয়া হতো।
                //
                // এখন পুরো list থেকে views অনুযায়ী শুধুমাত্র 3টি।
                // ====================================================

                hotList =
                    [...tools]
                        .sort(
                            (a, b) =>
                                (Number(b.views_count) || 0) -
                                (Number(a.views_count) || 0)
                        )
                        .slice(0, 3);

                hotList.forEach(tool => {
                    hotSet.add(tool);
                });

            } else {

                // ====================================================
                // SPECIFIC CATEGORY
                //
                // আগের logic অপরিবর্তিত।
                // ====================================================

                hotList =
                    getTopToolsForType(
                        tools,
                        filter
                    );

                hotList.forEach(tool => {
                    hotSet.add(tool);
                });
            }

            // ========================================================
            // REMAINING TOOLS
            // ========================================================

            const rest =
                tools.filter(
                    tool => !hotSet.has(tool)
                );

            return {
                hotList,
                rest
            };
        }

        // ============================================================
        // VIEWER KEY
        // ============================================================

        function getViewerKey() {

            let key =
                localStorage.getItem('viewerKey');

            if (!key) {

                key =
                    (
                        typeof crypto !== 'undefined' &&
                        crypto.randomUUID
                    )
                        ? crypto.randomUUID()
                        : `v-${Date.now()}-${Math.random()
                            .toString(36)
                            .slice(2)}`;

                localStorage.setItem(
                    'viewerKey',
                    key
                );
            }

            return key;
        }

        // ============================================================
        // RECORD TOOL VIEW
        // ============================================================

        async function recordToolView(toolId) {

            if (
                toolId == null ||
                String(toolId).trim() === ''
            ) {
                return;
            }

            try {

                const result =
                    await apiRequest(
                        `/tools/${encodeURIComponent(toolId)}/view`,
                        {
                            method: 'POST',
                            body: JSON.stringify({
                                viewer_key:
                                    getViewerKey()
                            })
                        }
                    );

                if (
                    result &&
                    result.success &&
                    typeof result.views_count === 'number'
                ) {

                    const t =
                        allTools.find(
                            t =>
                                String(t.id) ===
                                String(toolId)
                        );

                    if (t) {
                        t.views_count =
                            result.views_count;
                    }

                    document
                        .querySelectorAll(
                            `.tool-item[data-id="${CSS.escape(
                                String(toolId)
                            )}"] .tool-views-count`
                        )
                        .forEach(el => {

                            el.textContent =
                                result.views_count;

                        });

                    const modalViews =
                        document.getElementById(
                            'toolDetailViewsCount'
                        );

                    if (
                        modalViews &&
                        modalViews.dataset.toolId ===
                            String(toolId)
                    ) {

                        modalViews.textContent =
                            result.views_count;
                    }

                } else {

                    console.warn(
                        '[tools] View was not recorded:',
                        toolId,
                        result
                    );
                }

            } catch (e) {

                console.warn(
                    '[tools] recordToolView error:',
                    toolId,
                    e
                );
            }
        }

        async function publishTool(
            name,
            type,
            link
        ) {

            if (!currentUser) {
                return false;
            }

            try {

                const existing =
                    allTools.find(
                        t =>
                            t.name.toLowerCase() ===
                            name.toLowerCase()

                if (existing) {

                    showAlert(
                        '❌ A tool with this name already exists!',
                        'error'

                const result =
                    await apiRequest(
                        '/tools',
                        {

                                    currentUser.id,

                                name:
                                    name.trim(),

                                type:
                                    type,

                                link:
                                    link.trim()

                            })

                    );

                if (
                    result &&
                    result.success
                ) {

                    return true;
                }

                if (
                    result &&
                    result.errors

                    showAlert(
                        result.errors.join(', '),
                        'error'

                showAlert(
                    'Failed to publish tool!',

                );

        // ============================================================
        // SHARE URL
        // ============================================================

        function getToolShareUrl(tool) {

            const path =
                window.location.pathname;

            const directory =
                path.substring(
                    0,
                    path.lastIndexOf('/') + 1
                );

            const baseUrl =
                `${window.location.origin}${directory}tool.html`;

            const id =
                tool &&
                tool.id != null &&
                String(tool.id).trim() !== ''
                    ? String(tool.id).trim()
                    : '';

            if (
                id &&
                id.toLowerCase() !== 'null' &&
                id.toLowerCase() !== 'undefined'
            ) {

                return `${baseUrl}?id=${encodeURIComponent(id)}`;
            }

            const name =
                tool?.name
                    ? String(tool.name)
                    : '';

            const link =
                tool?.link
                    ? String(tool.link)
                    : '';

            if (!name || !link) {
                return null;
            }

            return (
                `${baseUrl}?name=${encodeURIComponent(name)}` +
                `&link=${encodeURIComponent(link)}`
            );
        }

        function findToolForShare(
            toolId,
            fallbackTool = null,
            button = null
        ) {

            if (
                fallbackTool &&
                typeof fallbackTool === 'object'
            ) {

                return fallbackTool;
            }

            if (
                button?.dataset?.toolName
            ) {

                return {

                    id:
                        button.dataset.toolId ||
                        null,

                    name:
                        button.dataset.toolName ||
                        '',

                    type:
                        button.dataset.toolType ||
                        'Tool',

                    link:
                        button.dataset.toolLink ||
                        ''
                };
            }

            if (
                toolId != null &&
                String(toolId).trim() !== ''
            ) {

                const id =
                    String(toolId);

                return (
                    allTools.find(
                        t =>
                            t &&
                            t.id != null &&
                            String(t.id) === id
                    )
                    ||
                    myTools.find(
                        t =>
                            t &&
                            t.id != null &&
                            String(t.id) === id
                    )
                    ||
                    null
                );
            }

            return null;
        }

        // ============================================================
        // SHARE TOOL
        // ============================================================

        function shareTool(
            toolId,
            event,
            fallbackTool = null
        ) {

            if (event) {

                event.preventDefault();
                event.stopPropagation();
            }

            const button =
                event?.currentTarget ||
                null;

            const tool =
                findToolForShare(
                    toolId,
                    fallbackTool,
                    button
                );

            if (
                !tool ||
                !tool.name ||
                !tool.link
            ) {

                showAlert(
                    'Unable to create share link: Tool information is missing.',
                    'error'
                );

                return;
            }

            const shareUrl =
                getToolShareUrl(tool);

            if (!shareUrl) {

                showAlert(
                    'Unable to create share link: Tool name or link is missing.',
                    'error'
                );

                return;
            }

            const shareData = {

                title:
                    tool.name,

                text:
                    `🔧 ${tool.name} - ${
                        tool.type || 'Tool'
                    }`,

                url:
                    shareUrl
            };

            if (
                typeof window.openShareSheet ===
                'function'
            ) {

                window.openShareSheet(
                    shareData
                );

                return;
            }

            if (navigator.share) {

                navigator
                    .share(shareData)
                    .catch(() => {});

                return;
            }

            if (navigator.clipboard) {

                navigator.clipboard
                    .writeText(shareUrl)
                    .then(() => {

                        showAlert(
                            '✅ Tool link copied!',
                            'success'
                        );

                    })
                    .catch(() => {

                        window.prompt(
                            'Copy this tool link:',
                            shareUrl
                        );

                    });

            } else {

                window.prompt(
                    'Copy this tool link:',
                    shareUrl
                );
            }
        }

                        onerror="this.style.display='none'">`

        // ============================================================
        // RENDER TOOLS
        // ============================================================

        function renderTools(
            tools,
            container,
            showDelete = false,
            append = false,
            isMyTools = false
        ) {

            if (!append) {
                container.innerHTML = '';
            }

            if (
                !tools ||
                tools.length === 0
            ) {

                if (!append) {

                    container.innerHTML =
                        isMyTools

                            ? '<div class="no-tools"><i class="fas fa-inbox"></i> You haven\'t published any tools yet</div>'

                            : '<div class="no-tools"><i class="fas fa-search"></i> No tools found</div>';
                }

                return;
            }

            tools.forEach(
                (tool, index) => {

                    const item =
                        document.createElement(
                            'div'
                        );

                    item.className =
                        'tool-item' +
                        (
                            tool._isHot
                                ? ' is-hot'
                                : ''
                        );

                    item.setAttribute(
                        'data-id',
                        tool.id
                    );

                    let domain = '';

                    try {

                        if (tool.link) {

                            domain =
                                new URL(
                                    tool.link
                                ).hostname;
                        }

                    } catch (e) {}

                    const viewsCount =
                        Number(
                            tool.views_count
                        ) || 0;

                    item.innerHTML = `

                        <div class="tool-info">

                            <div class="tool-name">
                                ${escapeHtml(
                                    tool.name
                                )}
                            </div>

                            <div
                                style="
                                    display:flex;
                                    gap:0.5rem;
                                    align-items:center;
                                    flex-wrap:wrap;
                                "
                            >

                                ${
                                    tool._isHot

                                        ? `<span class="tool-hot-badge">
                                            <i class="fas fa-fire"></i>
                                            Hot
                                          </span>`

                                        : ''
                                }

                                <span class="tool-type">
                                    ${escapeHtml(
                                        tool.type
                                    )}
                                </span>

                                ${
                                    domain

                                        ? `<span style="font-size:0.6rem;color:#b0b3b8;">
                                            ${escapeHtml(
                                                domain
                                            )}
                                           </span>`

                                        : ''
                                }

                                <span class="tool-views-badge">

                                    <i class="fas fa-eye"></i>

                                    <span class="tool-views-count">
                                        ${viewsCount}
                                    </span>

                                </span>

                            </div>

                        </div>

                        <div class="tool-actions">

                            <button
                                class="tool-share-btn"
                                data-tool-id="${escapeHtml(
                                    tool.id ?? ''
                                )}"
                                data-tool-name="${escapeHtml(
                                    tool.name ?? ''
                                )}"
                                data-tool-type="${escapeHtml(
                                    tool.type ?? 'Tool'
                                )}"
                                data-tool-link="${escapeHtml(
                                    tool.link ?? ''
                                )}"
                                onclick="shareTool('${String(
                                    tool.id ?? ''
                                ).replace(
                                    /'/g,
                                    "\\'"
                                )}', event)"
                                title="Share"
                            >
                                <i class="fas fa-share-alt"></i>
                            </button>

                            ${
                                showDelete

                                    ? `<button
                                        class="tool-delete-btn"
                                        data-id="${tool.id}"
                                        title="Delete"
                                      >
                                        <i class="fas fa-trash-alt"></i>
                                      </button>`

                                    : `<button
                                        class="tool-report-btn"
                                        data-id="${tool.id}"
                                        title="Report"
                                      >
                                        <i class="fas fa-flag"></i>
                                      </button>`
                            }

                        </div>
                    `;

                    // =================================================
                    // TOOL CLICK
                    // =================================================

                    item.addEventListener(
                        'click',
                        (e) => {

                            if (
                                e.target.closest(
                                    '.tool-share-btn'
                                ) ||
                                e.target.closest(
                                    '.tool-delete-btn'
                                ) ||
                                e.target.closest(
                                    '.tool-report-btn'
                                )
                            ) {

                                return;
                            }

                            if (tool.link) {

                                window.open(
                                    tool.link,
                                    '_blank'
                                );

                                recordToolView(
                                    tool.id
                                );

                            } else {

                                showAlert(
                                    'No link available!',
                                    'error'
                                );
                            }

                        }
                    );

                    // =================================================
                    // REPORT
                    // =================================================

                    const reportBtn =
                        item.querySelector(
                            '.tool-report-btn'
                        );

                    if (reportBtn) {

                        reportBtn.addEventListener(
                            'click',
                            (e) => {

                                e.stopPropagation();

                                if (!currentUser) {

                                    showAlert(
                                        'Please login first!',
                                        'error'
                                    );

                                    return;
                                }

                                const id =
                                    reportBtn.getAttribute(
                                        'data-id'
                                    );

                                window.openReportModal({
                                    targetType:
                                        'tool',

                                    targetId:
                                        id,

                                    itemLabel:
                                        'tool'
                                });

                            }
                        );
                    }

                    // =================================================
                    // DELETE
                    // =================================================

                    const deleteBtn =
                        item.querySelector(
                            '.tool-delete-btn'
                        );

                    if (deleteBtn) {

                        deleteBtn.addEventListener(
                            'click',
                            async (e) => {

                                e.stopPropagation();

                                const id =
                                    deleteBtn.getAttribute(
                                        'data-id'
                                    );

                                const confirmed =
                                    await customConfirm(
                                        'Delete Tool',
                                        'Delete this tool? This cannot be undone.'
                                    );

                                if (!confirmed) {
                                    return;
                                }

                                const success =
                                    await deleteTool(
                                        id
                                    );

                                if (success) {

                                    showAlert(
                                        '✅ Tool deleted!',
                                        'success'
                                    );

                                    await refreshAll();
                                }

                            }
                        );
                    }

                    container.appendChild(
                        item
                    );

                    // =================================================
                    // ADS
                    // =================================================

                    if (
                        !showDelete &&
                        !isMyTools &&
                        Math.random() < 0.15 &&
                        index < tools.length - 1
                    ) {

                        const ad =
                            getRandomToolsAd();

                        if (ad) {

                            const adDiv =
                                createToolsAdElement(
                                    ad
                                );

                            if (adDiv) {

                                container.appendChild(
                                    adDiv
                                );
                            }
                        }
                    }

                }
            );
        }

        // ============================================================
        // PAGINATION
        // ============================================================

        function loadMoreTools() {

            if (
                isLoading ||
                !hasMoreTools
            ) {

                return;
            }

            const start =
                currentPage *
                TOOLS_PER_PAGE;

            const end =
                start +
                TOOLS_PER_PAGE;

            const nextBatch =
                filteredTools.slice(
                    start,
                    end
                );

            if (
                nextBatch.length === 0
            ) {

                hasMoreTools = false;

                seeMoreBtn.innerHTML =
                    'No more tools';

                seeMoreBtn.disabled =
                    true;

                return;
            }

            renderTools(
                nextBatch,
                toolsListEl,
                false,
                true,
                false
            );

            currentPage++;

            if (
                end >=
                filteredTools.length
            ) {

                hasMoreTools = false;

                seeMoreBtn.innerHTML =
                    'No more tools';

                seeMoreBtn.disabled =
                    true;

            } else {

                seeMoreBtn.innerHTML =
                    `See More <i class="fas fa-chevron-down"></i> (${
                        filteredTools.length - end
                    } remaining)`;

                seeMoreBtn.disabled =
                    false;
            }
        }

        // ============================================================
        // SHARED TOOL
        // ============================================================

        async function checkSharedToolLink() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const sharedId =
                params.get('id');

            if (!sharedId) {
                return;
            }

            const normalizedSharedId =
                String(sharedId);

            let tool =
                allTools.find(
                    t =>
                        String(t.id) ===
                        normalizedSharedId
                )
                ||
                myTools.find(
                    t =>
                        String(t.id) ===
                        normalizedSharedId
                );

            if (!tool) {

                try {

                    const result =
                        await apiRequest(
                            `/tools/${encodeURIComponent(
                                normalizedSharedId
                            )}`
                        );

                    if (
                        result &&
                        result.success &&
                        result.data
                    ) {

                        tool =
                            result.data;
                    }

                } catch (e) {}
            }

            if (tool) {

                openToolDetailModal(
                    tool
                );

            } else {

                showAlert(
                    'Tool not found. It may have been removed.',
                    'error'
                );
            }
        }

        // ============================================================
        // REFRESH
        // ============================================================

        async function refreshAll() {

            if (isLoading) {
                return;
            }

            isLoading = true;

            try {

                if (!currentUser) {

                    toolsListEl.innerHTML =
                        '<div class="no-tools"><i class="fas fa-lock"></i> Please login</div>';

                    hideSkeletonAndShowReal();

                    return;
                }

                allTools =
                    await fetchTools();

                myTools =
                    await fetchMyTools(
                        currentUser.id
                    ) || [];

                await loadToolsAdsRandomly();

                applyFilters();

                hideSkeletonAndShowReal();

            } catch (err) {

                toolsListEl.innerHTML =
                    '<div class="no-tools"><i class="fas fa-exclamation-circle"></i> Failed to load tools</div>';

                hideSkeletonAndShowReal();

            } finally {

                isLoading = false;
            }
        }

        // ============================================================
        // APPLY FILTERS
        // ============================================================

        function applyFilters() {

            currentPage = 0;

            hasMoreTools = true;

            seeMoreBtn.innerHTML =
                'See More <i class="fas fa-chevron-down"></i>';

            seeMoreBtn.disabled =
                false;

            let baseTools =
                Array.isArray(allTools)
                    ? [...allTools]
                    : [];

            // ========================================================
            // SEARCH
            // ========================================================

            if (searchQuery.trim()) {

                const q =
                    searchQuery
                        .trim()
                        .toLowerCase();

                baseTools =
                    baseTools.filter(
                        t =>
                            t.name
                                .toLowerCase()
                                .includes(q)
                    );
            }

            let combinedTools;

            // ========================================================
            // SEARCH MODE
            // ========================================================

            if (searchQuery.trim()) {

                let searchResults =
                    currentFilter !== 'all'

                        ? baseTools.filter(
                            t =>
                                t.type ===
                                currentFilter
                        )

                        : baseTools;

                searchResults =
                    shuffleArray(
                        searchResults
                    );

                searchResults.forEach(
                    t => {
                        t._isHot = false;
                    }
                );

                combinedTools =
                    searchResults;

            } else {

                // ====================================================
                // CATEGORY POOL
                // ====================================================

                const categoryPool =
                    currentFilter !== 'all'

                        ? baseTools.filter(
                            t =>
                                t.type ===
                                currentFilter
                        )

                        : baseTools;

                // ====================================================
                // UPDATED HOT LOGIC
                //
                // All:
                //     পুরো list-এর Top 3
                //
                // Category:
                //     category-এর Top 3
                // ====================================================

                const {
                    hotList,
                    rest
                } =
                    computeHotAndRest(
                        categoryPool,
                        currentFilter
                    );

                // ====================================================
                // BAKI TOOLS RANDOM
                // ====================================================

                const shuffledRest =
                    shuffleArray(rest);

                // ====================================================
                // ONLY TOP 3 HOT
                // ====================================================

                hotList.forEach(
                    t => {
                        t._isHot = true;
                    }
                );

                // ====================================================
                // ALL OTHER TOOLS NON-HOT
                // ====================================================

                shuffledRest.forEach(
                    t => {
                        t._isHot = false;
                    }
                );

                // ====================================================
                // HOT FIRST + REST AFTER
                // ====================================================

                combinedTools = [
                    ...hotList,
                    ...shuffledRest
                ];
            }

            filteredTools =
                combinedTools;

            // ========================================================
            // MY TOOLS
            // ========================================================

            if (showingMyTools) {

                myToolsSection
                    .classList
                    .add('show');

                let filteredMyTools =
                    Array.isArray(myTools)
                        ? [...myTools]
                        : [];

                if (searchQuery.trim()) {

                    const q =
                        searchQuery
                            .trim()
                            .toLowerCase();

                    filteredMyTools =
                        filteredMyTools.filter(
                            t =>
                                t.name
                                    .toLowerCase()
                                    .includes(q)
                        );
                }

                if (
                    currentFilter !==
                    'all'
                ) {

                    filteredMyTools =
                        filteredMyTools.filter(
                            t =>
                                t.type ===
                                currentFilter
                        );
                }

                renderTools(
                    filteredMyTools,
                    myToolsListEl,
                    true,
                    false,
                    true
                );

                toolsListEl.style.display =
                    'none';

                seeMoreBtn.style.display =
                    'none';

            } else {

                myToolsSection
                    .classList
                    .remove('show');

                toolsListEl.style.display =
                    'flex';

                seeMoreBtn.style.display =
                    'block';

                const firstBatch =
                    filteredTools.slice(
                        0,
                        TOOLS_PER_PAGE
                    );

                renderTools(
                    firstBatch,
                    toolsListEl,
                    false,
                    false,
                    false
                );

                currentPage = 1;

                if (
                    filteredTools.length <=
                    TOOLS_PER_PAGE
                ) {

                    hasMoreTools = false;

                    seeMoreBtn.innerHTML =
                        'No more tools';

                    seeMoreBtn.disabled =
                        true;

                } else {

                    hasMoreTools = true;

                    seeMoreBtn.innerHTML =
                        `See More <i class="fas fa-chevron-down"></i> (${
                            filteredTools.length -
                            TOOLS_PER_PAGE
                        } remaining)`;

                    seeMoreBtn.disabled =
                        false;
                }
            }
        }

        // ============================================================
        // SEARCH EVENT
        // ============================================================

        searchInput.addEventListener(
            'input',
            (e) => {

                searchQuery =
                    e.target.value;

                applyFilters();
            }
        );

        // ============================================================
        // FILTER EVENT
        // ============================================================

        filterBar.addEventListener(
            'click',
            (e) => {

                const chip =
                    e.target.closest(
                        '.filter-chip'
                    );

                if (!chip) {
                    return;
                }

                document
                    .querySelectorAll(
                        '.filter-chip'
                    )
                    .forEach(
                        c =>
                            c.classList.remove(
                                'active'
                            )
                    );

                chip.classList.add(
                    'active'
                );

                currentFilter =
                    chip.getAttribute(
                        'data-type'
                    );

                applyFilters();
            }
        );

        // ============================================================
        // MY TOOLS TOGGLE
        // ============================================================

        myToolsToggleBtn.addEventListener(
            'click',
            () => {

                showingMyTools =
                    !showingMyTools;

                myToolsToggleBtn.innerHTML =
                    showingMyTools

                        ? '<i class="fas fa-list"></i> All Tools'

                        : '<i class="fas fa-folder"></i> My Tools';

                if (showingMyTools) {

                    myToolsToggleBtn.style.background =
                        '#4caf50';

                } else {

                    myToolsToggleBtn.style.background =
                        '#1877f2';
                }

                applyFilters();
            }
        );

        // ============================================================
        // SEE MORE
        // ============================================================

        seeMoreBtn.addEventListener(
            'click',
            loadMoreTools
        );

        // ============================================================
        // ADD TOOL
        // ============================================================

        addToolBtn.addEventListener(
            'click',
            () => {

                addModal.classList.add(
                    'open'
                );

                toolNameInput.value =
                    '';

                toolLinkInput.value =
                    '';

                toolTypeSelect.value =
                    'Cyber Security';

                toolNameInput.focus();
            }
        );

        // ============================================================
        // CLOSE ADD MODAL
        // ============================================================

        closeAddModalBtn.addEventListener(
            'click',
            () =>
                addModal.classList.remove(
                    'open'
                )
        );

        addModal.addEventListener(
            'click',
            (e) => {

                if (e.target === addModal) {

                    addModal.classList.remove(
                        'open'
                    );
                }
            }
        );

        document.addEventListener(
            'keydown',
            (e) => {

                if (
                    e.key === 'Escape' &&
                    addModal.classList.contains(
                        'open'
                    )
                ) {

                    addModal.classList.remove(
                        'open'
                    );
                }
            }
        );

        // ============================================================
        // PUBLISH TOOL
        // ============================================================

        publishBtn.addEventListener(
            'click',
            async () => {

                const name =
                    toolNameInput.value.trim();

                const type =
                    toolTypeSelect.value;

                const link =
                    toolLinkInput.value.trim();

                if (!name) {

                    showAlert(
                        'Please enter tool name!',
                        'error'
                    );

                    toolNameInput.focus();

                    return;
                }

                if (name.length < 2) {

                    showAlert(
                        'Name must be at least 2 characters!',
                        'error'
                    );

                    toolNameInput.focus();

                    return;
                }

                if (!link) {

                    showAlert(
                        'Please enter tool link!',
                        'error'
                    );

                    toolLinkInput.focus();

                    return;
                }

                try {

                    new URL(link);

                } catch {

                    showAlert(
                        'Please enter a valid link (http/https)',
                        'error'
                    );

                    toolLinkInput.focus();

                    return;
                }

                publishBtn.disabled =
                    true;

                publishBtn.innerHTML =
                    '<i class="fas fa-spinner fa-spin"></i> Publishing...';

                const success =
                    await publishTool(
                        name,
                        type,
                        link
                    );

                if (success) {

                    showAlert(
                        '✅ Tool published!',
                        'success'
                    );

                    addModal.classList.remove(
                        'open'
                    );

                    await refreshAll();

                    if (showingMyTools) {
                        applyFilters();
                    }
                }

                publishBtn.disabled =
                    false;

                publishBtn.innerHTML =
                    '<i class="fas fa-upload"></i> Publish';
            }
        );

        // ============================================================
        // PROFILE NAV
        // ============================================================

        document
            .getElementById(
                'profileNavBtn'
            )
            .addEventListener(
                'click',
                function(e) {

                    e.preventDefault();

                    if (currentUser) {

                        window.location.href =
                            `userprofile.html?userId=${
                                currentUser.id
                            }`;
                    }
                }
            );

        // ============================================================
        // PAGE LOAD
        // ============================================================

        document.addEventListener(
            'DOMContentLoaded',
            async () => {

                const userId =
                    localStorage.getItem(
                        'userId'
                    );

                if (!userId) {

                    window.location.href =
                        'login.html';

                    return;
                }

                // Show skeleton immediately

                showSkeleton();

                try {

                    const userResult =
                        await apiRequest(
                            `/users/${userId}`
                        );

                    if (
                        userResult &&
                        userResult.success
                    ) {

                        currentUser =
                            userResult.data;

                    } else {

                        localStorage.removeItem(
                            'userId'
                        );

                        window.location.href =
                            'login.html';

                        return;
                    }

                    await refreshAll();

                    await checkSharedToolLink();

                    await updateNotifBadge();

                    setInterval(
                        updateNotifBadge,
                        120000
                    );

                } catch (err) {

                    showAlert(
                        'Failed to load page!',
                        'error'
                    );

                    toolsListEl.innerHTML =
                        '<div class="no-tools"><i class="fas fa-exclamation-circle"></i> Load failed</div>';

                    hideSkeletonAndShowReal();
                }
            }
        );

        // ============================================================
        // GLOBAL SHARE FUNCTION
        // ============================================================

        window.shareTool =
            shareTool;

    </script>

</body>
</html>
