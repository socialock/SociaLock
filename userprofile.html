<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Profile - SociaLock</title>
    
    <!-- ===== FIREBASE CDN (সবার আগে) ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== CSS SAME AS BEFORE (Keep existing styles) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { background: #18191a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #e4e6eb; display: flex; flex-direction: column; padding-top: 0; }

        .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .main-container { max-width: 700px; width: 100%; margin: 0 auto; padding: 0 16px; flex: 1; overflow-y: auto; padding-bottom: 20px; }
        .back-header { display: flex; align-items: center; gap: 12px; padding: 12px 0 8px; border-bottom: 1px solid #3a3b3c; margin-bottom: 16px; }
        .back-header .back-btn { background: none; border: none; color: #b0b3b8; font-size: 24px; cursor: pointer; padding: 4px 8px; border-radius: 50%; transition: 0.2s; }
        .back-header .back-btn:hover { background: #3a3b3c; color: #e4e6eb; }
        .back-header .back-title { font-size: 18px; font-weight: 600; color: #e4e6eb; }

        .profile-header { margin-bottom: 16px; }
        .profile-avatar-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: #1877f2; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 32px; border: 3px solid #3a3b3c; flex-shrink: 0; overflow: hidden; }
        .profile-name-row { flex: 1; }
        .profile-username { font-size: 22px; font-weight: 700; color: #e4e6eb; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .profile-username .verified-badge { color: #1877f2; font-size: 18px; }
        .profile-bio { color: #b0b3b8; font-size: 14px; margin-top: 4px; line-height: 1.5; word-break: break-word; }
        .profile-bio .bio-edit-btn { background: none; border: none; color: #1877f2; cursor: pointer; font-size: 13px; margin-left: 6px; }
        .profile-bio .bio-edit-btn:hover { text-decoration: underline; }
        .profile-meta { display: flex; gap: 12px; margin-top: 4px; font-size: 13px; color: #b0b3b8; flex-wrap: wrap; }
        .profile-meta .country { display: flex; align-items: center; gap: 4px; }
        .profile-stats { display: flex; gap: 16px; margin-top: 8px; font-size: 14px; }
        .profile-stats span { cursor: pointer; color: #b0b3b8; }
        .profile-stats span:hover { color: #e4e6eb; }
        .profile-stats .count { font-weight: 700; color: #e4e6eb; }

        .profile-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; position: relative; align-items: center; }
        .profile-actions .btn { padding: 7px 18px; border: none; border-radius: 20px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px; }
        .btn-primary { background: #1877f2; color: white; }
        .btn-primary:hover { background: #166fe5; }
        .btn-primary.following { background: #3a3b3c; color: #e4e6eb; }
        .btn-primary.following:hover { background: #e94560; }
        .btn-danger { background: #e94560; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-more { background: #3a3b3c; color: #e4e6eb; padding: 7px 12px; border-radius: 50%; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; min-width: 36px; min-height: 36px; }
        .btn-more:hover { background: #4a4b4c; }
        .more-dropdown { display: none; position: absolute; right: 50%; transform: translateX(50%); top: 100%; background: #242526; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.3); min-width: 200px; z-index: 100; border: 1px solid #3a3b3c; padding: 6px 0; margin-top: 6px; }
        .more-dropdown.show { display: block; }
        .more-dropdown .dropdown-item { display: flex; align-items: center; gap: 12px; padding: 10px 18px; color: #e4e6eb; cursor: pointer; transition: 0.2s; border: none; background: none; width: 100%; text-align: left; font-size: 14px; white-space: nowrap; }
        .more-dropdown .dropdown-item:hover { background: #3a3b3c; }
        .more-dropdown .dropdown-item .icon { font-size: 15px; color: #b0b3b8; width: 20px; text-align: center; }
        .more-dropdown .dropdown-item.danger { color: #e94560; }
        .more-dropdown .dropdown-item.danger .icon { color: #e94560; }

        .profile-posts-title { font-weight: 600; font-size: 17px; margin-bottom: 12px; color: #e4e6eb; border-top: 1px solid #3a3b3c; padding-top: 16px; }
        .post-card { background: #242526; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #3a3b3c; transition: 0.2s; }
        .post-card:hover { border-color: #4a4b4c; }
        .post-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .post-left { display: flex; align-items: center; gap: 10px; }
        .post-avatar { width: 36px; height: 36px; border-radius: 50%; background: #1877f2; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px; flex-shrink: 0; cursor: pointer; }
        .post-user-info { flex: 1; }
        .post-username { font-weight: 600; font-size: 14px; color: #e4e6eb; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .post-username:hover { text-decoration: underline; }
        .post-username .verified-badge { color: #1877f2; font-size: 13px; }
        .post-time { font-size: 11px; color: #b0b3b8; }
        .post-more-btn { background: none; border: none; color: #b0b3b8; font-size: 18px; cursor: pointer; padding: 4px 6px; border-radius: 50%; transition: 0.2s; position: relative; }
        .post-more-btn:hover { background: #3a3b3c; }
        .post-more-menu { display: none; position: absolute; right: 0; top: 28px; background: #242526; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.3); min-width: 140px; z-index: 100; border: 1px solid #3a3b3c; padding: 6px 0; }
        .post-more-menu.show { display: block; }
        .post-more-menu .menu-item { display: block; padding: 8px 14px; color: #e4e6eb; text-decoration: none; transition: 0.2s; cursor: pointer; font-size: 13px; border: none; background: none; width: 100%; text-align: left; }
        .post-more-menu .menu-item:hover { background: #3a3b3c; }
        .post-more-menu .menu-item.danger { color: #e94560; }
        .post-content { font-size: 14px; line-height: 1.5; margin-bottom: 10px; color: #e4e6eb; word-wrap: break-word; white-space: pre-wrap; cursor: pointer; }
        .post-content a { color: #1877f2; text-decoration: none; }
        .post-content a:hover { text-decoration: underline; }
        .post-stats { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-top: 1px solid #3a3b3c; border-bottom: 1px solid #3a3b3c; margin-bottom: 6px; }
        .post-stats span { font-size: 13px; color: #b0b3b8; cursor: pointer; }
        .post-stats span:hover { color: #1877f2; }
        .post-actions { display: flex; gap: 6px; padding: 4px 0; }
        .post-action-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px; border: none; background: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; color: #b0b3b8; transition: 0.2s; }
        .post-action-btn:hover { background: #3a3b3c; }
        .post-action-btn.liked { color: #e94560; }
        .post-action-btn svg { width: 18px; height: 18px; }
        .no-posts { text-align: center; padding: 30px; color: #b0b3b8; }
        .loading-spinner { text-align: center; padding: 30px; color: #b0b3b8; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 3000; align-items: center; justify-content: center; padding: 1rem; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: #242526; padding: 1.5rem; border-radius: 16px; width: 100%; max-width: 380px; border: 1px solid #3a3b3c; }
        .modal-box h3 { margin-bottom: 1rem; text-align: center; color: #e4e6eb; font-size: 18px; }
        .modal-box .char-count { text-align: right; font-size: 12px; color: #b0b3b8; margin-bottom: 6px; }
        .modal-box textarea { width: 100%; padding: 0.8rem; background: #3a3b3c; border: 1px solid #3a3b3c; color: #e4e6eb; border-radius: 8px; font-size: 14px; outline: none; resize: vertical; min-height: 80px; max-height: 150px; font-family: inherit; }
        .modal-box textarea:focus { border-color: #1877f2; }
        .modal-box .btn-row { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .modal-box .btn-row button { flex: 1; padding: 0.6rem; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .btn-primary-modal { background: #1877f2; color: white; }
        .btn-primary-modal:hover { background: #166fe5; }
        .btn-primary-modal:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-danger-modal { background: #e94560; color: white; }
        .btn-danger-modal:hover { background: #ff4757; }

        .custom-alert { position: fixed; top: 70px; right: 10px; left: 10px; padding: 12px; border-radius: 8px; color: white; z-index: 10000; max-width: 400px; margin: 0 auto; animation: slideIn 0.3s ease; }
        .custom-alert.success { background: #4caf50; }
        .custom-alert.error { background: #e94560; }
        .custom-alert.info { background: #1877f2; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        @media (max-width: 480px) {
            .main-container { padding: 0 12px; }
            .profile-avatar { width: 64px; height: 64px; font-size: 26px; border-width: 2px; }
            .profile-username { font-size: 18px; }
            .profile-username .verified-badge { font-size: 15px; }
            .profile-avatar-row { gap: 12px; }
            .profile-stats { gap: 12px; font-size: 13px; }
            .profile-actions .btn { padding: 6px 14px; font-size: 12px; }
            .btn-more { padding: 6px 10px; font-size: 14px; min-width: 32px; min-height: 32px; }
            .post-card { padding: 12px; }
            .post-avatar { width: 32px; height: 32px; font-size: 14px; }
            .post-username { font-size: 13px; }
            .post-content { font-size: 13px; }
            .post-action-btn { font-size: 12px; padding: 5px; }
            .post-action-btn svg { width: 16px; height: 16px; }
            .back-header .back-btn { font-size: 20px; }
            .back-header .back-title { font-size: 16px; }
            .profile-bio { font-size: 13px; }
            .profile-meta { font-size: 12px; gap: 8px; }
            .modal-box { padding: 1rem; max-width: 320px; }
            .modal-box textarea { font-size: 13px; min-height: 60px; }
            .more-dropdown { min-width: 180px; right: 50%; transform: translateX(50%); }
            .more-dropdown .dropdown-item { font-size: 13px; padding: 8px 14px; }
            .post-more-menu { min-width: 120px; }
        }
    
        /* ===== কাস্টম কনফার্ম মডাল ===== */
        .custom-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        .custom-modal-overlay.show { display: flex; }
        .custom-modal {
            background: #242526;
            border-radius: 16px;
            padding: 28px 24px 20px;
            max-width: 380px;
            width: 90%;
            border: 1px solid #3a3b3c;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        .custom-modal .modal-icon {
            font-size: 2.8rem;
            color: #e94560;
            margin-bottom: 8px;
        }
        .custom-modal h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #e4e6eb;
        }
        .custom-modal p {
            font-size: 0.95rem;
            color: #b0b3b8;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .custom-modal .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .custom-modal .modal-actions button {
            padding: 8px 24px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .custom-modal .modal-actions .btn-cancel {
            background: #3a3b3c;
            color: #b0b3b8;
        }
        .custom-modal .modal-actions .btn-cancel:hover { background: #4a4b4c; }
        .custom-modal .modal-actions .btn-danger {
            background: #e94560;
            color: white;
        }
        .custom-modal .modal-actions .btn-danger:hover { background: #c62828; }
    </style>

</head>

<body>
    <div class="main-wrapper">
        <div class="main-container" id="mainContainer">
            <div class="back-header">
                <button class="back-btn" onclick="window.location.href='home.html'">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <span class="back-title" id="pageTitle">Profile</span>
            </div>
            <div id="profileContainer"><div class="loading-spinner">⏳ Loading profile...</div></div>
            <div class="profile-posts-title">📝 Posts</div>
            <div id="postsContainer"><div class="loading-spinner">⏳ Loading posts...</div></div>
        </div>
    </div>

    <!-- EDIT BIO MODAL -->
    <div class="modal-overlay" id="editBioModal">
        <div class="modal-box">
            <h3>✏️ Edit Bio</h3>
            <div class="char-count"><span id="bioCharCount">0</span>/100</div>
            <textarea id="bioTextarea" placeholder="Write something about yourself..." maxlength="100"></textarea>
            <div class="btn-row">
                <button class="btn-primary-modal" id="saveBioBtn">Save</button>
                <button class="btn-danger-modal" id="closeBioModal">Cancel</button>
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="js/config.js"></script>
    <script src="js/firebase-config.js"></script>
    <!-- ===== কাস্টম কনফার্ম মডাল ===== -->
    <div class="custom-modal-overlay" id="customModal">
        <div class="custom-modal">
            <div class="modal-icon" id="modalIcon">⚠️</div>
            <h3 id="modalTitle">Are you sure?</h3>
            <p id="modalMessage">This action cannot be undone.</p>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">Cancel</button>
                <button class="btn-danger" id="modalConfirm">OK</button>
            </div>
        </div>
    </div>

    <script>
        // ===== কাস্টম কনফার্ম =====
        let pendingConfirmResolve = null;
        function customConfirm(title, message, icon = '⚠️') {
            return new Promise(function(resolve) {
                document.getElementById('modalIcon').textContent = icon;
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalMessage').textContent = message;
                document.getElementById('customModal').classList.add('show');
                pendingConfirmResolve = resolve;
            });
        }
        document.getElementById('modalCancel').addEventListener('click', function() {
            document.getElementById('customModal').classList.remove('show');
            if (pendingConfirmResolve) { pendingConfirmResolve(false); pendingConfirmResolve = null; }
        });
        document.getElementById('modalConfirm').addEventListener('click', function() {
            document.getElementById('customModal').classList.remove('show');
            if (pendingConfirmResolve) { pendingConfirmResolve(true); pendingConfirmResolve = null; }
        });
        document.getElementById('customModal').addEventListener('click', function(e) {
            if (e.target === this) {
                document.getElementById('customModal').classList.remove('show');
                if (pendingConfirmResolve) { pendingConfirmResolve(false); pendingConfirmResolve = null; }
            }
        });


        // ============================================================
        // USERPROFILE.JS - FIXED (blockedUsers array handling)
        // ============================================================

        let currentUser = null;
        let profileUser = null;
        let isOwnProfile = false;
        let isFollowing = false;
        let blockedUsers = []; // ✅ Always initialize as empty array

        const profileContainer = document.getElementById('profileContainer');
        const postsContainer = document.getElementById('postsContainer');
        const editBioModal = document.getElementById('editBioModal');
        const bioTextarea = document.getElementById('bioTextarea');
        const bioCharCount = document.getElementById('bioCharCount');
        const saveBioBtn = document.getElementById('saveBioBtn');

        bioTextarea.addEventListener('input', function() {
            bioCharCount.textContent = this.value.length;
            saveBioBtn.disabled = this.value.length === 0 || this.value.length > 100;
        });

        document.getElementById('closeBioModal').addEventListener('click', () => editBioModal.classList.remove('open'));

        // ===== FIXED: getBlockedUsers always returns array =====
        async function getBlockedUsers() {
            if (!currentUser) {
                blockedUsers = [];
                return blockedUsers;
            }
            try {
                const result = await window.apiRequest(`/users/${currentUser.id}/blocked`);
                // Ensure we have an array
                if (result && result.success && Array.isArray(result.data)) {
                    blockedUsers = result.data;
                } else {
                    blockedUsers = [];
                }
            } catch (err) {
                blockedUsers = [];
            }
            return blockedUsers;
        }

        // ===== FIXED: isUserBlocked checks array type =====
        function isUserBlocked(userId) {
            if (!Array.isArray(blockedUsers)) return false;
            return blockedUsers.includes(userId);
        }

        async function checkFollowStatus() {
            if (!currentUser || !profileUser || isOwnProfile) return;
            try {
                const result = await window.apiRequest(`/users/${currentUser.id}/following`);
                if (result && result.success) {
                    isFollowing = result.data.some(u => u.id === profileUser.id);
                    updateFollowButton();
                }
            } catch (err) { }
        }

        async function toggleFollow() {
            if (!currentUser || !profileUser || isOwnProfile) return;
            try {
                if (isFollowing) {
                    const result = await window.apiRequest('/users/follow', {
                        method: 'DELETE',
                        body: JSON.stringify({ follower_id: currentUser.id, following_id: profileUser.id })
                    });
                    if (result && result.success) {
                        isFollowing = false;
                        showAlert(`Unfollowed ${profileUser.username}`, 'info');
                    }
                } else {
                    const result = await window.apiRequest('/users/follow', {
                        method: 'POST',
                        body: JSON.stringify({ follower_id: currentUser.id, following_id: profileUser.id })
                    });
                    if (result && result.success) {
                        isFollowing = true;
                        showAlert(`Following ${profileUser.username}`, 'success');
                    }
                }
                updateFollowButton();
                updateProfileStats();
            } catch (err) { }
        }

        function updateFollowButton() {
            const btn = document.getElementById('followBtn');
            if (!btn) return;
            if (isFollowing) {
                btn.textContent = '✓ Following';
                btn.classList.add('following');
            } else {
                btn.textContent = '+ Follow';
                btn.classList.remove('following');
            }
        }

        async function updateProfileStats() {
            if (!profileUser) return;
            try {
                const [followersResult, followingResult] = await Promise.all([
                    window.apiRequest(`/users/${profileUser.id}/followers`),
                    window.apiRequest(`/users/${profileUser.id}/following`)
                ]);

                const followers = followersResult?.success ? followersResult.data.length : 0;
                const following = followingResult?.success ? followingResult.data.length : 0;

                const statsEl = document.getElementById('profileStats');
                if (statsEl) {
                    if (isOwnProfile) {
                        statsEl.innerHTML = `
                            <span onclick="window.location.href='following.html?userId=${profileUser.id}'">
                                <span class="count">${followers}</span> Followers
                            </span>
                            <span onclick="window.location.href='following.html?userId=${profileUser.id}'">
                                <span class="count">${following}</span> Following
                            </span>
                        `;
                    } else {
                        statsEl.innerHTML = `
                            <span style="cursor:default;"><span class="count">${followers}</span> Followers</span>
                            <span style="cursor:default;"><span class="count">${following}</span> Following</span>
                        `;
                    }
                }
            } catch (err) { }
        }

        async function toggleBlockUser() {
            if (!currentUser || !profileUser) return;
            try {
                const result = await window.apiRequest('/users/block', {
                    method: 'POST',
                    body: JSON.stringify({ user_id: currentUser.id, blocked_user_id: profileUser.id })
                });
                if (result && result.success) {
                    showAlert(result.action === 'blocked' ? `✅ ${profileUser.username} blocked!` : `✅ ${profileUser.username} unblocked!`, 'success');
                    location.reload();
                }
            } catch (err) { }
        }

        async function loadProfile(profileUserId) {
            try {
                const result = await window.apiRequest(`/users/${profileUserId}`);
                if (!result || !result.success) {
                    profileContainer.innerHTML = '<div style="text-align:center;padding:40px;color:#e94560;">❌ User not found</div>';
                    return;
                }

                profileUser = result.data;
                isOwnProfile = profileUserId === currentUser.id;
                document.getElementById('pageTitle').textContent = isOwnProfile ? 'My Profile' : profileUser.username;

                // ✅ Get blocked users (ensures blockedUsers is array)
                await getBlockedUsers();

                if (!isOwnProfile && isUserBlocked(profileUserId)) {
                    profileContainer.innerHTML = `
                        <div style="text-align:center;padding:40px;color:#e94560;">
                            <div style="font-size:48px;margin-bottom:16px;">🚫</div>
                            <h3>You have blocked this user</h3>
                            <p style="color:#b0b3b8;margin-top:8px;">Unblock them to see their profile.</p>
                        </div>
                    `;
                    postsContainer.innerHTML = '';
                    return;
                }

                await checkFollowStatus();
                renderProfile();
                await loadUserPosts(profileUserId);
            } catch (err) {
                profileContainer.innerHTML = `<div style="text-align:center;padding:40px;color:#e94560;">❌ Error loading profile</div>`;
            }
        }

        function renderProfile() {
            const user = profileUser;
            const isVerified = user.is_verified || false;

            profileContainer.innerHTML = `
                <div class="profile-header">
                    <div class="profile-avatar-row">
                        <div class="profile-avatar">${user.username.charAt(0).toUpperCase()}</div>
                        <div class="profile-name-row">
                            <div class="profile-username">
                                ${escapeHtml(user.username)}
                                ${isVerified ? `<span class="verified-badge"><i class="fas fa-check-circle"></i></span>` : ''}
                            </div>
                            <div class="profile-bio" id="profileBio">
                                ${user.bio ? escapeHtml(user.bio) : '<span style="color:#b0b3b8;">No bio yet</span>'}
                                ${isOwnProfile ? `<button class="bio-edit-btn" onclick="openBioModal()">✏️ Edit</button>` : ''}
                            </div>
                            <div class="profile-meta">
                                ${user.country ? `<span class="country"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(user.country)}</span>` : ''}
                            </div>
                            <div class="profile-stats" id="profileStats"><span>📊 Loading...</span></div>
                        </div>
                    </div>
                    <div class="profile-actions">
                        ${!isOwnProfile ? `
                            <button class="btn btn-primary" id="followBtn" onclick="toggleFollow()">+ Follow</button>
                            <button class="btn btn-danger" onclick="toggleBlockUser()">🚫 Block</button>
                        ` : ''}
                        <div style="position:relative;display:inline-block;">
                            <button class="btn btn-more" onclick="toggleMoreDropdown()"><i class="fas fa-ellipsis-h"></i></button>
                            <div class="more-dropdown" id="moreDropdown">
                                <button class="dropdown-item" onclick="shareProfileLink()">
                                    <span class="icon"><i class="fas fa-link"></i></span> Copy Profile Link
                                </button>
                                ${!isOwnProfile ? `
                                <button class="dropdown-item" onclick="reportUser()">
                                    <span class="icon"><i class="fas fa-flag"></i></span> Report User
                                </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            updateProfileStats();
            updateFollowButton();
        }

        function toggleMoreDropdown() {
            document.getElementById('moreDropdown').classList.toggle('show');
        }

        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('moreDropdown');
            if (dropdown && !e.target.closest('.profile-actions')) {
                dropdown.classList.remove('show');
            }
        });

        function shareProfileLink() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({ title: `${profileUser.username}'s Profile`, url: url });
            } else {
                navigator.clipboard.writeText(url).then(() => {
                    showAlert('✅ Profile link copied!', 'success');
                }).catch(() => {
                    prompt('Copy this link:', url);
                });
            }
        }

        function reportUser() {
            const reason = prompt(`Report ${profileUser.username}? Enter reason:`, 'Spam or abuse');
            if (reason && reason.trim()) {
                showAlert(`✅ Report sent against ${profileUser.username}`, 'success');
            }
        }

        function openBioModal() {
            bioTextarea.value = profileUser.bio || '';
            bioCharCount.textContent = bioTextarea.value.length;
            saveBioBtn.disabled = false;
            editBioModal.classList.add('open');
            setTimeout(() => bioTextarea.focus(), 100);
        }

        document.getElementById('saveBioBtn').addEventListener('click', async function() {
            const bio = bioTextarea.value.trim();
            if (!bio || bio.length > 100) {
                showAlert('Bio must be 1-100 characters!', 'error');
                return;
            }

            this.disabled = true;
            this.textContent = '⏳ Saving...';

            try {
                const result = await window.apiRequest(`/users/${currentUser.id}/bio`, {
                    method: 'PUT',
                    body: JSON.stringify({ bio: bio })
                });

                if (result && result.success) {
                    profileUser.bio = bio;
                    document.getElementById('profileBio').innerHTML = escapeHtml(bio) +
                        `<button class="bio-edit-btn" onclick="openBioModal()">✏️ Edit</button>`;
                    editBioModal.classList.remove('open');
                    showAlert('✅ Bio updated!', 'success');
                }
            } catch (err) { }

            this.disabled = false;
            this.textContent = 'Save';
        });

        async function loadUserPosts(userId) {
            try {
                const result = await window.apiRequest(`/users/${userId}/posts`);
                if (!result || !result.success) {
                    postsContainer.innerHTML = '<div class="no-posts">❌ Failed to load posts</div>';
                    return;
                }

                const posts = result.data || [];
                if (posts.length === 0) {
                    postsContainer.innerHTML = '<div class="no-posts">📝 No posts yet</div>';
                    return;
                }

                postsContainer.innerHTML = '';
                for (const post of posts) {
                    const postElement = await createPostElement(post);
                    postsContainer.appendChild(postElement);
                }
            } catch (err) { }
        }

        async function createPostElement(post) {
            let userLiked = false;
            if (currentUser) {
                try {
                    const result = await window.apiRequest(`/posts/${post.id}/liked?userId=${currentUser.id}`);
                    if (result && result.success) userLiked = result.data;
                } catch (e) {}
            }

            const timeAgoText = timeAgo(post.created_at);
            const isOwner = currentUser && post.user_id === currentUser.id;
            const isVerified = profileUser?.is_verified || false;

            const postDiv = document.createElement('div');
            postDiv.className = 'post-card';
            postDiv.id = `post-${post.id}`;

            let content = post.content || '';
            content = content.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');

            postDiv.innerHTML = `
                <div class="post-header">
                    <div class="post-left">
                        <div class="post-avatar" onclick="window.location.href='userprofile.html?userId=${post.user_id}'">
                            ${(post.username || 'U').charAt(0).toUpperCase()}
                        </div>
                        <div class="post-user-info">
                            <div class="post-username" onclick="window.location.href='userprofile.html?userId=${post.user_id}'">
                                ${escapeHtml(post.username || 'User')}
                                ${isVerified ? `<span class="verified-badge"><i class="fas fa-check-circle"></i></span>` : ''}
                            </div>
                            <div class="post-time">${timeAgoText}</div>
                        </div>
                    </div>
                    ${isOwner ? `
                    <div style="position:relative;">
                        <button class="post-more-btn" onclick="togglePostMenu('${post.id}')"><i class="fas fa-ellipsis-v"></i></button>
                        <div class="post-more-menu" id="postMenu-${post.id}">
                            <button class="menu-item danger" onclick="deletePost('${post.id}')">🗑️ Delete</button>
                        </div>
                    </div>
                    ` : ''}
                </div>
                <div class="post-content" onclick="window.location.href='post.html?postId=${post.id}'">${content}</div>
                <div class="post-stats">
                    <span>❤️ <span id="likeCount-${post.id}">${post.likes_count || 0}</span></span>
                    <span onclick="window.location.href='post.html?postId=${post.id}'">💬 ${post.comments_count || 0} comments</span>
                </div>
                <div class="post-actions">
                    <button class="post-action-btn ${userLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span>Like</span>
                    </button>
                    <button class="post-action-btn" onclick="window.location.href='post.html?postId=${post.id}'">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg>
                        <span>Comment</span>
                    </button>
                </div>
            `;
            return postDiv;
        }

        window.toggleLike = async function(postId) {
            if (!currentUser) return;
            const btn = document.querySelector(`.post-action-btn[onclick*="toggleLike('${postId}')"]`);
            if (!btn) return;

            const isLiked = btn.classList.contains('liked');
            const likeCountSpan = document.getElementById(`likeCount-${postId}`);
            if (!likeCountSpan) return;

            let currentCount = parseInt(likeCountSpan.textContent) || 0;

            try {
                if (isLiked) {
                    const result = await window.apiRequest(`/posts/${postId}/like`, {
                        method: 'DELETE',
                        body: JSON.stringify({ user_id: currentUser.id })
                    });
                    if (result && result.success) {
                        btn.classList.remove('liked');
                        likeCountSpan.textContent = currentCount - 1;
                    }
                } else {
                    const result = await window.apiRequest(`/posts/${postId}/like`, {
                        method: 'POST',
                        body: JSON.stringify({ user_id: currentUser.id })
                    });
                    if (result && result.success) {
                        btn.classList.add('liked');
                        likeCountSpan.textContent = currentCount + 1;
                    }
                }
            } catch (err) { }
        };

        window.deletePost = async function(postId) {
            if (!(await customConfirm('Delete Post', 'Are you sure you want to delete this post? This action cannot be undone.', '🗑️'))) return;

            try {
                const result = await window.apiRequest(`/posts/${postId}`, {
                    method: 'DELETE',
                    body: JSON.stringify({ user_id: currentUser.id })
                });
                if (result && result.success) {
                    const postEl = document.getElementById(`post-${postId}`);
                    if (postEl) postEl.remove();
                    showAlert('✅ Post deleted!', 'success');
                }
            } catch (err) { }
        };

        function togglePostMenu(postId) {
            const menu = document.getElementById(`postMenu-${postId}`);
            if (menu) menu.classList.toggle('show');
        }

        document.addEventListener('click', function(e) {
            document.querySelectorAll('.post-more-menu').forEach(menu => {
                if (!menu.contains(e.target) && !e.target.closest('.post-more-btn')) {
                    menu.classList.remove('show');
                }
            });
        });

        // ============================================================
        // PAGE LOAD
        // ============================================================
        document.addEventListener('DOMContentLoaded', async function() {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const result = await window.apiRequest(`/users/${userId}`);
                if (result && result.success) {
                    currentUser = result.data;
                } else {
                    localStorage.removeItem('userId');
                    window.location.href = 'login.html';
                    return;
                }
            } catch (err) {
                localStorage.removeItem('userId');
                window.location.href = 'login.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const profileUserId = urlParams.get('userId') || userId;
            await loadProfile(profileUserId);
        });

    </script>
</body>
</html>
