        @keyframes toolsDropIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tools-loading { text-align: center; padding: 1.2rem; color: #b0b3b8; font-size: 0.85rem; }
        .tool-item {
            background: #242526;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #3a3b3c;
        }
        .tool-item:hover { background: #2a2b2c; border-color: #4a4b4c; }
        .tool-info { display: flex; flex-direction: column; gap: 0.2rem; flex: 1; min-width: 0; }
        .tool-name { font-weight: bold; font-size: 0.95rem; word-break: break-word; color: #e4e6eb; }
        .tool-type {
            font-size: 0.7rem;
            color: #b0b3b8;
            background: #3a3b3c;
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            display: inline-block;
            width: fit-content;
        }
        .tool-views-badge { font-size: 0.65rem; color: #8b98a8; display: inline-flex; align-items: center; gap: 4px; }
        .tool-actions { display: flex; gap: 0.5rem; align-items: center; flex-shrink: 0; margin-left: 0.5rem; }
        .tool-share-btn, .tool-report-btn {
            background: none;
            border: none;
            color: #b0b3b8;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            border-radius: 50%;
            transition: 0.2s;
        }
        .tool-share-btn { font-size: 1.1rem; }
        .tool-report-btn { font-size: 1rem; }
        .tool-share-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .tool-report-btn:hover { background: rgba(233,69,96,0.15); color: #e94560; }
        .no-tools { text-align: center; padding: 2rem; color: #b0b3b8; }
        .no-tools i { font-size: 2rem; display: block; margin-bottom: 0.5rem; color: #b0b3b8; }
    </style>

</head>

<body>
    <div class="main-wrapper">
        <div class="main-container" id="mainContainer">
            <div class="back-header">
                <button class="back-btn" onclick="window.location.href='home.html'">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <span class="back-title" id="pageTitle">Profile</span>
            </div>
            
            <!-- SKELETON PROFILE -->
            <div id="skeletonProfile">
                <div class="skeleton-profile">
                    <div class="skeleton-profile-row">
                        <div class="skeleton-avatar"></div>
                        <div class="skeleton-name-block">
                            <div class="skeleton-line short"></div>
                            <div class="skeleton-line medium"></div>
                            <div class="skeleton-line long"></div>
                            <div class="skeleton-stats">
                                <span></span>
                                <span></span>
                            </div>
                        </div>
                    </div>
                    <div class="skeleton-actions">
                        <div class="skeleton-btn"></div>
                        <div class="skeleton-btn"></div>
                        <div class="skeleton-btn circle"></div>
                    </div>
                </div>
            </div>

            <!-- REAL PROFILE CONTAINER (hidden initially) -->
            <div id="profileContainer" style="display:none;"></div>

            <!-- TOOLS DROPDOWN (above post list) -->
            <div class="tools-toggle-section" id="toolsToggleSection" style="display:none;">
                <button class="tools-toggle-btn" id="toolsToggleBtn" type="button">
                    <span class="left"><i class="fas fa-wrench"></i> Tools <span class="tools-count-badge" id="toolsCountBadge" style="display:none;"></span></span>
                    <i class="fas fa-chevron-down toggle-chevron" id="toolsToggleChevron"></i>
                </button>
                <div class="tools-dropdown-list" id="toolsDropdownList" style="display:none;"></div>
            </div>

            <!-- SKELETON POSTS TITLE & POSTS -->
            <div id="skeletonPostsSection">
                <div class="skeleton-title"></div>
                <div class="skeleton-post">
                    <div class="skeleton-post-header">
                        <div class="skeleton-post-avatar"></div>
                        <div class="skeleton-post-info">
                            <div class="skeleton-line short" style="height:12px;"></div>
                            <div class="skeleton-line medium" style="height:10px;"></div>
                        </div>
                    </div>
                    <div class="skeleton-post-content">
                        <div class="skeleton-line long" style="height:12px;"></div>
                        <div class="skeleton-line long" style="height:12px;"></div>
                        <div class="skeleton-line medium" style="height:12px;"></div>
                    </div>
                    <div class="skeleton-post-stats">
                        <span></span>
                        <span></span>
                    </div>
                    <div class="skeleton-post-actions">
                        <div class="skeleton-post-action"></div>
                        <div class="skeleton-post-action"></div>
                    </div>
                </div>
                <div class="skeleton-post">
                    <div class="skeleton-post-header">
                        <div class="skeleton-post-avatar"></div>
                        <div class="skeleton-post-info">
                            <div class="skeleton-line short" style="height:12px;"></div>
                            <div class="skeleton-line medium" style="height:10px;"></div>
                        </div>
                    </div>
                    <div class="skeleton-post-content">
                        <div class="skeleton-line long" style="height:12px;"></div>
                        <div class="skeleton-line long" style="height:12px;"></div>
                        <div class="skeleton-line medium" style="height:12px;"></div>
                    </div>
                    <div class="skeleton-post-stats">
                        <span></span>
                        <span></span>
                    </div>
                    <div class="skeleton-post-actions">
                        <div class="skeleton-post-action"></div>
                        <div class="skeleton-post-action"></div>
                    </div>
                </div>
            </div>

            <!-- REAL POSTS CONTAINER (hidden initially) -->
            <div id="postsContainer" style="display:none;"></div>
        </div>
    </div>

    <!-- EDIT BIO MODAL -->
    <div class="modal-overlay" id="editBioModal">
        <div class="modal-box">
            <h3>✏️ Edit Bio</h3>
            <div class="char-count"><span id="bioCharCount">0</span>/100</div>
            <textarea id="bioTextarea" placeholder="Write something about yourself..." maxlength="100"></textarea>
            <div class="btn-row">
                <button class="btn-primary-modal" id="saveBioBtn">Save</button>
                <button class="btn-danger-modal" id="closeBioModal">Cancel</button>
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="js/config.js"></script>
    <script src="js/firebase-config.js"></script>
    <!-- ===== Custom confirm modal ===== -->
    <div class="custom-modal-overlay" id="customModal">
        <div class="custom-modal">
            <div class="modal-icon" id="modalIcon">⚠️</div>
            <h3 id="modalTitle">Are you sure?</h3>
            <p id="modalMessage">This action cannot be undone.</p>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">Cancel</button>
                <button class="btn-danger" id="modalConfirm">OK</button>
            </div>
        </div>
    </div>

    <script>
        // ===== Custom confirm =====
        let pendingConfirmResolve = null;
        function customConfirm(title, message, icon = '⚠️') {
            return new Promise(function(resolve) {
                document.getElementById('modalIcon').textContent = icon;
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalMessage').textContent = message;
                document.getElementById('customModal').classList.add('show');
                pendingConfirmResolve = resolve;
            });
        }
        document.getElementById('modalCancel').addEventListener('click', function() {
            document.getElementById('customModal').classList.remove('show');
            if (pendingConfirmResolve) { pendingConfirmResolve(false); pendingConfirmResolve = null; }
        });
        document.getElementById('modalConfirm').addEventListener('click', function() {
            document.getElementById('customModal').classList.remove('show');
            if (pendingConfirmResolve) { pendingConfirmResolve(true); pendingConfirmResolve = null; }
        });
        document.getElementById('customModal').addEventListener('click', function(e) {
            if (e.target === this) {
                document.getElementById('customModal').classList.remove('show');
                if (pendingConfirmResolve) { pendingConfirmResolve(false); pendingConfirmResolve = null; }
            }
        });

        // ===== SKELETON CONTROLS =====
        function showSkeleton() {
            document.getElementById('skeletonProfile').style.display = 'block';
            document.getElementById('skeletonPostsSection').style.display = 'block';
            document.getElementById('profileContainer').style.display = 'none';
            document.getElementById('postsContainer').style.display = 'none';
        }

        function hideSkeletonAndShowReal() {
            document.getElementById('skeletonProfile').style.display = 'none';
            document.getElementById('skeletonPostsSection').style.display = 'none';
            document.getElementById('profileContainer').style.display = 'block';
            document.getElementById('postsContainer').style.display = 'block';
        }

        // ============================================================
        // USERPROFILE.JS - FIXED (blockedUsers array handling)
        // ============================================================

        let currentUser = null;
        let profileUser = null;
        let isOwnProfile = false;
        let isFollowing = false;
        let blockedUsers = []; // ✅ Always initialize as empty array
        let profileTools = [];
        let profileToolsLoaded = false;

        const profileContainer = document.getElementById('profileContainer');
        const postsContainer = document.getElementById('postsContainer');
        const editBioModal = document.getElementById('editBioModal');
        const bioTextarea = document.getElementById('bioTextarea');
        const bioCharCount = document.getElementById('bioCharCount');
        const saveBioBtn = document.getElementById('saveBioBtn');
        const toolsToggleSection = document.getElementById('toolsToggleSection');
        const toolsToggleBtn = document.getElementById('toolsToggleBtn');
        const toolsToggleChevron = document.getElementById('toolsToggleChevron');
        const toolsDropdownList = document.getElementById('toolsDropdownList');
        const toolsCountBadge = document.getElementById('toolsCountBadge');

        bioTextarea.addEventListener('input', function() {
            bioCharCount.textContent = this.value.length;
            saveBioBtn.disabled = this.value.length === 0 || this.value.length > 100;
        });

        document.getElementById('closeBioModal').addEventListener('click', () => editBioModal.classList.remove('open'));

        // ===== FIXED: getBlockedUsers always returns array =====
        async function getBlockedUsers() {
            if (!currentUser) {
                blockedUsers = [];
                return blockedUsers;
            }
            try {
                const result = await window.apiRequest(`/users/${currentUser.id}/blocked`);
                // Ensure we have an array
                if (result && result.success && Array.isArray(result.data)) {
                    blockedUsers = result.data;
                } else {
                    blockedUsers = [];
                }
            } catch (err) {
                blockedUsers = [];
            }
            return blockedUsers;
        }

        // ===== FIXED: isUserBlocked checks array type =====
        function isUserBlocked(userId) {
            if (!Array.isArray(blockedUsers)) return false;
            return blockedUsers.includes(userId);
        }

        async function checkFollowStatus() {
            if (!currentUser || !profileUser || isOwnProfile) return;
            try {
                const result = await window.apiRequest(`/users/${currentUser.id}/following`);
                if (result && result.success) {
                    isFollowing = result.data.some(u => u.id === profileUser.id);
                    updateFollowButton();
                }
            } catch (err) { }
        }

        async function toggleFollow() {
            if (!currentUser || !profileUser || isOwnProfile) return;
            try {
                if (isFollowing) {
                    const result = await window.apiRequest('/users/follow', {
                        method: 'DELETE',
                        body: JSON.stringify({ follower_id: currentUser.id, following_id: profileUser.id })
                    });
                    if (result && result.success) {
                        isFollowing = false;
                        showAlert(`Unfollowed ${profileUser.username}`, 'info');
                    }
                } else {
                    const result = await window.apiRequest('/users/follow', {
                        method: 'POST',
                        body: JSON.stringify({ follower_id: currentUser.id, following_id: profileUser.id })
                    });
                    if (result && result.success) {
                        isFollowing = true;
                        showAlert(`Following ${profileUser.username}`, 'success');
                    }
                }
                updateFollowButton();
                updateProfileStats();
            } catch (err) { }
        }

        function updateFollowButton() {
            const btn = document.getElementById('followBtn');
            if (!btn) return;
            if (isFollowing) {
                btn.textContent = '✓ Following';
                btn.classList.add('following');
            } else {
                btn.textContent = '+ Follow';
                btn.classList.remove('following');
            }
        }

        async function updateProfileStats() {
            if (!profileUser) return;
            try {
                const [followersResult, followingResult] = await Promise.all([
                    window.apiRequest(`/users/${profileUser.id}/followers`),
                    window.apiRequest(`/users/${profileUser.id}/following`)
                ]);

                const followers = followersResult?.success ? followersResult.data.length : 0;
                const following = followingResult?.success ? followingResult.data.length : 0;

                const statsEl = document.getElementById('profileStats');
                if (statsEl) {
                    if (isOwnProfile) {
                        statsEl.innerHTML = `
                            <span onclick="window.location.href='following.html?userId=${profileUser.id}'">
                                <span class="count">${followers}</span> Followers
                            </span>
                            <span onclick="window.location.href='following.html?userId=${profileUser.id}'">
                                <span class="count">${following}</span> Following
                            </span>
                        `;
                    } else {
                        statsEl.innerHTML = `
                            <span style="cursor:default;"><span class="count">${followers}</span> Followers</span>
                            <span style="cursor:default;"><span class="count">${following}</span> Following</span>
                        `;
                    }
                }
            } catch (err) { }
        }

        async function toggleBlockUser() {
            if (!currentUser || !profileUser) return;
            try {
                const result = await window.apiRequest('/users/block', {
                    method: 'POST',
                    body: JSON.stringify({ user_id: currentUser.id, blocked_user_id: profileUser.id })
                });
                if (result && result.success) {
                    showAlert(result.action === 'blocked' ? `✅ ${profileUser.username} blocked!` : `✅ ${profileUser.username} unblocked!`, 'success');
                    location.reload();
                }
            } catch (err) { }
        }

        async function loadProfile(profileUserId) {
            // Show skeleton initially
            showSkeleton();

            try {
                const result = await window.apiRequest(`/users/${profileUserId}`);
                if (!result || !result.success) {
                    profileContainer.innerHTML = '<div style="text-align:center;padding:40px;color:#e94560;">❌ User not found</div>';
                    hideSkeletonAndShowReal();
                    return;
                }

                profileUser = result.data;
                isOwnProfile = profileUserId === currentUser.id;
                document.getElementById('pageTitle').textContent = isOwnProfile ? 'My Profile' : profileUser.username;

                // ✅ Get blocked users (ensures blockedUsers is array)
                await getBlockedUsers();

                if (!isOwnProfile && isUserBlocked(profileUserId)) {
                    profileContainer.innerHTML = `
                        <div style="text-align:center;padding:40px;color:#e94560;">
                            <div style="font-size:48px;margin-bottom:16px;">🚫</div>
                            <h3>You have blocked this user</h3>
                            <p style="color:#b0b3b8;margin-top:8px;">Unblock them to see their profile.</p>
                        </div>
                    `;
                    postsContainer.innerHTML = '';
                    toolsToggleSection.style.display = 'none';
                    hideSkeletonAndShowReal();
                    return;
                }

                // Reset tools dropdown state for this profile and show the toggle.
                profileTools = [];
                profileToolsLoaded = false;
                toolsDropdownList.style.display = 'none';
                toolsDropdownList.innerHTML = '';
                toolsToggleChevron.classList.remove('open');
                toolsCountBadge.style.display = 'none';
                toolsToggleSection.style.display = 'block';

                await checkFollowStatus();
                renderProfile();
                await loadUserPosts(profileUserId);
                hideSkeletonAndShowReal();
            } catch (err) {
                profileContainer.innerHTML = `<div style="text-align:center;padding:40px;color:#e94560;">❌ Error loading profile</div>`;
                hideSkeletonAndShowReal();
            }
        }

        // ============================================================
        // TOOLS DROPDOWN (above post list)
        // ============================================================

        toolsToggleBtn.addEventListener('click', async () => {
            const isOpen = toolsDropdownList.style.display !== 'none';
            if (isOpen) {
                toolsDropdownList.style.display = 'none';
                toolsToggleChevron.classList.remove('open');
                return;
            }
            toolsDropdownList.style.display = 'flex';
            toolsToggleChevron.classList.add('open');
            if (!profileToolsLoaded) {
                await loadProfileTools();
            }
        });

        async function loadProfileTools() {
            toolsDropdownList.innerHTML = '<div class="tools-loading"><i class="fas fa-spinner fa-spin"></i> Loading tools...</div>';
            try {
                const result = await window.apiRequest(`/users/${profileUser.id}/tools`);
                profileToolsLoaded = true;

                if (!result || !result.success || !Array.isArray(result.data) || result.data.length === 0) {
                    profileTools = [];
                    toolsCountBadge.style.display = 'none';
                    toolsDropdownList.innerHTML = '<div class="no-tools"><i class="fas fa-inbox"></i> No tools published yet</div>';
                    return;
                }

                profileTools = result.data;
                toolsCountBadge.textContent = profileTools.length;
                toolsCountBadge.style.display = 'inline-block';
                renderProfileTools(profileTools);
            } catch (err) {
                toolsDropdownList.innerHTML = '<div class="no-tools"><i class="fas fa-triangle-exclamation"></i> Failed to load tools</div>';
            }
        }

        function getToolViewerKey() {
            let key = localStorage.getItem('viewerKey');
            if (!key) {
                key = `v_${Date.now().toString(36)}_${Math.random().toString(36).slice(2)}`;
                localStorage.setItem('viewerKey', key);
            }
            return key;
        }

        async function recordProfileToolView(toolId) {
            if (toolId == null || String(toolId).trim() === '') return;
            try {
                const result = await window.apiRequest(`/tools/${encodeURIComponent(toolId)}/view`, {
                    method: 'POST',
                    body: JSON.stringify({ viewer_key: getToolViewerKey() })
                });
                if (result && result.success && typeof result.views_count === 'number') {
                    const t = profileTools.find(t => String(t.id) === String(toolId));
                    if (t) t.views_count = result.views_count;
                    const badge = toolsDropdownList.querySelector(`.tool-item[data-id="${CSS.escape(String(toolId))}"] .tool-views-count`);
                    if (badge) badge.textContent = result.views_count;
                }
            } catch (err) {}
        }

        function getProfileToolShareUrl(tool) {
            const path = window.location.pathname;
            const directory = path.substring(0, path.lastIndexOf('/') + 1);
            const baseUrl = `${window.location.origin}${directory}tool.html`;
            const id = tool && tool.id != null ? String(tool.id).trim() : '';
            if (id && id.toLowerCase() !== 'null' && id.toLowerCase() !== 'undefined') {
                return `${baseUrl}?id=${encodeURIComponent(id)}`;
            }
            return tool && tool.name ? `${baseUrl}?name=${encodeURIComponent(tool.name)}` : '';
        }

        function shareProfileTool(tool) {
            if (!tool || !tool.name || !tool.link) {
                showAlert('Unable to create share link: Tool information is missing.', 'error');
                return;
            }
            const shareUrl = getProfileToolShareUrl(tool);
            const shareData = {
                title: tool.name,
                text: `🔧 ${tool.name} - ${tool.type || 'Tool'}`,
                url: shareUrl
            };
            if (typeof window.openShareSheet === 'function') {
                window.openShareSheet(shareData);
                return;
            }
            if (navigator.share) {
                navigator.share(shareData).catch(() => {});
                return;
            }
            if (navigator.clipboard) {
                navigator.clipboard.writeText(shareUrl)
                    .then(() => showAlert('✅ Tool link copied!', 'success'))
                    .catch(() => window.prompt('Copy this tool link:', shareUrl));
            } else {
                window.prompt('Copy this tool link:', shareUrl);
            }
        }

        function renderProfileTools(tools) {
            toolsDropdownList.innerHTML = '';

            tools.forEach(tool => {
                const item = document.createElement('div');
                item.className = 'tool-item';
                item.setAttribute('data-id', tool.id);

                let domain = '';
                try { if (tool.link) domain = new URL(tool.link).hostname; } catch (e) {}
                const viewsCount = Number(tool.views_count) || 0;

                item.innerHTML = `
                    <div class="tool-info">
                        <div class="tool-name">${escapeHtml(tool.name)}</div>
                        <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                            <span class="tool-type">${escapeHtml(tool.type || 'Tool')}</span>
                            ${domain ? `<span style="font-size:0.6rem;color:#b0b3b8;">${escapeHtml(domain)}</span>` : ''}
                            <span class="tool-views-badge"><i class="fas fa-eye"></i> <span class="tool-views-count">${viewsCount}</span></span>
                        </div>
                    </div>
                    <div class="tool-actions">
                        <button class="tool-share-btn" title="Share"><i class="fas fa-share-alt"></i></button>
                        <button class="tool-report-btn" title="Report"><i class="fas fa-flag"></i></button>
                    </div>
                `;

                // VIEW - open the tool link and record a view
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.tool-share-btn') || e.target.closest('.tool-report-btn')) return;
                    if (tool.link) {
                        window.open(tool.link, '_blank');
                        recordProfileToolView(tool.id);
                    } else {
                        showAlert('No link available!', 'error');
                    }
                });

                // SHARE
                item.querySelector('.tool-share-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    shareProfileTool(tool);
                });

                // REPORT
                item.querySelector('.tool-report-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!currentUser) {
                        showAlert('Please login first!', 'error');
                        return;
                    }
                    window.openReportModal({ targetType: 'tool', targetId: tool.id, itemLabel: 'tool' });
                });

                toolsDropdownList.appendChild(item);
            });
        }

        function renderProfile() {
            const user = profileUser;
            const isVerified = user.is_verified || false;

            profileContainer.innerHTML = `
                <div class="profile-header">
                    <div class="profile-avatar-row">
                        <div class="profile-avatar">${user.username.charAt(0).toUpperCase()}</div>
                        <div class="profile-name-row">
                            <div class="profile-username">
                                ${escapeHtml(user.username)}
                                ${isVerified ? `<span class="verified-badge"><i class="fas fa-check-circle"></i></span>` : ''}
                            </div>
                            <div class="profile-bio" id="profileBio">
                                ${user.bio ? escapeHtml(user.bio) : '<span style="color:#b0b3b8;">No bio yet</span>'}
                                ${isOwnProfile ? `<button class="bio-edit-btn" onclick="openBioModal()">Edit BIO</button>` : ''}
                            </div>
                            <div class="profile-meta">
                                ${user.country ? `<span class="country"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(user.country)}</span>` : ''}
                            </div>
                            <div class="profile-stats" id="profileStats"><span>📊 Loading...</span></div>
                        </div>
                    </div>
                    <div class="profile-actions">
                        ${!isOwnProfile ? `
                            <button class="btn btn-primary" id="followBtn" onclick="toggleFollow()">+ Follow</button>
                            <button class="btn btn-danger" onclick="toggleBlockUser()">🚫 Block</button>
                        ` : ''}
                        <div style="position:relative;display:inline-block;">
                            <button class="btn btn-more" onclick="toggleMoreDropdown()"><i class="fas fa-ellipsis-h"></i></button>
                            <div class="more-dropdown" id="moreDropdown">
                                <button class="dropdown-item" onclick="shareProfileLink()">
                                    <span class="icon"><i class="fas fa-link"></i></span> Copy Profile Link
                                </button>
                                ${!isOwnProfile ? `
                                <button class="dropdown-item" onclick="reportUser()">
                                    <span class="icon"><i class="fas fa-flag"></i></span> Report User
                                </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            updateProfileStats();
            updateFollowButton();
        }

        function toggleMoreDropdown() {
            document.getElementById('moreDropdown').classList.toggle('show');
        }

        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('moreDropdown');
            if (dropdown && !e.target.closest('.profile-actions')) {
                dropdown.classList.remove('show');
            }
        });

        function shareProfileLink() {
            const url = window.location.origin + window.location.pathname + '?userId=' + profileUser.id;
            window.openShareSheet({ title: `${profileUser.username}'s Profile`, text: `Check out ${profileUser.username}'s profile`, url: url });
        }

        async function reportUser() {
            if (!currentUser) {
                showAlert('Please login first!', 'error');
                return;
            }
            window.openReportModal({ targetType: 'user', targetId: profileUser.id, itemLabel: `${profileUser.username}` });
        }

        function openBioModal() {
            bioTextarea.value = profileUser.bio || '';
            bioCharCount.textContent = bioTextarea.value.length;
            saveBioBtn.disabled = false;
            editBioModal.classList.add('open');
            setTimeout(() => bioTextarea.focus(), 100);
        }

        document.getElementById('saveBioBtn').addEventListener('click', async function() {
            const bio = bioTextarea.value.trim();
            if (!bio || bio.length > 100) {
                showAlert('Bio must be 1-100 characters!', 'error');
                return;
            }

            this.disabled = true;
            this.textContent = '⏳ Saving...';

            try {
                const result = await window.apiRequest(`/users/${currentUser.id}/bio`, {
                    method: 'PUT',
                    body: JSON.stringify({ bio: bio })
                });

                if (result && result.success) {
                    profileUser.bio = bio;
                    document.getElementById('profileBio').innerHTML = escapeHtml(bio) +
                        `<button class="bio-edit-btn" onclick="openBioModal()">✏️ Edit</button>`;
                    editBioModal.classList.remove('open');
                    showAlert('✅ Bio updated!', 'success');
                }
            } catch (err) { }

            this.disabled = false;
            this.textContent = 'Save';
        });

        async function loadUserPosts(userId) {
            try {
                const result = await window.apiRequest(`/users/${userId}/posts`);
                if (!result || !result.success) {
                    postsContainer.innerHTML = '<div class="no-posts">❌ Failed to load posts</div>';
                    return;
                }

                const posts = result.data || [];
                if (posts.length === 0) {
                    postsContainer.innerHTML = '<div class="no-posts">📝 No posts yet</div>';
                    return;
                }

                postsContainer.innerHTML = '';
                for (const post of posts) {
                    const postElement = await createPostElement(post);
                    postsContainer.appendChild(postElement);
                }
            } catch (err) { }
        }

        async function createPostElement(post) {
            let userLiked = false;
            if (currentUser) {
                try {
                    const result = await window.apiRequest(`/posts/${post.id}/liked?userId=${currentUser.id}`);
                    if (result && result.success) userLiked = result.data;
                } catch (e) {}
            }

            const timeAgoText = timeAgo(post.created_at);
            const isOwner = currentUser && post.user_id === currentUser.id;
            const isVerified = profileUser?.is_verified || false;

            const postDiv = document.createElement('div');
            postDiv.className = 'post-card';
            postDiv.id = `post-${post.id}`;

            let content = post.content || '';
            content = content.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');

            postDiv.innerHTML = `
                <div class="post-header">
                    <div class="post-left">
                        <div class="post-avatar" onclick="window.location.href='userprofile.html?userId=${post.user_id}'">
                            ${(post.username || 'U').charAt(0).toUpperCase()}
                        </div>
                        <div class="post-user-info">
                            <div class="post-username" onclick="window.location.href='userprofile.html?userId=${post.user_id}'">
                                ${escapeHtml(post.username || 'User')}
                                ${isVerified ? `<span class="verified-badge"><i class="fas fa-check-circle"></i></span>` : ''}
                            </div>
                            <div class="post-time">${timeAgoText}</div>
                        </div>
                    </div>
                    ${isOwner ? `
                    <div style="position:relative;">
                        <button class="post-more-btn" onclick="togglePostMenu('${post.id}')"><i class="fas fa-ellipsis-v"></i></button>
                        <div class="post-more-menu" id="postMenu-${post.id}">
                            <button class="menu-item danger" onclick="deletePost('${post.id}')"> Delete</button>
                        </div>
                    </div>
                    ` : ''}
                </div>
                <div class="post-content" onclick="window.location.href='post.html?postId=${post.id}'">${content}</div>
                <div class="post-stats">
                    <span>❤️ <span id="likeCount-${post.id}">${post.likes_count || 0}</span></span>
                    <span onclick="window.location.href='post.html?postId=${post.id}'">💬 ${post.comments_count || 0} comments</span>
                </div>
                <div class="post-actions">
                    <button class="post-action-btn ${userLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span>Like</span>
                    </button>
                    <button class="post-action-btn" onclick="window.location.href='post.html?postId=${post.id}'">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg>
                        <span>Comment</span>
                    </button>
                    <button class="post-action-btn" onclick="sharePost('${post.id}', event)">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L7.04 9.81C6.5 9.31 5.79 9 5 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                        <span>Share</span>
                    </button>
                </div>
            `;
            return postDiv;
        }

        // ============================================================
        // SHARE POST (custom share sheet: copy link + social apps)
        // ============================================================
        function sharePost(postId, event) {
            if (event) event.stopPropagation();
            const url = window.location.origin + '/post.html?postId=' + postId;
            window.openShareSheet({ title: 'SociaLock', text: 'Check out this post', url });
        }
        window.sharePost = sharePost;

        window.toggleLike = async function(postId) {
            if (!currentUser) return;
            const btn = document.querySelector(`.post-action-btn[onclick*="toggleLike('${postId}')"]`);
            if (!btn) return;

            const isLiked = btn.classList.contains('liked');
            const likeCountSpan = document.getElementById(`likeCount-${postId}`);
            if (!likeCountSpan) return;

            let currentCount = parseInt(likeCountSpan.textContent) || 0;

            try {
                if (isLiked) {
                    const result = await window.apiRequest(`/posts/${postId}/like`, {
                        method: 'DELETE',
                        body: JSON.stringify({ user_id: currentUser.id })
                    });
                    if (result && result.success) {
                        btn.classList.remove('liked');
                        likeCountSpan.textContent = currentCount - 1;
                    }
                } else {
                    const result = await window.apiRequest(`/posts/${postId}/like`, {
                        method: 'POST',
                        body: JSON.stringify({ user_id: currentUser.id })
                    });
                    if (result && result.success) {
                        btn.classList.add('liked');
                        likeCountSpan.textContent = currentCount + 1;
                    }
                }
            } catch (err) { }
        };

        window.deletePost = async function(postId) {
            if (!(await customConfirm('Delete Post', 'Are you sure you want to delete this post? This action cannot be undone.', ''))) return;

            try {
                const result = await window.apiRequest(`/posts/${postId}`, {
                    method: 'DELETE',
                    body: JSON.stringify({ user_id: currentUser.id })
                });
                if (result && result.success) {
                    const postEl = document.getElementById(`post-${postId}`);
                    if (postEl) postEl.remove();
                    showAlert('✅ Post deleted!', 'success');
                }
            } catch (err) { }
        };

        function togglePostMenu(postId) {
            const menu = document.getElementById(`postMenu-${postId}`);
            if (menu) menu.classList.toggle('show');
        }

        document.addEventListener('click', function(e) {
            document.querySelectorAll('.post-more-menu').forEach(menu => {
                if (!menu.contains(e.target) && !e.target.closest('.post-more-btn')) {
                    menu.classList.remove('show');
                }
            });
        });

        // ============================================================
        // PAGE LOAD
        // ============================================================
        document.addEventListener('DOMContentLoaded', async function() {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const result = await window.apiRequest(`/users/${userId}`);
                if (result && result.success) {
                    currentUser = result.data;
                } else {
                    localStorage.removeItem('userId');
                    window.location.href = 'login.html';
                    return;
                }
            } catch (err) {
                localStorage.removeItem('userId');
                window.location.href = 'login.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const profileUserId = urlParams.get('userId') || userId;
            await loadProfile(profileUserId);
        });

        // ===== UTILITY FUNCTIONS =====
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function timeAgo(date) {
            if (!date) return 'Just now';
            try {
                const now = new Date();
                const past = new Date(date);
                const diffInSeconds = Math.floor((now - past) / 1000);
                if (diffInSeconds < 5) return 'Just now';
                if (diffInSeconds < 60) return diffInSeconds + 's ago';
                const minutes = Math.floor(diffInSeconds / 60);
                if (minutes < 60) return minutes + 'm ago';
                const hours = Math.floor(minutes / 60);
                if (hours < 24) return hours + 'h ago';
                const days = Math.floor(hours / 24);
                if (days < 7) return days + 'd ago';
                const weeks = Math.floor(days / 7);
                if (weeks < 4) return weeks + 'w ago';
                const months = Math.floor(days / 30);
                if (months < 12) return months + 'mo ago';
                const years = Math.floor(days / 365);
                return years + 'y ago';
            } catch (e) {
                return 'Just now';
            }
        }

        function showAlert(message, type = 'info') {
            const existing = document.querySelector('.custom-alert');
            if (existing) existing.remove();

            const alertDiv = document.createElement('div');
            alertDiv.className = `custom-alert ${type}`;
            alertDiv.textContent = message;
            document.body.appendChild(alertDiv);

            setTimeout(() => {
                alertDiv.remove();
            }, 3000);
        }

        window.showAlert = showAlert;
        window.escapeHtml = escapeHtml;
        window.timeAgo = timeAgo;

    </script>
</body>
</html>
